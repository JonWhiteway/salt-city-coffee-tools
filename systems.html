<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salt City Coffee — Systems</title>
<style>
  :root { --ink:#241F18; --ink-soft:#5A5245; --paper:#F7F4EC; --card:#FFFFFF; --line:#E1D9C4; --accent:#EB6834; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--paper);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .brand-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 6px;
    background: var(--accent);
  }
  .wrap { max-width: 460px; padding: 20px; text-align: center; }
  .logo-mark {
    display: block;
    width: 88px;
    height: 88px;
    border-radius: 50%;
    margin: 0 auto 20px;
    object-fit: cover;
    object-position: center;
    box-shadow: 0 4px 14px rgba(35, 75, 110, 0.3);
  }
  h1 {
    font-size: 28px;
    margin: 0 0 36px;
    letter-spacing: -0.01em;
    font-weight: 800;
    color: var(--accent);
  }
  .home-grid { display: flex; flex-direction: column; gap: 18px; }
  a.app-link {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 42px 24px;
    text-decoration: none;
    color: var(--ink);
    font-weight: 800;
    font-size: 22px;
    box-shadow: 0 2px 10px rgba(28, 31, 26, 0.05);
    transition: box-shadow .15s, transform .1s;
  }
  a.app-link:active { transform: scale(0.98); }
  a.app-link:hover { box-shadow: 0 4px 16px rgba(28, 31, 26, 0.09); }
  a.app-link.warehouse { border-top: 7px solid var(--accent); }
  a.app-link.cafe { border-top: 7px solid #6d5a9e; }
  .app-link.bakery { border-top: 7px solid #d68910; }
  a.app-link span.sub {
    display: block;
    font-weight: 500;
    font-size: 16px;
    color: var(--ink-soft);
  }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Oswald:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>

:root {
  --ink:#241F18; --ink-soft:#5A5245; --paper:#F7F4EC; --card:#FFFFFF;
  --line:#E1D9C4; --accent:#EB6834; --accent-soft:#FCE3D4;
  --warn:#B8860B; --warn-soft:#F7EBC9; --good:#0CA30C; --good-soft:#DCF3DC;
  --radius:10px;
  --bg:#F7F4EC; --surface:#FFFFFF; --surface-alt:#EFE9DA;
  --ink-2:#5A5245; --ink-3:#8B826F; --border:#E1D9C4; --border-soft:#EEE7D6;
  --accent-ink:#FFFFFF; --caramel:#B9852E; --caramel-soft:#F3E2BC;
  --serious:#C15A34; --critical:#D03B3B; --serious-soft:#F7DFCF; --critical-soft:#F8DADA;
  --font-display:'Oswald','Arial Narrow',sans-serif;
  --font-body:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
html { -webkit-text-size-adjust:100%; }
body {
  background:var(--bg); color:var(--ink); font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4 { font-family:var(--font-display); font-weight:600; color:var(--ink); }
button,input,select,textarea { font-family:inherit; }
::selection { background:var(--accent-soft); color:var(--ink); }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
header { border-top-color:var(--accent) !important; }
header h1 { color:var(--ink) !important; font-family:var(--font-display); letter-spacing:.01em; text-transform:uppercase; }
button.primary, .save-btn, .back-btn.primary, .cart-bar button, .submit-bar button,
.login-wrap button, .login-wrap .submit-btn {
  background:var(--accent); color:#fff;
}
button.primary:hover, .save-btn:hover, .cart-bar button:hover, .submit-bar button:hover,
.login-wrap button:hover { background:#D95727; }
.item-row.has-qty { border-color:var(--accent); background:var(--accent-soft); }
.chip.active, .filter-banner { border-color:var(--accent); }
.chip.active { background:var(--accent); color:#fff; }
.search-row input:focus, input:focus, select:focus, textarea:focus { border-color:var(--accent); }
.home-btn, .cafe-btn, .order-card, .item-row, .inv-row, .hist-row, .card-block {
  box-shadow:0 1px 2px rgba(36,31,24,.06),0 1px 1px rgba(36,31,24,.04);
}
.home-btn-a, .home-btn-b, .home-btn-c, .home-btn,
.home-btn-a:hover, .home-btn-b:hover, .home-btn-c:hover { border-top-color:var(--accent); }
a, .nav-link, .back-btn, .item-info .price, .qty-stepper button { color:var(--accent); }
.badge.delivered, .badge.paid { background:var(--good-soft); color:var(--good); }
.badge.picking { background:var(--warn-soft); color:#8A6500; }
.badge.submitted { background:var(--serious-soft); color:var(--serious); }

body { min-height:100vh; }
.brand-bar { background:var(--accent); }
h1 { color:var(--ink); font-family:var(--font-display); text-transform:uppercase; letter-spacing:.02em; }
a.app-link { border:1px solid var(--border); border-top:6px solid var(--accent); border-radius:10px; box-shadow:0 1px 2px rgba(36,31,24,.06); }
a.app-link.warehouse, a.app-link.cafe, a.app-link.bakery { border-top-color:var(--accent); }
a.app-link:hover { box-shadow:0 6px 20px rgba(36,31,24,.10); }
a.app-link span.sub { color:var(--ink-2); }

</style>
