<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#284A70">
<title>Your Espresso Bar Proposal — Salt City Coffee</title>
<link rel="stylesheet" href="/mobile-bar-brand.css">
<style>
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);margin-bottom:16px}
.facts div{padding:12px 14px;border-right:1px solid var(--line);min-width:0}
.facts div:last-child{border-right:0}
.facts b{display:block;font-size:16px;overflow-wrap:anywhere}
@media (max-width:620px){.facts{grid-template-columns:1fr 1fr}.facts div:nth-child(2){border-right:0}.facts div:nth-child(-n+2){border-bottom:1px solid var(--line)}}
.two{display:grid;grid-template-columns:1fr 1.25fr;gap:16px}
@media (max-width:680px){.two{grid-template-columns:1fr}}
ul.tight{margin:0;padding-left:18px;display:grid;gap:4px}
.terms h3{font-family:var(--f-label);font-size:11px;letter-spacing:.18em;text-transform:uppercase;margin:6px 0 2px}
.terms p,.terms li{font-size:14.5px}
.terms p{margin:0}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pay .card{margin:0}
.pay b{font-size:24px;font-family:var(--f-display);font-weight:400}
.sign{border:2px solid var(--ink)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--navy);flex:none}
.signed{font-family:"Brush Script MT","Segoe Script",cursive;font-size:28px;color:var(--ink)}
@media print{.hero{border-bottom-width:3px}.sign{border-width:1px}}
</style>
</head>
<body>

 441 460C446 466 453 475 456 480C460 485 463 488 464 488C467 488 481 477 489 468C504 453 512 440 516 426C517 422 519 419 519 418C521 417 588 418 589 419C591 420 585 443 580 454C571 475 563 489 551 503C545 511 522 533 515 539C509 543 507 545 509 547C509 548 520 563 534 581C547 599 560 617 563 620C566 624 568 628 568 628C568 629 564 637 560 645C555 654 547 670 541 681C535 692 528 706 524 712L518 722L298 723L77 723L75 721ZM468 653C469 652 472 647 474 642C477 637 479 632 480 632C483 630 481 626 472 614C458 594 446 578 444 575L442 572L298 572L156 572L154 574C153 575 149 580 145 586C141 591 133 602 127 610C121 618 115 626 114 627L112 630L116 639C119 645 121 649 121 650C121 650 122 651 123 652C125 654 129 654 322 655C458 655 467 655 468 653ZM304 270C305 269 309 263 313 258C317 253 324 243 329 237C338 225 343 218 349 211C351 209 353 206 353 205C353 203 353 203 301 203C256 203 249 203 249 204C249 205 251 209 253 212C256 215 262 223 267 230C272 237 281 248 286 255C291 262 296 269 297 270C299 274 301 274 304 270ZM410 131C413 128 436 97 442 89C444 86 447 82 449 79C452 77 453 74 453 73C453 71 452 71 314 70C238 70 170 70 163 70C147 69 146 70 153 78C159 85 172 102 184 119L194 133L297 133C354 133 402 134 404 134C407 134 408 133 410 131Z"/></svg></div><div class="co">Salt City Coffee<span>Syracuse, NY</span></div></div>

    <h1 id="h1">Your proposal</h1>

</div>

<div class="wrap" id="app"><div class="card"><p class="muted">Loading your proposal…</p></div></div>

<script>
(function () {
  "use strict";
  var URL_ = "https://dwysvcprzvmhxrrnogqb.supabase.co", KEY = "sb_publishable_Xg_k2Kqg-I5NHDT4Ff7X1g_EYCQxUON";
  var token = new URLSearchParams(location.search).get("t") || "";
  var app = document.getElementById("app");
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function money(n) { return "$" + Number(n || 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function dlong(d) { return d ? new Date(d + "T12:00:00").toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" }) : "—"; }
  function dshort(d) { return d ? new Date(d + "T12:00:00").toLocaleDateString("en-US", { month: "long", day: "numeric" }) : "—"; }
  function tm(t) { if (!t) return ""; var p = t.split(":"), h = +p[0], m = p[1]; return ((h % 12) || 12) + (m !== "00" ? ":" + m : "") + (h < 12 ? " am" : " pm"); }
  function hrs(a, b) { if (!a || !b) return null; var x = a.split(":"), y = b.split(":"); var d = (+y[0] * 60 + +y[1]) - (+x[0] * 60 + +x[1]); if (d < 0) d += 1440; return Math.round(d / 30) / 2; }
  function addDays(d, n) { var x = new Date(d + "T12:00:00"); x.setDate(x.getDate() + n); return x.toISOString().slice(0, 10); }
  function rpc(fn, args) {
    return fetch(URL_ + "/rest/v1/rpc/" + fn, { method: "POST", headers: { apikey: KEY, "Content-Type": "application/json" }, body: JSON.stringify(args) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.message || "Something went wrong"); return j; }); });
  }

  if (!token) { fail("This link is missing its proposal code. Please use the link from Maria's email."); return; }
  rpc("mb_public_quote", { p_token: token }).then(render).catch(function (e) { fail(e.message); });

  function fail(m) {
    document.getElementById("h1").textContent = "Proposal not found";
    document.getElementById("lede").textContent = "";
    app.innerHTML = '<div class="msg err">' + esc(m || "We couldn't find this proposal.") + ' Questions? Call Maria at 315-372-1499 or email maria@saltcitycoffee.com.</div>';
  }

  function render(q) {
    if (!q) { fail("We couldn't find this proposal."); return; }
    var e = q.event, t = q.terms;
    var first = String(e.name || "").trim().split(/\s+/)[0];
    document.getElementById("h1").textContent = "Prepared for " + first;
    document.getElementById("lede").textContent = e.event_type + " · " + dlong(e.event_date);
    document.title = "Espresso Bar Proposal for " + e.name + " — Salt City Coffee";
    var h = hrs(e.service_start, e.service_end) || t.included_hours;
    var guests = e.guests || e.headcount;
    var accepted = q.status === "accepted";
    var replaced = q.status === "superseded";
    var expired = !accepted && q.valid_until && q.valid_until < new Date().toISOString().slice(0, 10);
    var extraRate = t.extra_hour_rate || t.tier_extra_rate;
    var depDue = accepted ? addDays(q.accepted_at.slice(0, 10), t.deposit_due_days) : null;
    var balDue = addDays(e.event_date, -t.balance_due_days_before);

    var rows = q.lines.map(function (l) {
      return '<tr><td>' + esc(l.label) + (l.detail ? '<span class="det">' + esc(l.detail) + '</span>' : '') + '</td><td class="r">' + money(l.amount) + '</td></tr>';
    }).join("");
    rows += '<tr><td>Sales tax (' + (q.tax_exempt ? 'exempt' : Math.round(q.tax_rate * 100) + '%') + ')<span class="det">On the package, extra time and add-ons</span></td><td class="r">' + money(q.tax) + '</td></tr>';
    rows += '<tr><td>Gratuity (' + Math.round(q.gratuity_pct * 100) + '%)<span class="det">Paid directly to the baristas serving your event</span></td><td class="r">' + money(q.gratuity) + '</td></tr>';
    rows += '<tr class="tot"><td>Total</td><td class="r">' + money(q.total) + '</td></tr>';

    var banner = "";
    if (replaced) banner = '<div class="msg warn">This proposal has been replaced by a newer version.' + (q.superseded_by ? ' <a href="?t=' + esc(q.superseded_by) + '">Open the latest proposal</a>.' : '') + '</div>';
    else if (accepted) banner = '<div class="msg ok"><b>Accepted ' + new Date(q.accepted_at).toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" }) + ' by ' + esc(q.accepted_name) + '.</b> Your date is on our calendar.' + (e.invoice_url ? ' <a href="' + esc(e.invoice_url) + '" target="_blank" rel="noopener">Open your invoice</a>.' : ' Your invoice from Square is on its way by email.') + '</div>';
    else if (expired) banner = '<div class="msg warn">This proposal expired on ' + dshort(q.valid_until) + '. Reply to Maria\'s email and she\'ll send an updated one.</div>';

    app.innerHTML = banner +
      '<div class="stage"><h2>The event</h2><span class="badge">v' + q.version + '</span></div>' +
      '<div class="facts">' +
        '<div><span class="lab">Date</span><b>' + esc(dlong(e.event_date)) + '</b></div>' +
        '<div><span class="lab">Venue</span><b>' + esc(e.venue || "TBD") + '</b></div>' +
        '<div><span class="lab">Service</span><b>' + (e.service_start ? esc(tm(e.service_start) + "–" + tm(e.service_end)) : esc(e.timeframe || "TBD")) + ' · ' + h + ' hrs</b></div>' +
        '<div><span class="lab">Guests</span><b>Up to ' + esc(guests) + '</b></div>' +
      '</div>' +
      '<p class="muted" style="margin:-4px 0 16px">Set-up begins 1 hour before service; tear-down at the end of the event. Prepared for ' + esc(e.name) + ' · ' + esc(e.email) + (e.phone ? ' · ' + esc(e.phone) : '') + '</p>' +

      '<div class="two">' +
        '<div class="card"><span class="lab">What\'s included</span><ul class="tight">' +
          '<li><b>Unlimited</b> espresso-bar service for the full service time</li>' +
          '<li>Espresso, cappuccino, latte, mocha and hot chocolate, hot or iced</li>' +
          '<li>Whole and oat milk</li>' +
          '<li>Syrups: vanilla, sugar-free vanilla, caramel, mocha, hazelnut</li>' +
          '<li>Cups and lids</li>' +
          '<li>Our baristas, set-up and tear-down</li>' +
        '</ul></div>' +
        '<div class="card"><span class="lab">Investment</span><table class="inv">' + rows + '</table></div>' +
      '</div>' +

      '<div class="stage"><h2>Payment</h2></div>' +
      '<div class="pay">' +
        '<div class="card"><span class="lab">Deposit · ' + Math.round(t.deposit_pct * 100) + '%</span><b class="num">' + money(q.deposit) + '</b><span class="muted">' + (accepted ? 'Due ' + dshort(depDue) : 'Due within ' + t.deposit_due_days + ' days of accepting; holds your date') + '</span></div>' +
        '<div class="card"><span class="lab">Final balance</span><b class="num">' + money(q.balance) + '</b><span class="muted">Due ' + dshort(balDue) + ' (' + t.balance_due_days_before + ' days before the event)</span></div>' +
      '</div>' +

      '<div class="stage"><h2>Key terms</h2></div>' +
      '<div class="card terms">' +
        '<ul class="tight">' +
          '<li><b>Guest count:</b> final count due ' + t.balance_due_days_before + ' days before the event.' + (extraRate ? ' Extra service time is ' + money(extraRate) + '/hr.' : '') + '</li>' +
          '<li><b>Venue needs:</b> vehicle access, a level 10×10 ft space, and a dedicated outlet within 25 ft.</li>' +
          '<li><b>Outside events:</b> a covering must be provided.</li>' +
          '<li><b>Changes to time or location:</b> must be requested in writing at least 7 days before the event and are subject to availability and a revised proposal.</li>' +
        '</ul>' +
        '<h3>Unlimited drink service</h3>' +
        '<p>Unlimited packages let guests enjoy drinks throughout the event without paying per drink. The price is based on expected overall consumption, since not every guest will drink and some will have more than one. We include a ' + t.drink_cushion + '-drink cushion for variation; if consumption goes well beyond that, we move to the next package level. This keeps packages affordable while we keep the service great.</p>' +
        '<h3>Venue and client responsibilities</h3>' +
        '<ul class="tight"><li><b>Vehicle access</b> to the set-up area at least 1 hour before service.</li>' +
          '<li><b>Access to the serving location:</b> a clear, firm, flat path. The bar can\'t be moved over grass, stones, gravel or uneven ground, and can\'t be lifted up stairs or onto decks; the location must be at ground level or reachable by elevator.</li></ul>' +
        '<h3>Cancellation</h3>' +
        '<ul class="tight"><li>The deposit is non-refundable. Within 7 days of the event, the full balance is due.</li>' +
          '<li>If we cancel, you receive a full refund.</li>' +
          '<li>Neither party is liable for events beyond reasonable control, such as severe weather, illness or venue closure; we will reschedule or refund payments.</li>' +
          '<li>In an emergency, contact ' + esc(t.maria_name.split(" ")[0]) + ' at ' + esc(t.maria_phone) + '.</li></ul>' +
        (q.custom_terms ? '<h3>Notes for your event</h3><p>' + esc(q.custom_terms).replace(/\n/g, "<br>") + '</p>' : '') +
      '</div>' +

      '<div class="stage"><h2>Accept this proposal</h2></div>' +
      '<div class="card sign" id="sign"></div>' +
      '<div class="actions noprint" style="justify-content:space-between"><button class="secondary" type="button" onclick="window.print()">Print or save as PDF</button>' +
      '<span class="muted" style="font-size:14px">Questions? ' + esc(t.maria_name) + ' · ' + esc(t.maria_phone) + ' · ' + esc(t.maria_email) + '</span></div>' +
      '<div class="foot">Salt City Coffee · Great Coffee, Building Community</div>';

    var sign = document.getElementById("sign");
    if (accepted) {
      sign.innerHTML = '<div class="row2"><div><span class="lab">Client</span><div class="signed">' + esc(q.accepted_name) + '</div><span class="muted">Signed online ' + new Date(q.accepted_at).toLocaleString("en-US") + '</span></div>' +
        '<div><span class="lab">Salt City Coffee Espresso Bar</span><div class="signed">' + esc(t.maria_name) + '</div></div></div>';
      return;
    }
    if (replaced || expired) { sign.innerHTML = '<p class="muted">This proposal can no longer be accepted online.</p>'; return; }
    sign.innerHTML =
      '<p style="margin:0">By accepting, you agree to the pricing and terms above and to pay the deposit to reserve your date. Your invoice will arrive from Square by email.</p>' +
      '<div class="field"><label for="nm">Your full name</label><input id="nm" autocomplete="name" maxlength="200" value=""></div>' +
      '<label class="check"><input type="checkbox" id="ok"> I accept this proposal for ' + esc(dlong(e.event_date)) + ', total ' + money(q.total) + '.</label>' +
      '<div class="msg err" id="err" hidden></div>' +
      '<div class="actions"><button class="primary" id="go" type="button">Accept proposal</button></div>';
    document.getElementById("go").addEventListener("click", function () {
      var nm = document.getElementById("nm").value.trim(), ok = document.getElementById("ok").checked, err = document.getElementById("err"), btn = this;
      if (nm.length < 2 || !ok) { err.textContent = "Type your full name and check the box to accept."; err.hidden = false; return; }
      btn.disabled = true; btn.textContent = "Accepting…"; err.hidden = true;
      fetch(URL_ + "/functions/v1/mb-accept", { method: "POST", headers: { apikey: KEY, "Content-Type": "application/json" }, body: JSON.stringify({ action: "accept", token: token, name: nm, agree: true }) })
        .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || "Something went wrong."); return j; }); })
        .then(function () { return rpc("mb_public_quote", { p_token: token }); })
        .then(function (q2) { render(q2); window.scrollTo({ top: 0, behavior: "smooth" }); })
        .catch(function (e2) { err.textContent = e2.message; err.hidden = false; btn.disabled = false; btn.textContent = "Accept proposal"; });
    });
  }
})();
</script>
