<title>Cold Brew Production — Execution</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F7F4EC; --surface:#FFFFFF; --surface-alt:#EFE9DA;
  --ink:#241F18; --ink-2:#5A5245; --ink-3:#8B826F; --border:#E1D9C4;
  --accent:#EB6834; --accent-ink:#FFFFFF; --accent-soft:#FCE3D4;
  --caramel:#B9852E;
  --good:#0CA30C; --warn:#B8860B; --critical:#D03B3B;
  --good-soft:#DCF3DC; --warn-soft:#F7EBC9; --critical-soft:#F8DADA;
  --font-display:'Fraunces',Georgia,'Iowan Old Style',serif;
  --font-body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14100C; --surface:#1D1811; --surface-alt:#241E16;
    --ink:#F1EBDC; --ink-2:#C3B9A3; --ink-3:#8D826C; --border:#382F22;
    --accent:#F0824C; --accent-ink:#1D1811; --accent-soft:#3A2418;
    --caramel:#D9AE6E;
    --good:#3FCB3F; --warn:#E0B23B; --critical:#E66767;
    --good-soft:#193119; --warn-soft:#332A11; --critical-soft:#3A1919;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14100C; --surface:#1D1811; --surface-alt:#241E16;
  --ink:#F1EBDC; --ink-2:#C3B9A3; --ink-3:#8D826C; --border:#382F22;
  --accent:#F0824C; --accent-ink:#1D1811; --accent-soft:#3A2418;
  --caramel:#D9AE6E;
  --good:#3FCB3F; --warn:#E0B23B; --critical:#E66767;
  --good-soft:#193119; --warn-soft:#332A11; --critical-soft:#3A1919;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box;}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:17px; line-height:1.45; -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;}
h1,h2{font-family:var(--font-display); font-weight:700; margin:0; color:var(--ink);}
button{font-family:inherit; touch-action:manipulation;}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px; border-radius:4px;}

.wrap{max-width:640px; margin:0 auto; padding:20px 18px 100px;}
.eyebrow{font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--caramel); font-weight:700;}
h1{font-size:26px; margin-top:4px;}
.status-line{font-size:12.5px; color:var(--ink-3); margin-top:10px;}
.full-link{display:inline-block; font-size:13px; color:var(--ink-3); text-decoration:none; margin-top:8px;}
.full-link:hover{color:var(--accent);}

.date-bar{display:flex; align-items:center; gap:8px; margin-top:16px; flex-wrap:wrap;}
.date-bar button{
  border-radius:10px; border:1.5px solid var(--border); background:var(--surface); color:var(--ink);
  font-size:14.5px; font-weight:600; padding:9px 14px; min-height:42px; cursor:pointer;
}
.date-bar button:hover{border-color:var(--accent);}
.date-bar input[type=date]{font-family:inherit; font-size:15px; padding:9px 10px; border-radius:10px; border:1.5px solid var(--border); background:var(--surface); color:var(--ink); min-height:42px;}

h2.section-title{font-size:18px; margin:28px 0 12px;}

.exec-list{display:flex; flex-direction:column; gap:12px;}
.exec-row{
  width:100%; text-align:left; border-radius:16px; border:2px solid var(--border);
  background:var(--surface); padding:16px 18px; cursor:pointer; display:block;
}
.exec-row.is-complete{opacity:.7; border-color:var(--good);}
.exec-top{display:flex; align-items:center; justify-content:space-between; gap:14px;}
.exec-name{font-family:var(--font-display); font-weight:700; font-size:20px;}
.exec-qty{font-size:14.5px; color:var(--ink-3); margin-top:3px;}
.exec-status{
  display:inline-flex; align-items:center; gap:6px; font-size:13.5px; font-weight:700;
  padding:6px 12px; border-radius:99px; white-space:nowrap; flex:0 0 auto;
}
.exec-status.neutral{background:var(--surface-alt); color:var(--ink-2);}
.exec-status.good{background:var(--good-soft); color:var(--good);}
.exec-chevron{margin-left:8px; color:var(--ink-3); font-size:13px;}

.picker{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; padding-top:14px; border-top:1px dashed var(--border);}
.picker-btn{
  flex:1 1 45%; min-height:60px; border-radius:12px; border:2px solid var(--border); background:var(--surface-alt);
  color:var(--ink-2); font-family:inherit; font-size:16px; font-weight:700; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:8px; padding:10px 12px;
}
.picker-btn .ic{font-size:19px; line-height:1;}
.picker-btn.current{background:var(--good-soft); border-color:var(--good); color:var(--good);}
.picker-btn[data-status="incomplete"].current{background:var(--surface-alt); border-color:var(--ink-3); color:var(--ink-2);}

.empty-note{font-size:15px; color:var(--ink-3); font-style:italic; padding:16px 4px;}
@media (max-width:420px){ .picker-btn{flex:1 1 100%;} }
</style>

<div class="wrap">
  <div class="eyebrow">Cold Brew Production — execution</div>
  <h1>Today's batches</h1>
  <div class="status-line" id="status-line"></div>
  <a class="full-link" href="cold-brew-production.html">Full Cold Brew Production page (add batches, notes) →</a>

  <div class="date-bar">
    <button id="prev-day">← Prev</button>
    <button id="today-btn">Today</button>
    <button id="next-day">Next →</button>
    <input type="date" id="batch-date">
  </div>

  <h2 class="section-title">Cold brew concentrate (32 gal)</h2>
  <div class="exec-list" id="cb-list"></div>

  <h2 class="section-title">Kegs</h2>
  <div class="exec-list" id="keg-list"></div>
</div>

<script>
const SUPABASE_URL = "https://dwysvcprzvmhxrrnogqb.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Xg_k2Kqg-I5NHDT4Ff7X1g_EYCQxUON";
const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
const KEG_CATEGORY_LABEL = { "draft-latte":"Draft latte", "cold-brew":"Cold brew" };

function escapeHtml(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function addDaysISO(iso, delta){
  const d = new Date(iso + "T00:00:00Z");
  d.setUTCDate(d.getUTCDate() + delta);
  return d.toISOString().slice(0,10);
}

async function fetchSupabase(path, opts={}){
  try{
    const ctrl = new AbortController();
    const timeout = setTimeout(() => ctrl.abort(), 8000);
    const { headers: extraHeaders, ...restOpts } = opts;
    const resp = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
      ...restOpts,
      headers:{ apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY, ...(extraHeaders||{}) },
      signal: ctrl.signal
    });
    clearTimeout(timeout);
    if(!resp.ok){
      const text = await resp.text().catch(()=> "");
      throw new Error(`Supabase responded ${resp.status}${text ? " — " + text.slice(0,160) : ""}`);
    }
    if(resp.status === 204) return { ok:true, rows:[] };
    const text = await resp.text();
    const rows = text ? JSON.parse(text) : [];
    return { ok:true, rows: Array.isArray(rows) ? rows : [rows] };
  }catch(err){
    return { ok:false, reason: err.message || "request failed" };
  }
}

let currentDate = todayISO();
let cbBatches = [];
let kegBatches = [];
let expandedKey = null; // `${table}:${id}`

function setDate(iso){
  currentDate = iso;
  $("#batch-date").value = iso;
  loadAll();
}

function statusPicker(table, id, status){
  const key = `${table}:${id}`;
  if(expandedKey !== key) return "";
  return `
    <div class="picker" role="group" aria-label="Status">
      <span class="picker-btn ${status==="incomplete"?"current":""}" data-status="incomplete">⚪ Not complete</span>
      <span class="picker-btn ${status==="complete"?"current":""}" data-status="complete">✅ Complete</span>
    </div>`;
}

function renderCbList(){
  const wrap = $("#cb-list");
  if(!cbBatches.length){
    wrap.innerHTML = `<div class="empty-note">No cold brew batches logged for ${currentDate}.</div>`;
    return;
  }
  wrap.innerHTML = cbBatches.map(b => {
    const isExpanded = expandedKey === `cold_brew_batches:${b.id}`;
    return `
    <button type="button" class="exec-row ${b.status==='complete'?'is-complete':''}" data-id="${b.id}" data-table="cold_brew_batches">
      <div class="exec-top">
        <div><div class="exec-name">${escapeHtml(b.gallons)} gal batch</div></div>
        <span class="exec-status ${b.status==='complete'?'good':'neutral'}">${b.status==='complete'?'✅ Complete':'⚪ Not complete'}<span class="exec-chevron">${isExpanded?"▲":"▼"}</span></span>
      </div>
      ${statusPicker("cold_brew_batches", b.id, b.status)}
    </button>`;
  }).join("");
  wireRows(wrap);
}

function renderKegList(){
  const wrap = $("#keg-list");
  if(!kegBatches.length){
    wrap.innerHTML = `<div class="empty-note">No keg batches logged for ${currentDate}.</div>`;
    return;
  }
  wrap.innerHTML = kegBatches.map(b => {
    const isExpanded = expandedKey === `keg_batches:${b.id}`;
    return `
    <button type="button" class="exec-row ${b.status==='complete'?'is-complete':''}" data-id="${b.id}" data-table="keg_batches">
      <div class="exec-top">
        <div>
          <div class="exec-name">${KEG_CATEGORY_LABEL[b.keg_category] || b.keg_category} — ${escapeHtml(b.keg_type)}</div>
          ${b.qty != null ? `<div class="exec-qty">Qty ${escapeHtml(b.qty)}</div>` : ""}
        </div>
        <span class="exec-status ${b.status==='complete'?'good':'neutral'}">${b.status==='complete'?'✅ Complete':'⚪ Not complete'}<span class="exec-chevron">${isExpanded?"▲":"▼"}</span></span>
      </div>
      ${statusPicker("keg_batches", b.id, b.status)}
    </button>`;
  }).join("");
  wireRows(wrap);
}

function wireRows(wrap){
  $$(".exec-row", wrap).forEach(row => {
    row.addEventListener("click", (e) => {
      if(e.target.closest(".picker-btn")) return;
      const key = `${row.dataset.table}:${row.dataset.id}`;
      expandedKey = expandedKey === key ? null : key;
      renderCbList(); renderKegList();
    });
  });
  $$(".picker-btn", wrap).forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const row = btn.closest(".exec-row");
      updateStatus(row.dataset.table, row.dataset.id, btn.dataset.status);
    });
  });
}

async function updateStatus(table, id, status){
  const patch = status === "complete"
    ? { status:"complete", completed_at: new Date().toISOString() }
    : { status:"incomplete", completed_at:null };
  const result = await fetchSupabase(`${table}?id=eq.${id}`, {
    method:"PATCH", headers:{ "Content-Type":"application/json", Prefer:"return=minimal" }, body: JSON.stringify(patch)
  });
  if(!result.ok){ alert("Couldn't save: " + result.reason); return; }
  expandedKey = null;
  await loadAll();
}

async function loadAll(){
  const line = $("#status-line");
  const [cbResult, kegResult] = await Promise.all([
    fetchSupabase(`cold_brew_batches?select=*&batch_date=eq.${currentDate}&order=created_at.asc`),
    fetchSupabase(`keg_batches?select=*&batch_date=eq.${currentDate}&order=created_at.asc`)
  ]);
  if(cbResult.ok && kegResult.ok){
    cbBatches = cbResult.rows;
    kegBatches = kegResult.rows;
    line.textContent = "Live.";
  } else {
    cbBatches = []; kegBatches = [];
    line.textContent = `Couldn't load (${cbResult.ok ? kegResult.reason : cbResult.reason}).`;
  }
  renderCbList();
  renderKegList();
}

$("#batch-date").addEventListener("change", (e) => setDate(e.target.value));
$("#prev-day").addEventListener("click", () => setDate(addDaysISO(currentDate, -1)));
$("#next-day").addEventListener("click", () => setDate(addDaysISO(currentDate, 1)));
$("#today-btn").addEventListener("click", () => setDate(todayISO()));

setDate(currentDate);
</script>
