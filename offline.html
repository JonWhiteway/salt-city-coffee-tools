<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#244A71">
<title>Offline · Command Deck</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#F7F4EC; color:#241F18; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; text-align:center; padding:24px; box-sizing:border-box; }
  img { width:96px; height:96px; margin-bottom:20px; }
  h1 { font-size:22px; margin:0 0 8px; }
  p { margin:0 0 24px; color:#6b604c; max-width:320px; line-height:1.45; }
  button { background:#244A71; color:#fff; border:0; border-radius:10px; padding:12px 22px; font-size:16px; font-weight:600; cursor:pointer; }
</style>
</head>
<body>
  <div>
    <img src="/logo.svg" alt="Salt City Coffee">
    <h1>You're offline</h1>
    <p>The Command Deck needs an internet connection for schedules, timecards and live data. Reconnect and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
