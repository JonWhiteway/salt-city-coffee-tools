<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salt City Coffee — Picking</title>
<style>
  :root {
      --ink:#241F18; --ink-soft:#5A5245; --paper:#F7F4EC; --card:#FFFFFF;
      --line:#E1D9C4; --accent:#EB6834; --accent-soft:#FCE3D4;
      --warn:#B8860B; --warn-soft:#F7EBC9; --good:#0CA30C; --good-soft:#DCF3DC; --radius:10px;
    }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--paper);
    color: var(--ink);
    font-size: 17px;
    line-height: 1.5;
    -webkit-tap-highlight-color: transparent;
  }
  header {
    padding: 22px 20px 18px;
    border-bottom: 1px solid var(--line);
    border-top: 6px solid var(--accent);
    position: sticky;
    top: 0;
    background: var(--paper);
    z-index: 5;
  }
  .header-row {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .header-row img {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    flex-shrink: 0;
    object-fit: cover;
    object-position: center;
    box-shadow: 0 2px 8px rgba(35, 75, 110, 0.25);
  }
  .header-text h1 { margin: 0 0 2px; }
  .header-text p { margin: 0; }
  header h1 {
    font-size: 24px;
    font-weight: 800;
    margin: 0 0 3px;
    letter-spacing: -0.01em;
    color: var(--accent);
  }
  header p {
    margin: 0;
    font-size: 15px;
    color: var(--ink-soft);
  }
  .back-btn {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 16px;
    font-weight: 700;
    padding: 0 0 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  main { padding: 16px; max-width: min(94vw, 1200px); margin: 0 auto 60px; }
  .inv-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
  @media (min-width: 640px) {
    .inv-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (min-width: 960px) {
    .inv-grid { grid-template-columns: repeat(3, 1fr); }
  }
  .inv-row { margin-bottom: 0; }
  .order-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 8px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: border-color .15s;
  }
  .order-card:active { border-color: var(--accent); }
  .order-card.status-submitted { border-left-color: #c0392b; background: #fdecea; }
  .order-card.status-picking { border-left-color: #d68910; background: #fef5e0; }
  .order-card.status-fulfilled { border-left-color: #6d5a9e; background: #f0edf7; }
  .order-card.status-enroute { border-left-color: #1a73a8; background: #e6f1fa; }
  .order-card.received { border-left-color: #1e8449; background: #e6f6ec; }
  .order-card-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
  }
  .order-card-top h2 { font-size: 19px; margin: 0; font-weight: 700; }
  .badge {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 999px;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }
  .badge.submitted { background: #fdecea; color: #c0392b; }
  .badge.picking { background: #fef5e0; color: #b8760b; }
  .badge.fulfilled { background: #f0edf7; color: #6d5a9e; }
  .badge.enroute { background: #e6f1fa; color: #1a73a8; }
  .badge.delivered { background: #e6f6ec; color: #1e8449; }
  .order-card p { margin: 0; font-size: 15px; color: var(--ink-soft); }
  .home-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
    margin-top: 8px;
  }
  @media (min-width: 640px) {
    .home-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (min-width: 960px) {
    .home-grid { grid-template-columns: repeat(3, 1fr); }
  }
  .home-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 46px 24px;
    cursor: pointer;
    text-align: center;
    box-shadow: 0 2px 10px rgba(28, 31, 26, 0.05);
    transition: border-color .15s, transform .1s, box-shadow .15s;
  }
  .home-btn:active { transform: scale(0.98); }
  .home-btn:hover { box-shadow: 0 4px 16px rgba(28, 31, 26, 0.09); }
  .home-btn-a { border-top: 5px solid var(--accent); }
  .home-btn-b { border-top: 5px solid #6d5a9e; }
  .home-btn-c { border-top: 5px solid #d68910; }
  .home-btn-icon { font-size: 34px; line-height: 1; }
  .home-btn-label { font-size: 17px; font-weight: 700; color: var(--ink); }
  .home-btn-sub { font-size: 13px; color: var(--ink-soft); }
  .cafe-btn-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  @media (min-width: 640px) {
    .cafe-btn-grid { grid-template-columns: repeat(3, 1fr); }
  }
  .cafe-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 28px 14px;
    cursor: pointer;
    transition: border-color .15s;
  }
  .cafe-btn:active { border-color: var(--accent); }
  .cafe-btn-name { font-size: 18px; font-weight: 700; color: var(--ink); }
  .cafe-btn-count { font-size: 14px; color: var(--ink-soft); font-weight: 600; }
  .filter-banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--accent-soft);
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    padding: 10px 14px;
    margin-bottom: 16px;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
  }
  .filter-banner button {
    background: none;
    border: none;
    color: var(--accent);
    font-weight: 700;
    text-decoration: underline;
    cursor: pointer;
    font-size: 13px;
  }
  .nav-link {
    display: inline-block;
    color: var(--accent);
    font-size: 13px;
    font-weight: 700;
    text-decoration: none;
    margin-top: 10px;
    cursor: pointer;
  }
  .inv-row {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .inv-row-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .inv-row-top h3 { font-size: 15px; margin: 0 0 3px; font-weight: 600; }
  .inv-row-top p { font-size: 13px; color: var(--ink-soft); margin: 0; }
  .inv-qty {
    text-align: right;
    flex-shrink: 0;
  }
  .inv-qty .num { font-size: 20px; font-weight: 700; line-height: 1; }
  .inv-qty .unit { font-size: 11px; color: var(--ink-soft); }
  .inv-add-btn {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 15px;
    font-weight: 700;
    padding: 8px 0 0;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .inv-add-box {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--line);
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  .inv-add-box input[type="number"] {
    width: 70px;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--line);
    font-size: 14px;
    font-weight: 700;
    text-align: center;
  }
  .inv-add-box select {
    flex: 1;
    min-width: 140px;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--line);
    font-size: 13px;
    background: white;
  }
  .inv-add-box button.confirm {
    background: var(--ink);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .inv-add-box button.cancel {
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 13px;
    cursor: pointer;
    padding: 8px 4px;
  }
  .hist-row {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px 16px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .hist-row .delta {
    font-size: 17px;
    font-weight: 700;
    flex-shrink: 0;
    min-width: 48px;
  }
  .hist-row .delta.pos { color: var(--accent); }
  .hist-row .delta.neg { color: var(--warn); }
  .hist-info { flex: 1; }
  .hist-info .source { font-size: 13px; font-weight: 600; margin: 0 0 2px; }
  .hist-info .meta { font-size: 12px; color: var(--ink-soft); margin: 0; }
  .board-wrap {
    display: flex;
    gap: 14px;
    overflow-x: auto;
    padding-bottom: 8px;
    -webkit-overflow-scrolling: touch;
  }
  .board-col {
    flex: 0 0 260px;
    width: 260px;
  }
  .board-col-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 0 2px 8px;
    position: sticky;
    top: 0;
  }
  .board-col-header h2 { font-size: 15px; margin: 0; font-weight: 700; }
  .board-col-header span { font-size: 12px; color: var(--ink-soft); font-weight: 600; }
  .order-card .timestamp {
    font-size: 11px;
    color: var(--ink-soft);
    margin: 2px 0 0;
  }
  .settings-block {
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
  }
  .settings-block p.label {
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin: 0 0 8px;
  }
  .settings-block .row { display: flex; gap: 8px; margin-bottom: 8px; }
  .settings-block input {
    flex: 1;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13px;
  }
  .settings-block button {
    background: var(--ink);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 0 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .settings-block .hint {
    font-size: 12px;
    color: var(--ink-soft);
    margin: 0;
  }
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-soft);
  }
  .empty-state p { font-size: 15px; margin: 0; }
  .line-item {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    transition: background .15s, border-color .15s;
  }
  .line-item.done {
    background: var(--accent-soft);
    border-color: var(--accent);
  }
  .line-info h3 { font-size: 15px; margin: 0 0 3px; font-weight: 600; }
  .line-info p { font-size: 13px; color: var(--ink-soft); margin: 0; }
  .line-info .bin {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    color: var(--ink-soft);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 1px 6px;
    margin-right: 6px;
  }
  .pick-btn {
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 2px solid var(--line);
    background: var(--card);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: var(--ink-soft);
    transition: all .15s;
  }
  .pick-btn.checked {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }
  .submit-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--paper);
    border-top: 1px solid var(--line);
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  }
  .submit-bar button {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    display: block;
    padding: 18px;
    border-radius: var(--radius);
    border: none;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    background: var(--ink);
    color: white;
  }
  .submit-bar button:disabled {
    background: var(--line);
    color: var(--ink-soft);
    cursor: default;
  }
  .progress-text {
    text-align: center;
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }
  .toast {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: var(--ink);
    color: white;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    transition: all .25s;
    pointer-events: none;
    z-index: 20;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .line-item-wrap { margin-bottom: 10px; }
  .line-item-wrap .line-item { margin-bottom: 0; border-radius: var(--radius) var(--radius) 0 0; }
  .line-item-wrap.no-note .line-item { border-radius: var(--radius); }
  .note-row {
    border: 1px solid var(--line);
    border-top: none;
    border-radius: 0 0 var(--radius) var(--radius);
    padding: 8px 16px;
    background: var(--paper);
  }
  .note-btn {
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 12px;
    font-weight: 600;
    padding: 4px 0;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .note-chip {
    display: flex;
    align-items: flex-start;
    gap: 6px;
    font-size: 13px;
    color: var(--warn);
  }
  .note-chip span.dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--warn);
    margin-top: 6px;
    flex-shrink: 0;
  }
  .note-chip .edit-note {
    background: none; border: none; color: var(--ink-soft);
    font-size: 12px; text-decoration: underline; cursor: pointer;
    margin-left: auto; padding: 0; flex-shrink: 0;
  }
  .note-input-row { display: flex; gap: 8px; }
  .note-input-row textarea {
    flex: 1;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13px;
    font-family: inherit;
    resize: none;
    min-height: 38px;
  }
  .note-input-row button {
    background: var(--ink);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 0 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .logo-mark {
    display: block;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    margin: 0 auto 16px;
    box-shadow: 0 2px 8px rgba(35, 75, 110, 0.25);
    object-fit: cover;
    object-position: center;
  }
  .login-wrap {
    max-width: 340px;
    margin: 12vh auto 0;
    padding: 32px 28px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(28, 31, 26, 0.06);
  }
  .login-wrap h2 { font-size: 20px; margin: 0 0 4px; text-align: center; letter-spacing: -0.01em; }
  .login-wrap p.sub { text-align: center; color: var(--ink-soft); font-size: 13px; margin: 0 0 24px; }
  .login-wrap input {
    width: 100%;
    padding: 14px 16px;
    border-radius: var(--radius);
    border: 1px solid var(--line);
    background: var(--card);
    font-size: 17px;
    margin-bottom: 14px;
  }
  .login-wrap button {
    width: 100%;
    padding: 16px;
    border-radius: var(--radius);
    border: none;
    background: var(--accent);
    color: white;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    transition: background .15s;
  }
  .login-wrap button:hover { background: #1b3a57; }
  .login-wrap .error { color: var(--warn); font-size: 13px; text-align: center; margin: 0 0 12px; }
  .signout-link {
    background: none; border: none; color: var(--ink-soft);
    font-size: 12px; text-decoration: underline; cursor: pointer; padding: 0;
  }
</style>

<style>

:root {
  --ink:#241F18; --ink-soft:#5A5245; --paper:#F7F4EC; --card:#FFFFFF;
  --line:#E1D9C4; --accent:#EB6834; --accent-soft:#FCE3D4;
  --warn:#B8860B; --warn-soft:#F7EBC9; --good:#0CA30C; --good-soft:#DCF3DC;
  --radius:10px;
  --bg:#F7F4EC; --surface:#FFFFFF; --surface-alt:#EFE9DA;
  --ink-2:#5A5245; --ink-3:#8B826F; --border:#E1D9C4; --border-soft:#EEE7D6;
  --accent-ink:#FFFFFF; --caramel:#B9852E; --caramel-soft:#F3E2BC;
  --serious:#C15A34; --critical:#D03B3B; --serious-soft:#F7DFCF; --critical-soft:#F8DADA;
  --font-display:'Oswald','Arial Narrow',sans-serif;
  --font-body:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
html { -webkit-text-size-adjust:100%; }
body {
  background:var(--bg); color:var(--ink); font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4 { font-family:var(--font-display); font-weight:600; color:var(--ink); }
button,input,select,textarea { font-family:inherit; }
::selection { background:var(--accent-soft); color:var(--ink); }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
header { border-top-color:var(--accent) !important; }
header h1 { color:var(--ink) !important; font-family:var(--font-display); letter-spacing:.01em; text-transform:uppercase; }
button.primary, .save-btn, .back-btn.primary, .cart-bar button, .submit-bar button,
.login-wrap button, .login-wrap .submit-btn {
  background:var(--accent); color:#fff;
}
button.primary:hover, .save-btn:hover, .cart-bar button:hover, .submit-bar button:hover,
.login-wrap button:hover { background:#D95727; }
.item-row.has-qty { border-color:var(--accent); background:var(--accent-soft); }
.chip.active, .filter-banner { border-color:var(--accent); }
.chip.active { background:var(--accent); color:#fff; }
.search-row input:focus, input:focus, select:focus, textarea:focus { border-color:var(--accent); }
.home-btn, .cafe-btn, .order-card, .item-row, .inv-row, .hist-row, .card-block {
  box-shadow:0 1px 2px rgba(36,31,24,.06),0 1px 1px rgba(36,31,24,.04);
}
.home-btn-a, .home-btn-b, .home-btn-c, .home-btn,
.home-btn-a:hover, .home-btn-b:hover, .home-btn-c:hover { border-top-color:var(--accent); }
a, .nav-link, .back-btn, .item-info .price, .qty-stepper button { color:var(--accent); }
.badge.delivered, .badge.paid { background:var(--good-soft); color:var(--good); }
.badge.picking { background:var(--warn-soft); color:#8A6500; }
.badge.submitted { background:var(--serious-soft); color:var(--serious); }

/* Keep operational status colors meaningful while using the Command Deck palette. */
.order-card.status-submitted { border-left-color:var(--serious); }
.order-card.status-picking { border-left-color:var(--warn); }
.order-card.status-fulfilled { border-left-color:var(--caramel); }
.order-card.status-shipped, .order-card.status-enroute { border-left-color:var(--accent); }
.order-card.status-delivered, .order-card.received { border-left-color:var(--good); }
.home-btn-b, .home-btn-c { border-top-color:var(--caramel); }

</style>

<body>

<div id="toast" class="toast"></div>
<header id="app-header">
  <h1>Warehouse picking</h1>
  <p>Loading&hellip;</p>

async function loadState() {
  const [
    { data: locations, error: locationsError },
    { data: items, error: itemsError },
    { count: pendingInvoiceCount }
  ] = await Promise.all([
    db.from('locations').select('id, name, type'),
    db.from('items').select('id, name, unit, vendor, category, warehouse_location, sku, salt_city_item_number, storage_zone, is_perishable'),
    db.from('invoice_uploads').select('id', { count: 'exact', head: true }).eq('status', 'pending_review')
  ]);

  if (locationsError) {
    console.error('Failed to load locations:', locationsError);
    throw new Error('Failed to load locations: ' + locationsError.message);
  }
  if (itemsError) {
    console.error('Failed to load items:', itemsError);
    throw new Error('Failed to load items: ' + itemsError.message);
  }

  const roastery = locations.find(l => l.name === 'Roastery');
  if (!roastery) {
    console.error('No location named "Roastery" found — check the locations table.');
    throw new Error('Roastery location not found');
  }

  const { data: inventoryRows, error: inventoryError } = await db
    .from('inventory_levels')
    .select('item_id, quantity_on_hand')
    .eq('location_id', roastery.id);

  if (inventoryError) {
    console.error('Failed to load inventory levels:', inventoryError);
    throw new Error('Failed to load inventory levels: ' + inventoryError.message);
  }

  const { data: orderRows, error: ordersError } = await db
    .from('orders')
    .select(`
      id, status, for_location_id, order_date, created_at, picking_by, picking_started_at,
      received_at, received_by, order_type, emergency_reason, emergency_note,
      fulfilled_by, fulfilled_at, enroute_by, enroute_started_at, transfer_from_location_id,
      order_line_items ( id, item_id, quantity_ordered, quantity_on_hand, quantity_par, picked, note )
    `)
    .order('created_at', { ascending: false });

  if (ordersError) {
    console.error('Failed to load orders:', ordersError);
    throw new Error('Failed to load orders: ' + ordersError.message);
  }

  const locationsById = Object.fromEntries(locations.map(l => [l.id, l]));

  state = {
    locationsById,
    items: items.map(i => ({
      id: i.id,
      name: i.name,
      unit: i.unit,
      vendor: i.vendor,
      category: i.category,
      bin: i.warehouse_location,
      sku: i.sku,
      scItemNumber: i.salt_city_item_number,
      storageZone: i.storage_zone,
      isPerishable: i.is_perishable
    })),
    inventory: Object.fromEntries(inventoryRows.map(r => [r.item_id, r.quantity_on_hand])),
    roasteryId: roastery.id,
    orders: orderRows.map(o => ({
      id: o.id,
      locationId: o.for_location_id,
      location: locationsById[o.for_location_id]?.name || 'Unknown location',
      status: o.status,
      orderDate: o.order_date,
      createdAt: o.created_at,
      pickingBy: o.picking_by,
      pickingStartedAt: o.picking_started_at,
      receivedAt: o.received_at,
      receivedBy: o.received_by,
      orderType: o.order_type,
      emergencyReason: o.emergency_reason,
      emergencyNote: o.emergency_note,
      fulfilledBy: o.fulfilled_by,
      fulfilledAt: o.fulfilled_at,
      enrouteBy: o.enroute_by,
      enrouteStartedAt: o.enroute_started_at,
      transferFromLocationId: o.transfer_from_location_id,
      lines: o.order_line_items.map(l => ({
        lineId: l.id,
        itemId: l.item_id,
        qtyOrdered: l.quantity_ordered,
        quantityOnHand: l.quantity_on_hand,
        quantityPar: l.quantity_par,
        picked: l.picked,
        note: l.note
      }))
    })),
    chatWebhookUrl: localStorage.getItem('sc-chat-webhook') || '',
    pendingInvoiceCount: pendingInvoiceCount || 0,
    editingNote: null
  };
}

function itemById(id) {
  return state.items.find(i => i.id === id);
}

function statusLabel(status) {
  return { submitted: 'To pick', picking: 'In progress', fulfilled: 'Picked \u2014 staged', enroute: 'Enroute', delivered: 'Delivered' }[status];
}

function formatStamp(iso) {
  return new Date(iso).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}

function orderCardHtml(o) {
  const total = o.lines.length;
  const picked = o.lines.filter(l => l.picked).length;
  const statusNote = o.status === 'enroute' && o.enrouteBy
    ? ` \u00b7 ${o.enrouteBy} driving`
    : o.status === 'delivered' && o.receivedBy
      ? ` \u00b7 received by ${o.receivedBy}`
      : isReceiptQueued(o.id) ? ` \u00b7 syncing` : '';
  const cardStatusClass = o.status === 'delivered' ? 'received' : `status-${o.status}`;
  const isEmergency = o.orderType === 'emergency';
  const isTransfer = o.orderType === 'transfer';
  const hasPerishable = o.lines.some(l => itemById(l.itemId)?.isPerishable);
  const sourceLocation = isTransfer ? state.locationsById[o.transferFromLocationId]?.name : null;

  const titleHtml = isEmergency
    ? `<span style="color:var(--warn);">EMERGENCY \u2014 </span>${o.location}`
    : isTransfer
      ? `<span style="color:var(--accent);">TRANSFER \u2014 </span>${sourceLocation || '?'} \u2192 ${o.location}`
      : o.location;

  return `
    <div class="order-card ${cardStatusClass}" style="${isEmergency ? 'border-left-color: var(--warn); border-left-width: 6px;' : hasPerishable ? 'border-left-color: #1a73a8; border-left-width: 6px;' : ''}" onclick="openOrder('${o.id}')">
      <div class="order-card-top">
        <h2>${titleHtml}</h2>
        <span class="badge ${o.status}">${statusLabel(o.status)}</span>
      </div>
      ${isEmergency ? `<p style="color:var(--warn); font-weight:700;">${o.emergencyReason}</p>` : ''}
      ${hasPerishable ? `<p style="color:#1a73a8; font-weight:700;">\u26a0 Contains perishable \u2014 prioritize pick</p>` : ''}
      <p>${picked}/${total} items picked${o.status === 'picking' && o.pickingBy ? ` \u00b7 ${o.pickingBy}` : ''}${statusNote}</p>
      <p class="timestamp">${formatStamp(o.createdAt)}</p>
    </div>
  `;
}

function renderOrderList() {
  document.getElementById('app-header').innerHTML = `
    <button class="back-btn" onclick="goHome()">&larr; Home</button>
    <h1>All locations</h1>
    <p>${state.orders.filter(o => o.status !== 'delivered').length} open ticket(s) \u00b7 ${currentStaff.name} <button class="signout-link" onclick="signOut()">Sign out</button></p>
  `;
  const main = document.getElementById('app-main');

  const settingsBlock = `
    <div class="settings-block">
      <p class="label">Google Chat alerts</p>
      <div class="row">
        <input id="webhook-input" placeholder="Paste your Apps Script relay URL" value="${state.chatWebhookUrl || ''}" />
        <button onclick="saveWebhookUrl()">Save</button>
      </div>
      <div class="row">
        <button onclick="testChatWebhook()" style="width:100%">Send test message</button>
      </div>
      <p class="hint">Paste the web app URL from the Apps Script relay (not the raw Google Chat webhook \u2014 that one gets blocked by the browser).</p>
    </div>
  `;

  if (state.orders.length === 0) {
    main.innerHTML = `<div class="empty-state"><p>No orders yet.</p></div>` + settingsBlock;
    return;
  }

  // Group into one column per location, oldest order at the top of each
  // column (first in, first picked).
  const columns = [];
  state.orders.forEach(o => {
    let col = columns.find(c => c.location === o.location);
    if (!col) { col = { location: o.location, orders: [] }; columns.push(col); }
    col.orders.push(o);
  });
  columns.forEach(col => col.orders.sort((a, b) => {
    const priority = (o) => {
      if (o.orderType === 'emergency') return 0;
      if (o.lines.some(l => itemById(l.itemId)?.isPerishable)) return 1;
      return 2;
    };
    const aPriority = priority(a);
    const bPriority = priority(b);
    if (aPriority !== bPriority) return aPriority - bPriority;
    return new Date(a.createdAt) - new Date(b.createdAt);
  }));
  columns.sort((a, b) => a.location.localeCompare(b.location));

  main.innerHTML = `
    <div class="board-wrap">
      ${columns.map(col => `
        <div class="board-col">
          <div class="board-col-header">
            <h2>${col.location}</h2>
            <span>${col.orders.length}</span>
          </div>
          ${col.orders.map(orderCardHtml).join('')}
        </div>
      `).join('')}
    </div>
  ` + settingsBlock;
}

async function saveWebhookUrl() {
  state.chatWebhookUrl = document.getElementById('webhook-input').value.trim();
  localStorage.setItem('sc-chat-webhook', state.chatWebhookUrl);
  toast('Webhook saved (this browser only)');
}

async function postToChat(message) {
  if (!state.chatWebhookUrl) return { ok: false, reason: 'no-url' };
  try {
    const res = await fetch(state.chatWebhookUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ text: message })
    });
    // The relay always responds HTTP 200 — the real result is in its JSON body.
    let body;
    try { body = await res.json(); } catch (_) { body = null; }
    return { ok: res.ok && body && body.ok === true, status: res.status, body };
  } catch (err) {
    console.error('Google Chat relay call failed:', err);
    return { ok: false, reason: 'network-or-cors', error: err };
  }
}

async function testChatWebhook() {
  await saveWebhookUrl();
  toast('Sending test message\u2026');
  const result = await postToChat('Test message from the Salt City Coffee picking app \u2014 if you see this in Chat, direct calls work.');
  if (result.ok) {
    toast('Sent! Check Google Chat.');
  } else {
    toast('Failed \u2014 see console (F12)');
  }
}

async function openOrder(orderId) {
  location.hash = orderId;
  const me = ensureWorkerName();
  const order = state.orders.find(o => o.id === orderId);
  if (order) orderReturnHash = `cafe:${order.location}`;

  if (order && order.status === 'submitted') {
    // Atomic claim: only succeeds if the order is still 'submitted' at the
    // moment this runs — if two pickers tap it at once, only one wins.
    const { data, error } = await db
      .from('orders')
      .update({ status: 'picking', picking_by: me, picking_started_at: new Date().toISOString() })
      .eq('id', orderId)
      .eq('status', 'submitted')
      .select('status, picking_by, picking_started_at');

    if (!error && data && data.length > 0) {
      order.status = data[0].status;
      order.pickingBy = data[0].picking_by;
      order.pickingStartedAt = data[0].picking_started_at;
    } else {
      // Someone else claimed it a moment before us — pull the real current state.
      const { data: fresh } = await db
        .from('orders').select('status, picking_by, picking_started_at').eq('id', orderId).single();
      if (fresh) {
        order.status = fresh.status;
        order.pickingBy = fresh.picking_by;
        order.pickingStartedAt = fresh.picking_started_at;
      }
    }
  }

  renderOrderDetail(orderId);
}

async function releaseOrder(orderId) {
  const order = state.orders.find(o => o.id === orderId);
  if (!order) return;

  const { error } = await db
    .from('orders')
    .update({ status: 'submitted', picking_by: null, picking_started_at: null })
    .eq('id', orderId);

  if (error) {
    console.error('Failed to release order:', error);
    toast('Failed to release \u2014 see console');
    return;
  }

  order.status = 'submitted';
  order.pickingBy = null;
  order.pickingStartedAt = null;
  toast('Ticket released');
  goBack();
}

function getReceiptQueue() {
  try { return JSON.parse(localStorage.getItem('sc-pending-receipts') || '[]'); }
  catch (e) { return []; }
}

function setReceiptQueue(q) {
  localStorage.setItem('sc-pending-receipts', JSON.stringify(q));
}

function isReceiptQueued(orderId) {
  return getReceiptQueue().some(p => p.orderId === orderId);
}

async function tryConfirmReceipt(payload) {
  try {
    const { error: orderErr } = await db
      .from('orders')
      .update({ status: 'delivered', received_at: payload.receivedAt, received_by: payload.receivedBy })
      .eq('id', payload.orderId);
    if (orderErr) throw orderErr;

    for (const line of payload.lines) {
      // Atomic — no read-then-write race window (see add-atomic-inventory-writes.sql)
      const { error: invErr } = await db.rpc('adjust_inventory', {
        p_location_id: payload.locationId,
        p_item_id: line.itemId,
        p_delta: line.qty
      });
      if (invErr) throw invErr;

      await db.from('ledger_transactions').insert({
        location_id: payload.locationId,
        item_id: line.itemId,
        quantity_delta: line.qty,
        source: payload.orderType === 'transfer' ? 'transfer_in' : 'cafe_delivery_received',
        reference_id: payload.orderId
      });
    }

    const order = state.orders.find(o => o.id === payload.orderId);
    if (order) { order.status = 'delivered'; order.receivedAt = payload.receivedAt; order.receivedBy = payload.receivedBy; }
    return true;
  } catch (err) {
    console.error('Confirm receipt failed \u2014 queued for retry:', err);
    return false;
  }
}

async function confirmReceipt(orderId) {
  const order = state.orders.find(o => o.id === orderId);
  const input = document.getElementById(`receipt-name-${orderId}`);
  const receivedBy = (input?.value || '').trim() || 'Unknown';
  localStorage.setItem('sc-last-receiver-name', receivedBy);

  const payload = {
    orderId,
    locationId: order.locationId,
    orderType: order.orderType,
    receivedBy,
    receivedAt: new Date().toISOString(),
    lines: order.lines.map(l => ({ itemId: l.itemId, qty: l.qtyOrdered }))
  };

  const ok = await tryConfirmReceipt(payload);
  if (ok) {
    toast('Receipt confirmed');
  } else {
    const q = getReceiptQueue();
    q.push(payload);
    setReceiptQueue(q);
    toast('No connection \u2014 saved on this device, will sync automatically');
  }
  renderOrderDetail(orderId);
}

async function flushPendingReceipts() {
  const q = getReceiptQueue();
  if (q.length === 0) return;
  const stillPending = [];
  for (const payload of q) {
    const ok = await tryConfirmReceipt(payload);
    if (!ok) stillPending.push(payload);
  }
  setReceiptQueue(stillPending);
}

window.addEventListener('online', flushPendingReceipts);

function editNote(orderId, itemId) {

async function togglePick(orderId, itemId) {
  const order = state.orders.find(o => o.id === orderId);
  if (order.status === 'picking' && order.pickingBy && order.pickingBy !== workerName) {
    toast(`Locked by ${order.pickingBy}`);
    return;
  }
  const line = order.lines.find(l => l.itemId === itemId);
  const newPicked = !line.picked;

  const { error: lineError } = await db
    .from('order_line_items')
    .update({ picked: newPicked })
    .eq('id', line.lineId);

  if (lineError) {
    console.error('Failed to update pick state:', lineError);
    toast('Failed to save — see console');
    return;
  }

  line.picked = newPicked;

  if (order.status === 'submitted' && newPicked) {
    const { error: orderError } = await db
      .from('orders')
      .update({ status: 'picking' })
      .eq('id', order.id);
    if (!orderError) order.status = 'picking';
  }

  renderOrderDetail(orderId);
}

async function fulfillOrder(orderId) {
  const order = state.orders.find(o => o.id === orderId);

  // A transfer pulls from its own real source location; every other
  // order type has always meant "picked from the Roastery/Warehouse" —
  // unchanged behavior for weekly/emergency orders.
  const sourceLocationId = order.orderType === 'transfer' ? order.transferFromLocationId : state.roasteryId;
  const ledgerSource = order.orderType === 'transfer' ? 'transfer_out' : 'warehouse_pick';

  for (const line of order.lines) {
    // Atomic — no read-then-write race window, and no reliance on the
    // locally cached state.inventory value (see add-atomic-inventory-writes.sql)
    const { error: invError } = await db.rpc('adjust_inventory', {
      p_location_id: sourceLocationId,
      p_item_id: line.itemId,
      p_delta: -line.qtyOrdered
    });
    if (invError) { console.error('Inventory update failed:', invError); continue; }

    // The local inventory cache only ever represents Roastery's stock
    // (that's all the Warehouse Inventory view shows) — only update it
    // when this fulfillment actually drew from Roastery.
    if (sourceLocationId === state.roasteryId) {
      state.inventory[line.itemId] = (state.inventory[line.itemId] || 0) - line.qtyOrdered;
    }

    await db.from('ledger_transactions').insert({
      location_id: sourceLocationId,
      item_id: line.itemId,
      quantity_delta: -line.qtyOrdered,
      source: ledgerSource,
      reference_id: order.id
    });

    await db
      .from('order_line_items')
      .update({ quantity_fulfilled: line.qtyOrdered })
      .eq('id', line.lineId);
  }

  const fulfilledAt = new Date().toISOString();
  const { error: statusError } = await db
    .from('orders')
    .update({ status: 'fulfilled', picking_by: null, picking_started_at: null, fulfilled_by: workerName, fulfilled_at: fulfilledAt })
    .eq('id', order.id);
  if (!statusError) {
    order.status = 'fulfilled';
    order.pickingBy = null;
    order.pickingStartedAt = null;
    order.fulfilledBy = workerName;
    order.fulfilledAt = fulfilledAt;
  }

  toast('Inventory updated \u2014 order picked and staged');
  renderOrderDetail(orderId);
}

async function startDelivery(orderId) {
  const nameInput = document.getElementById(`enroute-name-${orderId}`);
  const driverName = (nameInput?.value || '').trim() || ensureWorkerName();

  const order = state.orders.find(o => o.id === orderId);
  if (!order) return;

  const enrouteStartedAt = new Date().toISOString();

  // Same atomic-claim pattern as picking: only succeeds if the order is
  // still 'fulfilled' at this exact moment, preventing two drivers from
  // both claiming the same delivery.
  const { data, error } = await db
    .from('orders')
    .update({ status: 'enroute', enroute_by: driverName, enroute_started_at: enrouteStartedAt })
    .eq('id', orderId)
    .eq('status', 'fulfilled')
    .select('status, enroute_by, enroute_started_at');

  if (error || !data || data.length === 0) {
    console.error('Failed to start delivery (already claimed?):', error);
    toast('Could not start delivery \u2014 refreshing');
    await loadState();
    renderOrderDetail(orderId);
    return;
  }

  order.status = data[0].status;
  order.enrouteBy = data[0].enroute_by;
  order.enrouteStartedAt = data[0].enroute_started_at;

  toast(`Delivery started \u2014 ${driverName}`);
  renderOrderDetail(orderId);
}

function routeTo(id) {
  if (id === '' || id == null) renderHome();
  else if (id === 'board') renderOrderList();
  else if (id === 'warehouse') renderWarehouseHome();
  else if (id === 'cafeorders') renderCafeOrdersHome();
  else if (id === 'inventory') renderInventory();
  else if (id === 'invoices') renderInvoices();
  else if (id === 'locations') renderLocationList();
  else if (id.startsWith('cafe:')) renderCafeLocationOrders(id.slice('cafe:'.length));
  else if (id.startsWith('item:')) renderItemHistory(id.slice('item:'.length));
  else if (id.startsWith('location:')) renderLocationHistory(id.slice('location:'.length));
  else if (id && state.orders.find(o => o.id === id)) renderOrderDetail(id);
  else renderHome();
}

      <h2>${vendorDisplay}</h2>
    ` : `
      <h2>${vendorDisplay} <button onclick="openEditInvoiceVendor('${inv.id}')" style="background:none; border:none; color:var(--ink-soft); font-size:11px; text-decoration:underline; cursor:pointer; font-weight:400;">edit</button></h2>
    `;

    let lineItemsHtml = '';
    let unresolvedCount = 0;
    if (inv.extraction_status === 'done') {
      const { data: lines } = await db.from('invoice_line_items').select('*, items(name, unit)').eq('invoice_id', inv.id);
      if (lines && lines.length > 0) {
        unresolvedCount = lines.filter(li => !li.applied_to_inventory && !li.dismissed).length;
        lineItemsHtml = `
          <div style="margin-top:10px; padding-top:10px; border-top:1px solid var(--line);">
            <p style="font-size:12px; font-weight:700; color:var(--ink-soft); margin:0 0 8px;">
              Extracted${inv.extracted_date ? ` \u00b7 ${inv.extracted_date}` : ''}
            </p>
            ${lines.map(li => renderInvoiceLineItem(li, isLmOwned)).join('')}
          </div>
        `;
      }
    } else if (inv.extraction_status === 'processing') {
      lineItemsHtml = `<p style="font-size:12px; color:var(--ink-soft); margin-top:8px;">Reading invoice\u2026</p>`;
    } else if (inv.extraction_status === 'failed') {
      lineItemsHtml = `<p style="font-size:12px; color:var(--warn); margin-top:8px;">Couldn't read this automatically \u2014 review manually.</p>`;
    }

    const addItemHtml = (inv.status === 'pending_review' && !isLmOwned) ? renderAddItemSection(inv.id) : '';

    const defaultExpanded = inv.status === 'pending_review';
    const isEditingThis = editingInvoiceVendorId === inv.id || addingItemToInvoiceId === inv.id;
    const isExpanded = isEditingThis || (invoiceExpandedState.has(inv.id) ? invoiceExpandedState.get(inv.id) : defaultExpanded);

    const detailsHtml = `
      <p>Uploaded by ${inv.uploaded_by || 'Unknown'} \u00b7 ${date}</p>
      <p><a href="${url}" target="_blank" rel="noopener" class="nav-link" style="display:inline; margin:6px 0 0;">View file &rarr;</a></p>
      ${lineItemsHtml}
      ${addItemHtml}
      ${isLmOwned ? `
        <p style="font-size:12px; color:var(--ink-soft); margin-top:10px; font-style:italic;">Handled by ${locationLabel} \u2014 shown here for tracking only.</p>
      ` : inv.status === 'pending_review' ? (
        unresolvedCount > 0 ? `
          <p style="font-size:12px; color:var(--warn); margin-top:10px;">
            ${unresolvedCount} item(s) still need Apply or Dismiss before this can be marked reviewed.
          </p>
        ` : `
          <button class="inv-add-btn" style="margin-top:8px;" onclick="markInvoiceReviewed('${inv.id}')">Mark reviewed</button>
        `
      ) : `
        <p style="font-size:12px; color:var(--ink-soft); margin-top:6px;">Reviewed by ${inv.reviewed_by || 'someone'} \u00b7 ${inv.reviewed_at ? new Date(inv.reviewed_at).toLocaleDateString() : ''}</p>
      `}
      <button class="inv-add-btn" style="margin-top:8px; color:var(--warn);" onclick="deleteInvoice('${inv.id}', '${inv.file_path.replace(/'/g, "\\'")}')">Delete invoice</button>
    `;

    const summaryLine = isLmOwned
      ? (inv.status === 'pending_review' ? `Awaiting review by ${locationLabel}` : `Reviewed by ${inv.reviewed_by || 'someone'}`)
      : inv.status === 'pending_review'
        ? (unresolvedCount > 0 ? `${unresolvedCount} item(s) need attention` : 'Ready to mark reviewed')
        : `Reviewed by ${inv.reviewed_by || 'someone'}`;

    return `
      <div class="order-card" style="cursor:default;">
        <div class="order-card-top">
          ${vendorHtml}
          <span class="badge ${inv.status === 'pending_review' ? 'submitted' : 'fulfilled'}">${inv.status === 'pending_review' ? 'Needs review' : 'Reviewed'}</span>
        </div>
        <p style="margin:0 0 4px; font-size:12px; font-weight:700; color:var(--accent);">\u2192 ${locationLabel}</p>
        <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; cursor:pointer;" onclick="toggleInvoiceExpanded('${inv.id}', ${defaultExpanded})">
          <p style="margin:0;">${date} \u00b7 ${summaryLine}</p>
          <button class="inv-add-btn" style="flex-shrink:0;" onclick="event.stopPropagation(); toggleInvoiceExpanded('${inv.id}', ${defaultExpanded})">${isExpanded ? '\u25b4 Hide' : '\u25be Show'}</button>
        </div>
        ${isExpanded ? detailsHtml : ''}
      </div>
    `;
  }));

  listEl.innerHTML = rows.join('');
}

async function saveAddItemToInvoice(invoiceId) {
  if (!addItemSelectedId) {
    toast('Pick an item first');
    return;
  }
  const qtyVal = document.getElementById(`add-item-qty-${invoiceId}`).value;
  const priceVal = document.getElementById(`add-item-price-${invoiceId}`).value;
  const qty = qtyVal === '' ? null : parseFloat(qtyVal);

  if (!qty || qty <= 0) {
    toast('Enter a quantity');
    return;
  }

  const item = itemById(addItemSelectedId);
  const { error } = await db.from('invoice_line_items').insert({
    invoice_id: invoiceId,
    raw_text: `${item.name} (added manually)`,
    quantity: qty,
    unit_price: priceVal === '' ? null : parseFloat(priceVal),
    matched_item_id: addItemSelectedId,
    match_confidence: 1
  });

  if (error) {
    console.error('Failed to add item to invoice:', error);
    toast('Failed to add item \u2014 see console');
    return;
  }

  addingItemToInvoiceId = null;
  addItemSearchQuery = '';
  addItemSelectedId = null;
  toast('Item added');
  refreshInvoicesPreservingScroll();
}

          <input type="number" id="line-edit-price-${li.id}" value="${li.unit_price ?? ''}" placeholder="Unit $" style="flex:1; padding:6px 8px; border-radius:6px; border:1px solid var(--line); font-size:13px;" />

        <div style="display:flex; gap:6px; align-items:center; margin-bottom:6px;">
          <span style="font-size:13px; font-weight:600;">${selectedItem ? selectedItem.name : 'No item selected'}</span>
        </div>
        <input type="text" id="line-edit-search-${li.id}" value="${lineEditSearchQuery.replace(/"/g, '&quot;')}" placeholder="Search catalog to change match\u2026" oninput="onLineEditSearchChange('${li.id}', this.value)" style="width:100%; padding:6px 8px; border-radius:6px; border:1px solid var(--line); font-size:13px; margin-bottom:6px;" />
        ${searchResults.length > 0 ? `
          <div style="max-height:140px; overflow-y:auto; margin-bottom:8px;">

              <div onclick="selectLineEditItem('${li.id}', '${item.id}')" style="padding:6px 8px; border-radius:6px; cursor:pointer; font-size:13px; ${lineEditSelectedItemId === item.id ? 'background:var(--accent-soft);' : ''}">

    <div style="padding:6px 0; border-bottom:1px solid var(--line); font-size:13px;">

          <div>${li.raw_text}${li.quantity ? ` \u2014 qty ${li.quantity}` : ''}${li.unit_price ? ` @ $${li.unit_price}` : ''}</div>
          <div style="font-size:12px; color:${li.matched_item_id ? 'var(--ink-soft)' : 'var(--warn)'};">

async function saveLineItemEdit(lineItemId) {
  const rawText = document.getElementById(`line-edit-text-${lineItemId}`).value.trim();
  const qtyVal = document.getElementById(`line-edit-qty-${lineItemId}`).value;
  const priceVal = document.getElementById(`line-edit-price-${lineItemId}`).value;

  const updates = {
    raw_text: rawText || '(unreadable)',
    quantity: qtyVal === '' ? null : parseFloat(qtyVal),
    unit_price: priceVal === '' ? null : parseFloat(priceVal)
  };

  // Only touch the match if the person actually picked something new —
  // otherwise leave the original match (and its confidence) untouched.
  if (lineEditSelectedItemId) {
    updates.matched_item_id = lineEditSelectedItemId;
    updates.match_confidence = 1; // manually confirmed, not a fuzzy guess anymore
  }

  const { error } = await db.from('invoice_line_items').update(updates).eq('id', lineItemId);
  if (error) {
    console.error('Failed to save line item edit:', error);
    toast('Failed to save \u2014 see console');
    return;
  }

  editingLineItemId = null;
  lineEditSearchQuery = '';
  lineEditSelectedItemId = null;
  toast('Line item updated');
  refreshInvoicesPreservingScroll();
}

async function applyInvoiceLineToInventory(lineItemId) {
  const { data: line, error: lineError } = await db
    .from('invoice_line_items')
    .select('*, invoice_uploads(location_id)')
    .eq('id', lineItemId)
    .single();

  if (lineError || !line || !line.matched_item_id || !line.quantity) {
    toast('Cannot apply this line \u2014 see console');
    console.error('applyInvoiceLineToInventory: invalid line', lineError);
    return;
  }

  // An invoice belongs to whichever location uploaded it; invoices from
  // before location-scoping existed default to Roastery, same as before.
  const targetLocationId = line.invoice_uploads?.location_id || state.roasteryId;
  const isRoastery = targetLocationId === state.roasteryId;
  const ledgerSource = isRoastery ? 'sysco_received_roastery' : 'sysco_received_direct';

  // Atomic — no read-then-write race window (see add-atomic-inventory-writes.sql)
  await db.rpc('adjust_inventory', {
    p_location_id: targetLocationId,
    p_item_id: line.matched_item_id,
    p_delta: line.quantity
  });

  await db.from('ledger_transactions').insert({
    location_id: targetLocationId,
    item_id: line.matched_item_id,
    quantity_delta: line.quantity,
    source: ledgerSource,
    reference_id: line.invoice_id
  });

  await db.from('invoice_line_items').update({ applied_to_inventory: true, confirmed: true }).eq('id', lineItemId);

  toast('Added to inventory');
  refreshInvoicesPreservingScroll();
}

async function uploadInvoice() {
  const fileInput = document.getElementById('invoice-file');
  const vendorInput = document.getElementById('invoice-vendor');
  const locationSelect = document.getElementById('invoice-location');
  const file = fileInput.files[0];

  if (!file) {
    toast('Choose a file first');
    return;
  }

  invoiceUploading = true;
  refreshInvoicesPreservingScroll();

  const me = ensureWorkerName();
  const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
  const path = `${Date.now()}-${safeName}`;

  const { error: uploadError } = await db.storage.from('invoices').upload(path, file);

  if (uploadError) {
    console.error('Invoice upload failed:', uploadError);
    toast('Upload failed \u2014 see console');
    invoiceUploading = false;
    refreshInvoicesPreservingScroll();
    return;
  }

  const { data: inserted, error: insertError } = await db.from('invoice_uploads').insert({
    file_path: path,
    original_filename: file.name,
    vendor_note: vendorInput.value.trim() || null,
    uploaded_by: me,
    status: 'pending_review',
    location_id: locationSelect.value || null
  }).select('id').single();

  invoiceUploading = false;

  if (insertError) {
    console.error('Failed to record invoice upload:', insertError);
    toast('File uploaded, but failed to save record \u2014 see console');
  } else {
    toast('Invoice uploaded \u2014 reading it now\u2026');
    // Fire-and-forget: extraction happens in the background, the review
    // list will show "processing" and pick up results on next refresh.
    fetch(PROCESS_INVOICE_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ invoice_id: inserted.id })
    }).catch(err => console.error('Failed to trigger invoice extraction:', err));
  }

  refreshInvoicesPreservingScroll();
}

async function markInvoiceReviewed(invoiceId) {
  const me = ensureWorkerName();
  const { error } = await db
    .from('invoice_uploads')
    .update({ status: 'reviewed', reviewed_by: me, reviewed_at: new Date().toISOString() })
    .eq('id', invoiceId);

  if (error) {
    console.error('Failed to mark invoice reviewed:', error);
    toast('Failed to update \u2014 see console');
    return;
  }
  toast('Marked as reviewed');
  refreshInvoicesPreservingScroll();
}

async function deleteInvoice(invoiceId, filePath) {
  // Safeguard: if any line item already applied a quantity to real
  // inventory, deleting the invoice record wouldn't undo that — the
  // quantity stays sitting in inventory_levels/ledger_transactions with
  // no trace of where it came from. Warn clearly instead of silently
  // leaving that behind.
  const { data: lines } = await db
    .from('invoice_line_items')
    .select('id, applied_to_inventory')
    .eq('invoice_id', invoiceId);

  const appliedCount = (lines || []).filter(l => l.applied_to_inventory).length;

  const warning = appliedCount > 0
    ? `${appliedCount} item(s) on this invoice were already applied to inventory. Deleting the invoice will NOT reverse those quantities \u2014 they'll stay in your inventory with no record of this invoice. Delete anyway?`
    : 'Delete this invoice? This cannot be undone.';

  if (!confirm(warning)) return;

  if (filePath) {
    const { error: storageError } = await db.storage.from('invoices').remove([filePath]);
    if (storageError) console.error('Failed to delete invoice file (continuing anyway):', storageError);
  }

  const { error } = await db.from('invoice_uploads').delete().eq('id', invoiceId);
  if (error) {
    console.error('Failed to delete invoice:', error);
    toast('Failed to delete \u2014 see console');
    return;
  }

  toast('Invoice deleted');
  refreshInvoicesPreservingScroll();
}

const SOURCE_LABELS = {
  warehouse_pick: 'Picked for order',
  sysco_received_roastery: 'Sysco delivery received',
  sysco_received_direct: 'Sysco delivery received (direct)',
  manual_adjustment: 'Manual adjustment'
};

async function renderItemHistory(itemId) {
  const item = itemById(itemId);
  if (!item) return renderInventory();

  document.getElementById('app-header').innerHTML = `
    <button class="back-btn" onclick="goToInventory()">&larr; Inventory</button>
    <h1>${item.name}</h1>
    <p>Full movement history</p>
  `;

  const main = document.getElementById('app-main');
  main.innerHTML = `<div class="empty-state"><p>Loading history\u2026</p></div>`;

  const { data: rows, error } = await db
    .from('ledger_transactions')
    .select('id, quantity_delta, source, reference_id, created_at')
    .eq('item_id', itemId)
    .order('created_at', { ascending: false });

  if (error) {
    console.error('Failed to load history:', error);
    main.innerHTML = `<div class="empty-state"><p>Couldn't load history \u2014 see console.</p></div>`;
    return;
  }

  if (rows.length === 0) {
    main.innerHTML = `<div class="empty-state"><p>No movement recorded yet for this item.</p></div>`;
    return;
  }

  // For pick transactions, look up which cafe the order was for.
  const orderIds = [...new Set(rows.filter(r => r.source === 'warehouse_pick' && r.reference_id).map(r => r.reference_id))];
  let ordersById = {};
  if (orderIds.length > 0) {
    const { data: orders } = await db.from('orders').select('id, for_location_id').in('id', orderIds);
    ordersById = Object.fromEntries((orders || []).map(o => [o.id, o]));
  }

  main.innerHTML = rows.map(r => {
    const isPositive = r.quantity_delta > 0;
    const date = new Date(r.created_at).toLocaleString(undefined, {
      month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'
    });
    const order = ordersById[r.reference_id];
    const location = order ? state.locationsById[order.for_location_id]?.name : null;

    return `
      <div class="hist-row">
        <div class="delta ${isPositive ? 'pos' : 'neg'}">${isPositive ? '+' : ''}${r.quantity_delta}</div>
        <div class="hist-info">
          <p class="source">${SOURCE_LABELS[r.source] || r.source}${location ? ` \u2014 ${location}` : ''}</p>
          <p class="meta">${date}</p>
        </div>
      </div>
    `;
  }).join('');
}

async function confirmEditName(itemId) {
  const nameInput = document.getElementById(`inv-name-${itemId}`);
  const skuInput = document.getElementById(`inv-sku-${itemId}`);
  const categorySelect = document.getElementById(`inv-category-${itemId}`);
  const zoneSelect = document.getElementById(`inv-zone-${itemId}`);
  const binInput = document.getElementById(`inv-bin-${itemId}`);
  const perishableCheckbox = document.getElementById(`inv-perishable-${itemId}`);
  const newName = nameInput.value.trim();
  const newSku = skuInput.value.trim() || null;
  const newCategory = categorySelect.value.trim() || null;
  const newZone = zoneSelect.value || null;
  const newBin = binInput.value.trim() || null;
  const newIsPerishable = perishableCheckbox.checked;
  if (!newName) {
    nameInput.focus();
    return;
  }

  const { error } = await db
    .from('items')
    .update({ name: newName, sku: newSku, category: newCategory, storage_zone: newZone, warehouse_location: newBin, is_perishable: newIsPerishable })
    .eq('id', itemId);

  if (error) {
    console.error('Failed to save item details:', error);
    toast(error.code === '23505' ? 'That SKU is already used by another item' : 'Failed to save — see console');
    return;
  }

  const item = state.items.find(i => i.id === itemId);
  if (item) { item.name = newName; item.sku = newSku; item.category = newCategory; item.storageZone = newZone; item.bin = newBin; item.isPerishable = newIsPerishable; }
  toast('Item updated');
  invEditingNameId = null;
  renderInventory();
}

async function confirmEditCount(itemId) {
  const input = document.getElementById(`inv-edit-${itemId}`) || document.getElementById(`inv-confirm-${itemId}`);
  const newQty = parseInt(input.value, 10);
  if (isNaN(newQty) || newQty < 0) {
    input.focus();
    return;
  }

  const currentQty = state.inventory[itemId] || 0;
  const delta = newQty - currentQty;

  const { error: invError } = await db
    .from('inventory_levels')
    .upsert(
      { location_id: state.roasteryId, item_id: itemId, quantity_on_hand: newQty, last_updated: new Date().toISOString() },
      { onConflict: 'location_id,item_id' }
    );
  if (invError) {
    console.error('Inventory update failed:', invError);
    toast('Failed to save count — see console');
    return;
  }

  if (delta !== 0) {
    await db.from('ledger_transactions').insert({
      location_id: state.roasteryId,
      item_id: itemId,
      quantity_delta: delta,
      source: 'manual_adjustment',
      reference_id: null
    });
  }

  state.inventory[itemId] = newQty;
  const item = itemById(itemId);
  toast(delta === 0 ? 'Count confirmed' : `Count corrected to ${newQty}`);
  invEditingId = null;
  renderInventory();
}

async function confirmAddStock(itemId) {
  const qtyInput = document.getElementById(`inv-qty-${itemId}`);
  const source = document.getElementById(`inv-source-${itemId}`).value;
  const qty = parseInt(qtyInput.value, 10);
  if (!qty || qty <= 0) {
    qtyInput.focus();
    return;
  }

  // Atomic — no read-then-write race window, and no reliance on the
  // locally cached state.inventory value (see add-atomic-inventory-writes.sql)
  const { error: invError } = await db.rpc('adjust_inventory', {
    p_location_id: state.roasteryId,
    p_item_id: itemId,
    p_delta: qty
  });
  if (invError) {
    console.error('Inventory update failed:', invError);
    toast('Failed to add stock — see console');
    return;
  }

  await db.from('ledger_transactions').insert({
    location_id: state.roasteryId,
    item_id: itemId,
    quantity_delta: qty,
    source,
    reference_id: null
  });

  state.inventory[itemId] = (state.inventory[itemId] || 0) + qty;
  const item = itemById(itemId);
  toast(`+${qty} ${item.name} added`);
  invAddingId = null;
  renderInventory();
}

let lastStateSignature = null;

function computeStateSignature() {
  // Cheap way to tell "did anything worth showing actually change" without
  // a full diffing engine — just compare a snapshot of the data that
  // drives what's on screen.
  return JSON.stringify({
    orders: state.orders,
    inventory: state.inventory,
    pendingInvoiceCount: state.pendingInvoiceCount
  });
}

async function refreshCurrentView() {
  // Always try to sync any offline-queued receipt confirmations, regardless
  // of what's on screen or whether anything's focused.
  flushPendingReceipts();

  // Never interrupt someone actively typing, or with an inventory action box open.
  const active = document.activeElement;
  if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) return;
  if (invAddingId || invEditingId || invEditingNameId || invoiceUploading) return;

  try {
    await loadState();
    const newSignature = computeStateSignature();
    if (newSignature === lastStateSignature) {
      return; // nothing actually changed — skip the re-render entirely, no flash
    }
    lastStateSignature = newSignature;
    routeTo(decodeURIComponent(location.hash.replace('#', '')));
  } catch (err) {
    // A transient failure during background refresh shouldn't crash the
    // page — just skip this cycle and try again on the next one.
    console.error('Background refresh failed, will retry next cycle:', err);
  }
}

function startAutoRefresh() {
  if (autoRefreshTimer) clearInterval(autoRefreshTimer);
  autoRefreshTimer = setInterval(refreshCurrentView, 6000);
}

async function sendPasswordResetEmail() {
  const email = document.getElementById('reset-email').value.trim();
  if (!email) return;

  const redirectTo = window.location.origin + window.location.pathname;
  const { error } = await db.auth.resetPasswordForEmail(email, { redirectTo });

  if (error) {
    renderForgotPasswordScreen(error.message, true);
    return;
  }
  renderForgotPasswordScreen('Check your email for a reset link. It may take a minute to arrive.', false);
}

function renderSetNewPasswordScreen() {
  document.getElementById('app-header').innerHTML = `<h1>Salt City Coffee</h1><p>Set a new PIN</p>`;
  document.getElementById('app-main').innerHTML = `
    <div class="login-wrap">
      <img class="logo-mark" src="${LOGO_DATA_URI}" alt="Salt City Coffee" />
      <h2>Set a new PIN</h2>
      <p class="sub">Pick a 4-digit PIN. It's the same PIN you'll use on the Command Deck.</p>
      <p class="error" id="set-password-error" style="display:none;"></p>
      <input type="password" id="new-password" placeholder="New 4-digit PIN" inputmode="numeric" maxlength="4" autocomplete="new-password" />
      <input type="password" id="confirm-password" placeholder="Confirm PIN" inputmode="numeric" maxlength="4" autocomplete="new-password" />
      <button onclick="submitNewPassword()">Set PIN</button>
    </div>
  `;
}

async function submitNewPassword() {
  const newPassword = document.getElementById('new-password').value;
  const confirmPassword = document.getElementById('confirm-password').value;
  const errorEl = document.getElementById('set-password-error');

  if (!/^\d{4}$/.test(newPassword)) {
    errorEl.textContent = 'Your PIN must be exactly 4 digits.';
    errorEl.style.display = 'block';
    return;
  }
  if (newPassword !== confirmPassword) {
    errorEl.textContent = 'PINs don\u2019t match.';
    errorEl.style.display = 'block';
    return;
  }

  // Same login as the Command Deck: the PIN is stored as "sc-pin-" + 4 digits.
  const { error } = await db.auth.updateUser({ password: PIN_PREFIX + newPassword });
  if (error) {
    errorEl.textContent = error.message;
    errorEl.style.display = 'block';
    return;
  }

  passwordRecoveryMode = false;
  history.replaceState(null, '', window.location.pathname);
  toast('PIN updated \u2014 use it here and on the Command Deck');
  await bootstrapAfterAuth();
}

async function attemptSignIn() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  if (!email || !password) return;

  // Try the shared Command Deck PIN first ("sc-pin-" + 4 digits). Fall back to
  // the typed value as-is so anyone still on an old password can get in.
  let error = null;
  if (/^\d{4}$/.test(password)) {
    ({ error } = await db.auth.signInWithPassword({ email, password: PIN_PREFIX + password }));
    if (!error) { await bootstrapAfterAuth(); return; }
  }
  ({ error } = await db.auth.signInWithPassword({ email, password }));
  if (error) {
    renderLoginScreen('Wrong email or PIN \u2014 try again.');
    return;
  }
  await bootstrapAfterAuth();
}

async function signOut() {
  if (autoRefreshTimer) clearInterval(autoRefreshTimer);
  await db.auth.signOut();
  currentStaff = null;
  state = null;
  location.hash = '';
  renderLoginScreen();
}

async function bootstrapAfterAuth() {
  const { data: { session } } = await db.auth.getSession();
  if (!session) {
    renderLoginScreen();
    return;
  }

  const { data: staffRow, error: staffError } = await db
    .from('staff')
    .select('id, name, role')
    .eq('auth_user_id', session.user.id)
    .maybeSingle();

  if (staffError || !staffRow) {
    document.getElementById('app-header').innerHTML = `<h1>Salt City Coffee</h1>`;
    document.getElementById('app-main').innerHTML = `
      <div class="login-wrap">
        <p>Your login works, but no staff record has been set up for it yet.</p>
        <p class="sub">Ask your COO to assign your role.</p>
        <button onclick="signOut()">Sign out</button>
      </div>
    `;
    return;
  }

  if (staffRow.role !== 'production_manager' && staffRow.role !== 'coo') {
    document.getElementById('app-header').innerHTML = `<h1>Salt City Coffee</h1>`;
    document.getElementById('app-main').innerHTML = `
      <div class="login-wrap">
        <p>This app is for Production Manager and COO accounts.</p>
        <p class="sub">Location managers and GMs place orders in the ordering app instead.</p>
        <button onclick="signOut()">Sign out</button>
      </div>
    `;
    return;
  }

  currentStaff = { id: staffRow.id, name: staffRow.name, role: staffRow.role };

  try {
    await loadState();
    lastStateSignature = computeStateSignature();
    routeTo(decodeURIComponent(location.hash.replace('#', '')));
    startAutoRefresh();
  } catch (err) {
    console.error('Failed to load app data:', err);
    document.getElementById('app-header').innerHTML = `<h1>Salt City Coffee</h1>`;
    document.getElementById('app-main').innerHTML = `
      <div class="login-wrap">
        <p>Something went wrong loading the app data.</p>
        <p class="sub">${err.message || 'See the browser console for details.'}</p>
        <button onclick="location.reload()">Try again</button>
      </div>
    `;
  }
}

db.auth.onAuthStateChange((event, session) => {
  if (event === 'PASSWORD_RECOVERY') {
    passwordRecoveryMode = true;
    renderSetNewPasswordScreen();
  }
});

(async function init() {
  // Give onAuthStateChange a moment to fire for a recovery link before
  // falling through to the normal login/session check.
  await new Promise(resolve => setTimeout(resolve, 300));
  if (passwordRecoveryMode) return;

  const { data: { session } } = await db.auth.getSession();
  if (session) {
    await bootstrapAfterAuth();
  } else {
    renderLoginScreen();
  }
})();
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js').catch(function (e) { console.warn('SW registration failed', e); });
    });
  }
</script>
</body>
