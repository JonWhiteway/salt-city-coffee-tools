<title>Mobile Bar Event Sheet — Salt City Coffee</title>
<link rel="stylesheet" href="/mobile-bar-brand.css">
<style>
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
dl.kv dt{font-family:var(--f-label);font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--muted);padding-top:4px}
dl.kv dd{margin:0;overflow-wrap:anywhere}
.task{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task input{width:22px;height:22px;accent-color:var(--navy);flex:none;margin-top:1px}
.task .when{font-size:13px;color:var(--muted)}
.task.done .t{text-decoration:line-through;color:var(--muted)}
.task.late .when{color:var(--no);font-weight:600}
.pill{display:inline-block;border-radius:99px;padding:2px 9px;font-size:12.5px;font-weight:600;background:var(--care-soft);color:var(--care)}
</style>

<div class="wrap" id="app"><div class="card"><p class="muted">Loading…</p></div></div>
<script>
(function () {
  "use strict";
  var URL_ = "https://dwysvcprzvmhxrrnogqb.supabase.co", KEY = "sb_publishable_Xg_k2Kqg-I5NHDT4Ff7X1g_EYCQxUON";
  var token = new URLSearchParams(location.search).get("t") || "";
  var app = document.getElementById("app");
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function dlong(d) { return d ? new Date(d + "T12:00:00").toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" }) : "—"; }
  function dshort(d) { return d ? new Date(d + "T12:00:00").toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }) : ""; }
  function tm(t) { if (!t) return ""; var p = t.split(":"), h = +p[0], m = p[1]; return ((h % 12) || 12) + (m !== "00" ? ":" + m : "") + (h < 12 ? " am" : " pm"); }
  function rpc(fn, args) {
    return fetch(URL_ + "/rest/v1/rpc/" + fn, { method: "POST", headers: { apikey: KEY, "Content-Type": "application/json" }, body: JSON.stringify(args) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.message || "Something went wrong"); return j; }); });
  }
  function load() { rpc("mb_public_lead", { p_token: token }).then(render).catch(function (e) { app.innerHTML = '<div class="msg err">' + esc(e.message) + '</div>'; }); }
  if (!token) { app.innerHTML = '<div class="msg err">This link is missing its event code. Ask Maria for the event link.</div>'; return; }
  load();

  function render(d) {
    if (!d) { app.innerHTML = '<div class="msg err">This event link isn\'t valid anymore. Ask Maria for a new one.</div>'; return; }
    var e = d.event, today = new Date().toISOString().slice(0, 10);
    document.getElementById("h1").textContent = e.name;
    document.getElementById("lede").textContent = e.event_type + " · " + dlong(e.event_date);
    var when = e.service_start ? tm(e.service_start) + "–" + tm(e.service_end) : (e.timeframe || "TBD");
    var pk = (d.package || []).map(function (l) { return '<li><b>' + esc(l.label) + '</b>' + (l.detail ? '<br><span class="muted">' + esc(l.detail) + '</span>' : '') + '</li>'; }).join("");
    var tasks = (d.tasks || []).map(function (t) {
      var late = !t.done && t.due_on && t.due_on < today;
      return '<label class="task' + (t.done ? ' done' : '') + (late ? ' late' : '') + '"><input type="checkbox" data-id="' + esc(t.id) + '"' + (t.done ? ' checked' : '') + '>' +
        '<span><span class="t">' + esc(t.text) + '</span><br><span class="when">' + (t.due_on ? 'Due ' + dshort(t.due_on) : '') + (t.owner ? ' · ' + esc(t.owner) : '') + '</span></span></label>';
    }).join("");
    var orders = (d.orders || []).map(function (o) { return '<li>' + esc(o.number || "Order") + ' · ' + dshort(o.order_date) + ' · <span class="pill">' + esc(String(o.status || "").replace(/_/g, " ")) + '</span></li>'; }).join("");
    app.innerHTML =
      '<div class="stage"><h2>Details</h2>' + (d.lead ? '<span class="badge">Lead: ' + esc(d.lead) + '</span>' : '') + '</div>' +
      '<div class="card"><dl class="kv">' +
        '<dt>When</dt><dd><b>' + esc(dlong(e.event_date)) + '</b><br>' + esc(when) + ' · arrive 1 hour early</dd>' +
        '<dt>Where</dt><dd>' + esc(e.venue) + '<br><a href="https://maps.google.com/?q=' + encodeURIComponent(e.venue || "") + '" target="_blank" rel="noopener">Open in Maps</a></dd>' +
        '<dt>Guests</dt><dd>' + esc(e.headcount) + '</dd>' +
        '<dt>Client</dt><dd>' + esc(e.name) + (e.phone ? '<br><a href="tel:' + esc(e.phone) + '">' + esc(e.phone) + '</a>' : '') + '</dd>' +
        (e.menu_item ? '<dt>Excited about</dt><dd>' + esc(e.menu_item) + '</dd>' : '') +
        (e.additional_info ? '<dt>Client notes</dt><dd>' + esc(e.additional_info).replace(/\n/g, "<br>") + '</dd>' : '') +
        (e.internal_notes ? '<dt>Team notes</dt><dd>' + esc(e.internal_notes).replace(/\n/g, "<br>") + '</dd>' : '') +
      '</dl></div>' +
      (pk ? '<div class="stage"><h2>What we\'re serving</h2></div><div class="card"><ul style="margin:0;padding-left:18px;display:grid;gap:6px">' + pk + '</ul></div>' : '') +
      '<div class="stage"><h2>Checklist</h2></div><div class="card" id="tasks">' + (tasks || '<p class="muted">The checklist appears once the event is booked.</p>') + '</div>' +
      '<div class="stage"><h2>Internal orders</h2></div><div class="card">' + (orders ? '<ul style="margin:0;padding-left:18px">' + orders + '</ul>' : '<p class="muted" style="margin:0">No internal order linked yet. Place it in the ordering system, then Maria links it to this event.</p>') + '</div>' +
      '<div class="msg">Questions or day-of problems: call Maria at <a href="tel:' + esc(d.maria_phone) + '">' + esc(d.maria_phone) + '</a>.</div>' +
      '<div class="foot">Team only · please don\'t forward this link</div>';
    Array.prototype.forEach.call(app.querySelectorAll('#tasks input[type=checkbox]'), function (cb) {
      cb.addEventListener("change", function () {
        cb.disabled = true;
        rpc("mb_lead_task", { p_token: token, p_task: cb.dataset.id, p_done: cb.checked }).then(load).catch(function (e) { alert(e.message); cb.checked = !cb.checked; cb.disabled = false; });
      });
    });
  }
})();
</script>
