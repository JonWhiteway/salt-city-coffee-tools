<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#284A70">
<title>Mobile Bar Desk — Salt City</title>
<link rel="stylesheet" href="/mobile-bar-brand.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
.hero{padding-bottom:14px}
.hero .seal{width:40px;height:40px}.hero .seal svg{width:17px}
.hero h1{font-size:clamp(26px,5vw,34px)}
.hero-in,.wrap.wide{max-width:1240px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tabs button{border:1px solid rgba(240,231,218,.35);background:transparent;color:var(--hero-ink);border-radius:99px;padding:7px 14px;font-weight:600;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--gold);color:#284A70;border-color:var(--gold)}
.who{margin-left:auto;font-size:13px;opacity:.85;align-self:center}
.layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:1fr}}
.list{display:grid;gap:6px;max-height:calc(100vh - 230px);overflow:auto;padding-right:2px}
@media (max-width:900px){.list{max-height:none}}
.item{display:grid;gap:2px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;cursor:pointer;border-left:5px solid var(--sky)}
.item[aria-current="true"]{border-color:var(--navy);border-left-color:var(--gold);box-shadow:0 0 0 1px var(--navy) inset}
.item .top{display:flex;gap:8px;align-items:center}
.item .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sub{font-size:13px;color:var(--muted)}
.chipsel{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chipsel button{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:5px 11px;font-size:13.5px;font-weight:600;cursor:pointer}
.chipsel button[aria-pressed="true"]{background:var(--navy);color:var(--cream);border-color:var(--navy)}
.st{display:inline-block;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap;margin-left:auto}
.st.new{background:var(--no-soft);color:var(--no)} .st.contacted{background:var(--craft-soft);color:var(--craft)} .st.quoted{background:var(--care-soft);color:var(--care)}
.st.booked{background:var(--yes-soft);color:var(--yes)} .st.completed,.st.lost,.st.spam{background:var(--na-soft);color:var(--na)}
.sec{display:flex;align-items:center;gap:10px;margin:22px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.sec h2{font-family:var(--f-display);font-weight:400;font-size:19px;letter-spacing:.08em;text-transform:uppercase;margin:0}
.sec .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.flags{display:grid;gap:6px}
.flag{border-radius:10px;padding:8px 11px;font-size:14px;border:1px solid var(--line);background:var(--surface)}
.flag b{display:block}
.flag.change{border-color:var(--gold);background:var(--craft-soft)} .flag.change b::before{content:"Tell the client · ";color:var(--craft)}
.flag.warn{border-color:var(--no);background:var(--no-soft)}
.lines{width:100%;border-collapse:collapse;font-size:14px}
.lines th{font-family:var(--f-label);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:left;padding:4px}
.lines td{padding:4px;vertical-align:top;border-bottom:1px solid var(--line)}
.lines input[type=text],.lines input[type=number]{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px;min-width:0}
.lines .n{width:78px}.lines .amt{text-align:right;white-space:nowrap;padding-top:10px;font-variant-numeric:tabular-nums}
.lines .tg{font-size:12px;white-space:nowrap}
.tot{display:grid;grid-template-columns:1fr auto;gap:2px 16px;max-width:340px;margin-left:auto;font-variant-numeric:tabular-nums}
.tot .big{font-weight:700;font-size:18px;border-top:2px solid var(--ink);padding-top:4px}
.chat{display:grid;gap:8px;max-height:560px;overflow:auto;padding:4px}
.bub{max-width:82%;border-radius:14px;padding:9px 12px;border:1px solid var(--line);background:var(--surface);white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px}
.bub.out{justify-self:end;background:var(--care-soft);border-color:transparent}
.bub.in{justify-self:start}
.bub.note,.bub.call{justify-self:center;background:var(--craft-soft);border-color:transparent;max-width:92%}
.bub.sys{justify-self:center;background:transparent;border:0;color:var(--muted);font-size:12.5px;padding:2px;text-align:center;max-width:100%}
.bub .meta{display:block;font-size:11.5px;color:var(--muted);margin-bottom:3px;white-space:normal}
.bub .subj{font-weight:700;display:block}
.bub.sched{border-style:dashed;background:transparent}
details.more>summary{cursor:pointer;color:var(--care);font-size:13px}
.task{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.task input[type=checkbox]{width:20px;height:20px;accent-color:var(--navy);flex:none}
.task .when{font-size:12.5px;color:var(--muted)}
.task.done .t{text-decoration:line-through;color:var(--muted)}
.task.late .when{color:var(--no);font-weight:700}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.tbl th{font-family:var(--f-label);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 5px;border-bottom:2px solid var(--line);white-space:nowrap}
.tbl td{padding:6px 5px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl input,.tbl select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 7px;min-width:60px}
.scroll{overflow-x:auto}
.tag{display:inline-block;border-radius:6px;padding:1px 6px;font-size:11.5px;background:var(--no-soft);color:var(--no);margin:1px 2px 1px 0}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;max-width:min(92vw,520px)}
.empty{padding:30px;text-align:center;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:1100px){.grid2{grid-template-columns:1fr}}
textarea.tpl{min-height:180px;font-size:14px}
</style>
</head>

    <h1>Mobile Bar Desk</h1>
    <div class="tabs" role="tablist">
      <button type="button" data-tab="events" aria-pressed="true">Events</button>
      <button type="button" data-tab="clients" aria-pressed="false">Clients</button>

<div class="toast msg" id="toast" hidden></div>

<script>
(function () {
"use strict";
var URL_ = "https://dwysvcprzvmhxrrnogqb.supabase.co", KEY = "sb_publishable_Xg_k2Kqg-I5NHDT4Ff7X1g_EYCQxUON";
var sb = window.supabase.createClient(URL_, KEY);
var $ = function (s, r) { return (r || document).querySelector(s); };
var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function money(n) { return n == null || n === "" ? "—" : "$" + Number(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function dfmt(d, o) { return d ? new Date(String(d).length === 10 ? d + "T12:00:00" : d).toLocaleDateString("en-US", o || { month: "short", day: "numeric", year: "numeric" }) : "—"; }
function dt(d) { return d ? new Date(d).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : ""; }
function tm(t) { if (!t) return ""; var p = t.split(":"), h = +p[0], m = p[1]; return ((h % 12) || 12) + (m !== "00" ? ":" + m : "") + (h < 12 ? "am" : "pm"); }
function hrs(a, b) { if (!a || !b) return null; var x = a.split(":"), y = b.split(":"); var d = (+y[0] * 60 + +y[1]) - (+x[0] * 60 + +x[1]); if (d < 0) d += 1440; return Math.round(d / 30) / 2; }
function guests(h) { var m = String(h || "").match(/\d{1,5}/g); return m ? Math.max.apply(null, m.map(Number)) : null; }
function today() { var d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
var toastT;
function toast(m, kind) { var t = $("#toast"); t.className = "toast msg " + (kind || "ok"); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(function () { t.hidden = true; }, 4200); }
function must(r) { if (r.error) throw new Error(r.error.message); return r.data; }
function fail(e) { console.error(e); toast(e.message || String(e), "err"); }

var S = { me: null, tab: "events", filter: "open", q: "", events: [], cur: null, settings: {}, tiers: [], addons: [], staff: [], clients: [], curClient: null };
var STATUS = ["new", "contacted", "quoted", "booked", "completed", "lost", "spam"];
var LABEL = { new: "New", contacted: "Contacted", quoted: "Quoted", booked: "Booked", completed: "Completed", lost: "Lost", spam: "Spam" };
function setv(k) { var v = S.settings[k]; return v; }

// ---------------- boot ----------------
sb.auth.getSession().then(function (r) {
  var sess = r.data && r.data.session;
  if (!sess) { $("#app").innerHTML = '<div class="msg warn">Sign in on the <a href="/">Command Deck</a> first, then come back to this page.</div>'; return; }
  return sb.from("staff").select("id,name,role").eq("auth_user_id", sess.user.id).maybeSingle().then(function (s) {
    S.me = s.data;
    if (!S.me || ["coo", "ceo", "cbo"].indexOf(S.me.role) < 0) { $("#app").innerHTML = '<div class="msg warn">The Mobile Bar desk is for the CBO, COO and CEO. Event leads use the event link Maria shares with them.</div>'; return; }
    $("#who").textContent = S.me.name;
    return loadRef().then(function () { var id = new URLSearchParams(location.search).get("id"); return loadEvents(id); });
  });
}).catch(fail);

$$(".tabs button[data-tab]").forEach(function (b) { b.addEventListener("click", function () { S.tab = b.dataset.tab; $$(".tabs button[data-tab]").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); }); route(); }); });
function route() { if (S.tab === "events") renderEvents(); else if (S.tab === "clients") loadClients(); else renderPricing(); }

function loadRef() {
  return Promise.all([
    sb.from("mb_settings").select("*").order("sort"), sb.from("mb_price_tiers").select("*").order("level"),
    sb.from("mb_addons").select("*").order("sort"), sb.from("staff").select("id,name,role,is_active").order("name")
  ]).then(function (r) {
    S.settingsRows = must(r[0]); S.settings = {}; S.settingsRows.forEach(function (x) { S.settings[x.key] = x.value; });
    S.tiers = must(r[1]); S.addons = must(r[2]); S.staff = (r[3].data || []).filter(function (x) { return x.is_active !== false; });
  });
}

// ---------------- events ----------------
function loadEvents(selectId) {
  return sb.from("mobile_bar_inquiries").select("*").order("event_date", { ascending: true }).then(function (r) {
    S.events = must(r) || [];
    if (selectId) S.cur = selectId;
    if (S.tab === "events") renderEvents();
  });
}
function inFilter(e) {
  if (S.filter === "open") return ["new", "contacted", "quoted"].indexOf(e.status) >= 0;
  if (S.filter === "upcoming") return e.status === "booked";
  if (S.filter === "all") return e.status !== "spam";
  return e.status === S.filter;
}
function renderEvents() {
  var counts = {}; S.events.forEach(function (e) { counts[e.status] = (counts[e.status] || 0) + 1; });
  var open = (counts.new || 0) + (counts.contacted || 0) + (counts.quoted || 0);
  var q = S.q.toLowerCase();
  var list = S.events.filter(inFilter).filter(function (e) { return !q || [e.name, e.email, e.event_location, e.event_type].join(" ").toLowerCase().indexOf(q) >= 0; });
  if (S.filter === "completed" || S.filter === "all") list.sort(function (a, b) { return (b.event_date || "").localeCompare(a.event_date || ""); });
  var chips = [["open", "Open " + open], ["new", "New " + (counts.new || 0)], ["upcoming", "Booked " + (counts.booked || 0)], ["completed", "Done " + (counts.completed || 0)], ["lost", "Lost"], ["all", "All"]];
  $("#app").innerHTML = '<div class="layout"><div>' +
    '<div class="chipsel">' + chips.map(function (c) { return '<button type="button" data-f="' + c[0] + '" aria-pressed="' + (S.filter === c[0]) + '">' + c[1] + '</button>'; }).join("") + '</div>' +
    '<input class="inp" id="q" placeholder="Search name, email, venue" value="' + esc(S.q) + '" style="margin-bottom:10px">' +
    '<div class="list" id="list">' + (list.map(function (e) {
      return '<button class="item" data-id="' + e.id + '" aria-current="' + (S.cur === e.id) + '"><span class="top"><span class="nm">' + esc(e.name) + '</span><span class="st ' + e.status + '">' + LABEL[e.status] + '</span></span>' +
        '<span class="sub">' + dfmt(e.event_date, { weekday: "short", month: "short", day: "numeric", year: "numeric" }) + ' · ' + esc(e.event_type === "Other" ? (e.event_type_other || "Other") : e.event_type) + ' · ' + esc(e.headcount) + ' guests</span>' +
        (e.quote_amount ? '<span class="sub">' + money(e.quote_amount) + (e.event_lead_id ? ' · lead: ' + esc((S.staff.find(function (s) { return s.id === e.event_lead_id; }) || {}).name || "") : '') + '</span>' : '') + '</button>';
    }).join("") || '<div class="empty">Nothing here.</div>') + '</div></div>' +
    '<div id="detail">' + (S.cur ? '<div class="card"><p class="muted">Loading…</p></div>' : '<div class="card empty">Pick an event on the left.</div>') + '</div></div>';
  $$(".chipsel button").forEach(function (b) { b.addEventListener("click", function () { S.filter = b.dataset.f; renderEvents(); }); });
  $("#q").addEventListener("input", function () { S.q = this.value; var pos = this.selectionStart; renderEvents(); var qi = $("#q"); qi.focus(); qi.setSelectionRange(pos, pos); });
  $$("#list .item").forEach(function (b) { b.addEventListener("click", function () { S.cur = b.dataset.id; history.replaceState(null, "", "?id=" + S.cur); renderEvents(); if (window.innerWidth < 900) $("#detail").scrollIntoView({ behavior: "smooth" }); }); });
  if (S.cur) loadDetail(S.cur);
}

function loadDetail(id) {
  var ev = S.events.find(function (e) { return e.id === id; });
  if (!ev) { $("#detail").innerHTML = '<div class="card empty">Event not found.</div>'; return; }
  Promise.all([
    sb.from("mb_quotes").select("*").eq("inquiry_id", id).order("version", { ascending: false }),
    sb.from("mb_messages").select("*").eq("inquiry_id", id).order("created_at"),
    ev.store_event_id ? sb.from("store_event_tasks").select("*").eq("event_id", ev.store_event_id).order("sort") : Promise.resolve({ data: [] }),
    sb.from("mb_event_orders").select("order_id").eq("inquiry_id", id),
    ev.client_id ? sb.from("mb_history").select("*").eq("client_id", ev.client_id).order("event_date", { ascending: false }) : Promise.resolve({ data: [] }),
    ev.client_id ? sb.from("mb_clients").select("*").eq("id", ev.client_id).maybeSingle() : Promise.resolve({ data: null })

function loadClients() {

    S.clients = must(r[0]) || []; var hist = r[1].data || [], evs = r[2].data || [];
    S.clients.forEach(function (c) {
      var h = hist.filter(function (x) { return x.client_id === c.id; }), e = evs.filter(function (x) { return x.client_id === c.id; });
      c._n = h.length + e.length; c._spent = h.reduce(function (a, x) { return a + Number(x.total || 0); }, 0);

      '</tbody></table></div>' +
      '<div class="sec"><h2>Rules</h2><span class="sp"><button class="primary" id="saveRules">Save rules</button></span></div><div class="card"><table class="tbl"><tbody>' +
        rows.map(function (r) { return '<tr><td style="width:45%"><b>' + esc(r.label) + '</b>' + (r.help ? '<br><span class="muted">' + esc(r.help) + '</span>' : '') + '</td><td>' + input(r) + '</td></tr>'; }).join("") +
      '</tbody></table></div>' +
    '</div><div>' +
      '<div class="sec"><h2>Add-ons, kegs &amp; drip</h2><span class="sp"><button class="secondary" id="addAddonRow">+ Add</button><button class="primary" id="saveAddons">Save</button></span></div><div class="card scroll"><table class="tbl" id="addons"><thead><tr><th>Name</th><th>Type</th><th>Unit</th><th>Price</th><th>By level</th><th>Serves</th><th>Tax</th><th>On</th></tr></thead><tbody>' +
        S.addons.map(addonRow).join("") + '</tbody></table><p class="muted" style="margin:0;font-size:13px">"By level" overrides the price by package level, e.g. 1:25, 2:50, 3:75.</p></div>' +
      '<div class="sec"><h2>Email templates</h2><span class="sp"><button class="primary" id="saveTpl">Save templates</button></span></div><div class="card">' +
        '<p class="muted" style="margin:0;font-size:13.5px">Merge fields: {{first_name}}, {{event_label}}, {{event_date_long}}, {{timeframe}}, {{venue}}, {{guests}}, {{package_name}}, {{service_hours}}, {{total}}, {{deposit}}, {{balance}}, {{deposit_due}}, {{balance_due}}, {{gratuity_pct}}, {{quote_link}}, {{invoice_link}}, {{survey_link}}, {{lead_line}}, {{book_again_line}}, {{personal_line}}, {{changes_note}}, {{maria_name}}, {{maria_phone}}</p>' +
        tpls.map(function (r) { return '<div class="field"><label>' + esc(r.label) + '</label>' + (/subject$/.test(r.key) ? '<input data-tpl="' + r.key + '" value="' + esc(r.value) + '">' : '<textarea class="tpl" data-tpl="' + r.key + '">' + esc(r.value) + '</textarea>') + '</div>'; }).join("") +
      '</div>' +
    '</div></div>';
  $("#saveTiers").addEventListener("click", function () {
    var up = $$("#tiers tbody tr").map(function (tr) { var o = { level: +tr.dataset.l, updated_at: new Date().toISOString() }; $$("input", tr).forEach(function (i) { o[i.dataset.k] = i.type === "checkbox" ? i.checked : Number(i.value); }); return o; });
    sb.from("mb_price_tiers").upsert(up).then(must).then(function () { toast("Packages saved"); return loadRef(); }).catch(fail);
  });
  $("#saveRules").addEventListener("click", function () {
    var up = $$("[data-set]").map(function (i) {
      var t = i.dataset.t, v = i.value;
      v = t === "bool" ? v === "true" : t === "num" ? Number(v) : t === "pct" ? Math.round(Number(v) * 100) / 10000 : t === "list" ? v.split(",").map(function (x) { return x.trim(); }).filter(Boolean) : v;
      var row = S.settingsRows.find(function (r) { return r.key === i.dataset.set; });
      return { key: row.key, value: v, label: row.label, help: row.help, sort: row.sort, updated_at: new Date().toISOString(), updated_by: S.me.id };
    });
    sb.from("mb_settings").upsert(up).then(must).then(function () { toast("Rules saved"); return loadRef(); }).catch(fail);
  });
  $("#saveTpl").addEventListener("click", function () {
    var up = $$("[data-tpl]").map(function (i) { var row = S.settingsRows.find(function (r) { return r.key === i.dataset.tpl; }); return { key: row.key, value: i.value, label: row.label, help: row.help, sort: row.sort, updated_at: new Date().toISOString(), updated_by: S.me.id }; });
    sb.from("mb_settings").upsert(up).then(must).then(function () { toast("Templates saved"); return loadRef(); }).catch(fail);
  });
  $("#addAddonRow").addEventListener("click", function () { $("#addons tbody").insertAdjacentHTML("beforeend", addonRow({ name: "", category: "add-on", unit: "each", unit_price: 0, taxable: true, active: true })); });
  $("#saveAddons").addEventListener("click", function () {
    var up = $$("#addons tbody tr").map(function (tr) {
      var g = function (k) { return $('[data-k="' + k + '"]', tr); };
      var tp = g("tier_prices").value.trim(), tpo = null;
      if (tp) { tpo = {}; tp.split(",").forEach(function (p) { var kv = p.split(":"); if (kv.length === 2) tpo[kv[0].trim()] = Number(kv[1]); }); }
      var o = { name: g("name").value.trim(), category: g("category").value, unit: g("unit").value.trim() || "each", unit_price: g("unit_price").value === "" ? null : Number(g("unit_price").value), tier_prices: tpo, serves: g("serves").value.trim() || null, taxable: g("taxable").checked, active: g("active").checked, updated_at: new Date().toISOString() };
      if (tr.dataset.id) o.id = tr.dataset.id;
      return o;
    }).filter(function (o) { return o.name; });
    var withId = up.filter(function (o) { return o.id; }), fresh = up.filter(function (o) { return !o.id; });
    Promise.all([withId.length ? sb.from("mb_addons").upsert(withId) : Promise.resolve({}), fresh.length ? sb.from("mb_addons").insert(fresh) : Promise.resolve({})])
      .then(function (r) { r.forEach(must); toast("Add-ons saved"); return loadRef().then(renderPricing); }).catch(fail);
  });
}
function addonRow(a) {
  var tp = a.tier_prices ? Object.keys(a.tier_prices).map(function (k) { return k + ":" + a.tier_prices[k]; }).join(", ") : "";
  return '<tr' + (a.id ? ' data-id="' + a.id + '"' : '') + '><td><input data-k="name" value="' + esc(a.name) + '"></td><td><select data-k="category">' + ["add-on", "drip", "keg", "other"].map(function (c) { return '<option' + (c === a.category ? ' selected' : '') + '>' + c + '</option>'; }).join("") + '</select></td>' +
    '<td><input data-k="unit" value="' + esc(a.unit) + '"></td><td><input type="number" step="0.01" data-k="unit_price" value="' + (a.unit_price == null ? "" : a.unit_price) + '"></td><td><input data-k="tier_prices" value="' + esc(tp) + '"></td>' +
    '<td><input data-k="serves" value="' + esc(a.serves || "") + '"></td><td><input type="checkbox" data-k="taxable"' + (a.taxable ? ' checked' : '') + '></td><td><input type="checkbox" data-k="active"' + (a.active ? ' checked' : '') + '></td></tr>';
}
})();
</script>
</body>
</html>
