const shptQuestions = () => SHPT_Q.filter(q => !q.sup || true); // everyone sees supervisor scenarios; NY requires the topic be covered

/* ---------- Overview card + badge ---------- */
function shptOverviewCard(){
  if (!shpt.loaded) return '';
  const s = shptMine();
  if (s.state === 'done') return '';
  const cls = s.state === 'overdue' ? 'red' : s.state === 'soon' ? 'amber' : 'muted';
  return `
    <div class="card l360-card" style="border-left-color:var(--care-700);">
      <div><div class="emp-label" style="color:var(--care-700);">Required training · NY State</div>
        <div class="l360-title">Sexual Harassment Prevention ${s.year}</div>
        <div class="emp-note"><span class="emp-pill ${cls}">${s.state === 'overdue' ? `Overdue since ${eFmt(s.due)}` : `Due ${eFmt(s.due)}`}</span>
          ${s.newHire ? ' New team members complete it within 30 days of starting.' : ' Everyone completes it once a year.'} About 45–60 minutes. English or Spanish.</div></div>
      <button class="emp-btn" onclick="empSwitch('compliance')">${Object.keys(shpt.answers).length ? 'Continue training →' : 'Start training →'}</button>
    </div>`;
}
function shptBadge(){ if (!shpt.loaded) return ''; return shptMine().state === 'done' ? '' : '!'; }

/* ---------- the tab ---------- */
function empCompliance(){
  if (!shpt.loaded) return `<div class="card"><div class="emp-empty">Loading…</div></div>`;
  const s = shptMine();
  const cur = shpt.rows.find(r => r.compliance_year === s.year);
  const head = `
    <div class="shpt-head">
      <div><div class="emp-label" style="color:var(--care-700);">${st('yearly')}</div>
      <h2 class="shpt-title">${st('title')} · ${s.year}</h2></div>
      <div class="shpt-lang">${['en','es'].map(l => `<button class="${shpt.lang===l?'active':''}" onclick="shptLang('${l}')">${l==='en'?'English':'Español'}</button>`).join('')}</div>
    </div>`;
  if (cur) return head + shptDoneHtml(cur, s) + shptHistory();
  const steps = st('steps');
  return head + `
    <div class="shpt-steps">${steps.map((n,i) => `<div class="${i===shpt.step?'on':''} ${i<shpt.step?'past':''}"><span>${i+1}</span>${n}</div>`).join('')}</div>
    <div class="card shpt-body" id="shpt-body">${shptStepHtml(s)}</div>` + shptHistory();
}
function shptHistory(){
  if (!shpt.rows.length) return '';
  return `<div class="card"><h2>${st('history')}</h2><table class="emp-table"><tr><th>Year</th><th>Completed</th><th>How</th></tr>
    ${shpt.rows.map(r => `<tr><td>${r.compliance_year}</td><td>${eFmt(r.completed_on)}</td><td>${st('method')[r.method] || r.method}${r.language ? ` · ${r.language.toUpperCase()}` : ''}</td></tr>`).join('')}</table></div>`;
}
function shptDoneHtml(r, s){
  return `
    <div class="card shpt-done">
      <div class="shpt-check">✓</div>
      <div style="flex:1;"><div class="q">${st('doneH')}</div>
        <div class="emp-note">${st('doneFor')(r.compliance_year)} ${eFmt(r.completed_on)}${r.signature_name ? ` · ${shpt.lang==='es'?'firmado':'signed'} “${escapeHtml(r.signature_name)}”` : ''}. ${st('nextDue')(r.compliance_year + 1)}</div>
        ${r.employee_question ? `<div class="emp-disclaimer"><b>${escapeHtml(r.employee_question)}</b><br>${r.question_answer ? `${st('answer')}: ${escapeHtml(r.question_answer)}` : st('waiting')}</div>` : ''}
      </div>
      ${r.method === 'in_app' ? `<button class="emp-btn ghost" onclick="shptPrintCert('${r.id}')">${st('cert')}</button>` : ''}
    </div>`;
}

function shptStepHtml(s){
  const nav = (canNext, nextFn='shptGo(1)') => `<div class="shpt-nav">${shpt.step ? `<button class="emp-btn ghost" onclick="shptGo(-1)">${st('back')}</button>` : '<span></span>'}
      <button class="emp-btn" id="shpt-next" ${canNext ? '' : 'disabled'} onclick="${nextFn}">${st('next')}</button></div>`;
  const cfg = shpt.cfg;
  switch (shpt.step) {
  case 0: return `
      <p class="shpt-p">${st('introA')}</p><p class="shpt-p">${st('introB')}</p>
      <div class="emp-note" style="margin-top:6px;">${s.state === 'overdue' ? `<span class="emp-pill red">Overdue since ${eFmt(s.due)}</span>` : `<span class="emp-pill amber">Due ${eFmt(s.due)}</span>`}</div>
      ${nav(true)}`;
  case 1: return `
      <div class="q">${st('policyH')}</div>
      <button class="emp-btn" style="margin:10px 0 4px;" onclick="docsOpen('harassment_policy')">${st('policyRead')} ↗</button>
      <div class="emp-note">${st('policyWhere')}</div>
      <div class="emp-sub">${st('reportH')}</div>
      <ul class="shpt-list">${st('reportList').map((li,i) => `<li>${li}${i===1 ? ` <a href="#" onclick="empSwitch('docs'); docsGo('complaint'); return false;">${st('complaint')} →</a>` : ''}</li>`).join('')}</ul>
      <label class="shpt-ack"><input type="checkbox" ${shpt.policyOk?'checked':''} onchange="shpt.policyOk=this.checked; document.getElementById('shpt-next').disabled=!this.checked;"> ${st('policyAck')}</label>
      ${nav(shpt.policyOk)}`;
  case 2: {
    const vids = (cfg.videos || {})[shpt.lang] || [];
    return `
      <div class="q">${st('videoH')}</div><div class="emp-note" style="margin-bottom:12px;">${st('videoNote')}</div>
      ${vids.map(v => `<div class="emp-sub">${escapeHtml(v.label)} <span class="shpt-pct" id="shpt-pct-${v.id}">${Math.round((shpt.watched[v.id]||{}).pct||0)}% ${st('watched')}</span></div>
        <div class="shpt-video"><div id="shpt-yt-${v.id}"></div></div>`).join('')}
      <div id="shpt-fallback" style="display:none;" class="emp-disclaimer">${st('videoFallback')}<br>
        <label class="shpt-ack"><input type="checkbox" id="shpt-attest" onchange="shptCheckVideo()"> ${st('videoAttest')}</label></div>
      ${nav(shptVideosDone())}`;
  }
  case 3: {
    const qs = shptQuestions(), i = Math.min(shpt.qIdx, qs.length - 1), q = qs[i], a = shpt.answers[q.id] || { tries:[] };
    const solved = a.tries.includes(q.a), last = a.tries[a.tries.length - 1];
    const allDone = qs.every(x => (shpt.answers[x.id]||{tries:[]}).tries.includes(x.a));
    return `
      <div class="emp-note">${st('checkNote')}</div>
      <div class="emp-sub">${st('qOf')(i+1, qs.length)}${q.sup ? ` · <span class="emp-pill amber">${st('supTag')}</span>` : ''}</div>
      <div class="q" style="font-size:18px; margin-bottom:12px;">${q.q[shpt.lang]}</div>
      <div class="shpt-opts">${q.o.map((o,k) => `<button class="shpt-opt ${a.tries.includes(k) ? (k===q.a?'right':'wrong') : ''}" ${solved?'disabled':''} onclick="shptPick('${q.id}',${k})">${o[shpt.lang]}</button>`).join('')}</div>
      ${last != null ? `<div class="shpt-fb ${last===q.a?'right':'wrong'}"><b>${last===q.a?st('right'):st('wrong')}</b> ${last===q.a ? q.x[shpt.lang] : ''}</div>` : ''}
      <div class="shpt-nav"><button class="emp-btn ghost" onclick="${i ? 'shptQ(-1)' : 'shptGo(-1)'}">${st('back')}</button>
        <button class="emp-btn" ${solved ? '' : 'disabled'} onclick="${i < qs.length-1 ? 'shptQ(1)' : (allDone ? 'shptGo(1)' : 'shptQ(1)')}">${st('next')}</button></div>`;
  }
  case 4: return `
      <div class="q">${st('fbH')}</div>
      <div class="emp-form">
        <label>${st('fbRate')}</label>
        <div class="shpt-rate">${[1,2,3,4,5].map(n => `<button class="${shpt.rating===n?'on':''}" onclick="shpt.rating=${n}; shptRerender()">${n}</button>`).join('')}</div>
        <label>${st('fbText')}</label><textarea id="shpt-fb" rows="3" oninput="shpt.feedback=this.value">${escapeHtml(shpt.feedback)}</textarea>
        <label>${st('askText')}</label><textarea id="shpt-ask" rows="3" oninput="shpt.question=this.value">${escapeHtml(shpt.question)}</textarea>
        <div class="emp-note">${st('askNote')}</div>
      </div>
      ${nav(true)}`;
  case 5: return `
      <div class="q">${st('signH')}</div>
      <p class="shpt-p" style="margin-top:8px;">${st('signText')()}</p>
      <div class="emp-form">
        <label>${st('signName')}</label><input id="shpt-sig" autocomplete="name" placeholder="${escapeHtml(currentProfile.name)}" oninput="document.getElementById('shpt-submit').disabled = this.value.trim().length < 3">
        <label>${st('signDate')}</label><input value="${eFmt(eToday())}" disabled>
      </div>
      <div class="emp-note" id="shpt-err" style="color:var(--red); margin-top:8px;"></div>
      <div class="shpt-nav"><button class="emp-btn ghost" onclick="shptGo(-1)">${st('back')}</button>
        <button class="emp-btn" id="shpt-submit" disabled onclick="shptSubmit()">${st('submit')}</button></div>`;
  }
  return '';
}

/* ---------- navigation ---------- */
function shptRerender(){ const b = document.getElementById('shpt-body'); if (!b) return empRender(); b.innerHTML = shptStepHtml(shptMine()); shptAfter(); }
function shptGo(d){ shpt.step = Math.max(0, Math.min(5, shpt.step + d)); empRender(); window.scrollTo({ top:0, behavior:'smooth' }); }
function shptQ(d){ const n = shptQuestions().length; shpt.qIdx = Math.max(0, Math.min(n - 1, shpt.qIdx + d)); shptRerender(); }
function shptLang(l){ shpt.lang = l; empRender(); }
function shptPick(id, k){ const a = shpt.answers[id] || (shpt.answers[id] = { tries:[] }); if (!a.tries.includes(k)) a.tries.push(k); shptRerender(); }
Object.assign(window, { shptGo, shptQ, shptLang, shptPick, shptRerender, shptSubmit, shptPrintCert, shptCheckVideo });

/* ---------- video progress (YouTube IFrame API; falls back to an attestation) ---------- */
function shptVideosDone(){
  const vids = ((shpt.cfg||{}).videos || {})[shpt.lang] || [];
  const att = document.getElementById('shpt-attest');
  return (att && att.checked) || shpt.attested || (vids.length && vids.every(v => (shpt.watched[v.id]||{}).pct >= 90));
}
function shptCheckVideo(){ const att = document.getElementById('shpt-attest'); if (att) shpt.attested = att.checked; const n = document.getElementById('shpt-next'); if (n) n.disabled = !shptVideosDone(); }
function shptAfter(){
  if (empTab !== 'compliance' || shpt.step !== 2) return;
  const vids = ((shpt.cfg||{}).videos || {})[shpt.lang] || [];
  const mount = () => vids.forEach(v => {
    const el = document.getElementById('shpt-yt-' + v.id); if (!el) return;
    const w = shpt.watched[v.id] || (shpt.watched[v.id] = { secs:0, pct:0, last:null });
    const p = new YT.Player(el, { videoId:v.id, host:'https://www.youtube-nocookie.com', playerVars:{ rel:0, modestbranding:1, hl:shpt.lang },
      events:{ onStateChange: e => { if (e.data === YT.PlayerState.ENDED) { w.pct = 100; shptPaint(v.id); } } } });
    clearInterval(w.timer);
    w.timer = setInterval(() => {
      if (!document.body.contains(p.getIframe && p.getIframe())) return clearInterval(w.timer);
      if (!p.getPlayerState || p.getPlayerState() !== 1) { w.last = null; return; }
      const t = p.getCurrentTime(), dur = p.getDuration();
      if (w.last != null && t > w.last && t - w.last < 3) w.secs += t - w.last;   // only count real playback, not skipping ahead
      w.last = t;
      if (dur) { w.pct = Math.max(w.pct, Math.min(100, (w.secs / dur) * 100)); shptPaint(v.id); }
    }, 1000);
  });
  if (window.YT && YT.Player) return mount();
  window.onYouTubeIframeAPIReady = mount;
  if (!document.getElementById('yt-api')) { const s = document.createElement('script'); s.id = 'yt-api'; s.src = 'https://www.youtube.com/iframe_api'; s.onerror = shptFallback; document.head.appendChild(s); }
  setTimeout(() => { if (!(window.YT && YT.Player)) shptFallback(); }, 8000);
}
function shptFallback(){
  const vids = ((shpt.cfg||{}).videos || {})[shpt.lang] || [];
  vids.forEach(v => { const el = document.getElementById('shpt-yt-' + v.id); if (el && el.tagName !== 'IFRAME') el.outerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${v.id}?rel=0" allowfullscreen></iframe>`; });
  const f = document.getElementById('shpt-fallback'); if (f) f.style.display = 'block';
}
function shptPaint(id){
  const el = document.getElementById('shpt-pct-' + id); if (el) el.textContent = `${Math.round(shpt.watched[id].pct)}% ${st('watched')}`;
  const n = document.getElementById('shpt-next'); if (n) n.disabled = !shptVideosDone();
}

/* ---------- submit ---------- */
async function shptSubmit(){
  const btn = document.getElementById('shpt-submit'), err = document.getElementById('shpt-err');
  const sig = document.getElementById('shpt-sig').value.trim();
  btn.disabled = true; btn.textContent = st('saving'); err.textContent = '';
  const qs = shptQuestions();
  const answers = Object.fromEntries(qs.map(q => [q.id, (shpt.answers[q.id] || { tries:[] }).tries]));
  const firstTry = qs.filter(q => (answers[q.id] || [])[0] === q.a).length;
  const vids = ((shpt.cfg||{}).videos || {})[shpt.lang] || [];
  const row = {
    staff_id: currentProfile.id, training_key: SHPT_KEY, compliance_year: Number(eToday().slice(0,4)), completed_on: eToday(),
    method:'in_app', language: shpt.lang, answers, first_try_correct: firstTry, question_count: qs.length,
    video_seconds: Math.round(vids.reduce((a,v) => a + ((shpt.watched[v.id]||{}).secs || 0), 0)),
    policy_acknowledged: shpt.policyOk, signature_name: sig, is_supervisor: shptIsSup(),
    feedback: [shpt.rating ? `Rating ${shpt.rating}/5` : '', shpt.feedback.trim()].filter(Boolean).join(' · ') || null,
    employee_question: shpt.question.trim() || null,
    notes: shpt.attested ? 'Video completion self-attested (player could not track progress)' : null,
  };
  const { error } = await sb.from('compliance_completions').insert(row);
  if (error) { btn.disabled = false; btn.textContent = st('submit'); err.textContent = `Couldn't save: ${error.message}`; return; }
  await shptLoad();
  shpt.step = 0; shpt.answers = {}; shpt.qIdx = 0;
  empBadges(); empRender(); window.scrollTo({ top:0, behavior:'smooth' });
}

/* ---------- certificate ---------- */
function shptPrintCert(id){
  const r = shpt.rows.find(x => x.id === id); if (!r) return;
  const w = window.open('', '_blank');
  w.document.write(`<!DOCTYPE html><html><head><title>Certificate</title><style>
    body{font-family:Georgia,serif;margin:0;padding:60px;color:#241A12;}
    .c{border:6px double #1B365D;padding:56px;text-align:center;max-width:820px;margin:0 auto;}
    h1{font-size:30px;color:#1B365D;letter-spacing:2px;margin:0 0 6px;} .s{color:#7A6A57;font-size:14px;letter-spacing:3px;text-transform:uppercase;}
    .n{font-size:34px;margin:36px 0 8px;border-bottom:1px solid #ccc;display:inline-block;padding:0 40px 6px;} p{font-size:15px;line-height:1.6;}
    .f{display:flex;justify-content:space-between;margin-top:48px;font-size:13px;color:#4A3B2E;text-align:left;}
    @media print{body{padding:0}}</style></head><body><div class="c">
    <div class="s">Salt City Coffee</div><h1>${st('certTitle')}</h1>
    <div class="n">${escapeHtml(currentProfile.name)}</div>
    <p>completed New York State Sexual Harassment Prevention Training (state model program, ${r.language === 'es' ? 'Spanish' : 'English'}),<br>

    <div class="f"><div>Completed: <b>${eFmt(r.completed_on)}</b><br>Signed: <b>${escapeHtml(r.signature_name || '')}</b></div>
    <div>Record ID: ${r.id.slice(0,8)}<br>NY Labor Law §201-g</div></div></div>
    <script>setTimeout(()=>window.print(),300)<\/script></body></html>`);
  w.document.close();
}
</script>

<script>
/* =====================================================================
   DOCUMENTS & FORMS (employee profile)
   - Company documents from company_documents (PDFs in the private "company-docs" bucket)
   - Handbook acknowledgment with typed-name signature (document_acknowledgments)
   - Digital Sexual Harassment / Discrimination complaint form (harassment_complaints),
     modeled on the complaint form in the 2025 Employee Handbook (NYS model form).
     Routed only to the people the employee picks (GM / Owners, optionally their LM);
     the person it's about can never see it.
   ===================================================================== */
const DOCS_FULL = ['production_manager','coo','ceo','cbo'];
const DOCS_LEADER_ROLES = ['gm','coo','ceo','cbo'];
const HC_STATUS = { new:['Received','amber'], reviewing:['Under review','amber'], investigating:['Being investigated','amber'], resolved:['Resolved','green'], closed:['Closed','muted'] };
let docs = { loaded:false, list:[], acks:[], complaints:[], leaders:[], lms:[], staff:[], view:'home', err:'' };

async function docsLoad(){
  const me = currentProfile.id;
  const [{ data: list }, { data: acks }, { data: complaints }, { data: staff }, { data: myLocs }] = await Promise.all([
    sb.from('company_documents').select('*').eq('is_active', true).order('sort'),
    sb.from('document_acknowledgments').select('*').eq('staff_id', me),
    sb.from('harassment_complaints').select('id,created_at,subject_name,complaint_type,status,recipient_ids,resolution_summary,resolved_at,on_behalf_of').eq('filed_by', me).order('created_at', { ascending:false }),
    sb.from('staff').select('id,name,role,job_title,is_active').neq('is_active', false).order('name'),
    sb.from('staff_locations').select('location_id').eq('staff_id', me),
  ]);
  docs.list = list || []; docs.acks = acks || []; docs.complaints = complaints || []; docs.staff = staff || [];
  docs.leaders = docs.staff.filter(s => DOCS_LEADER_ROLES.includes(s.role));
  const locIds = (myLocs || []).map(l => l.location_id);
  docs.lms = [];
  if (locIds.length) {
    const { data: sl } = await sb.from('staff_locations').select('staff_id').in('location_id', locIds);
    const ids = new Set((sl || []).map(r => r.staff_id));
    docs.lms = docs.staff.filter(s => s.role === 'location_manager' && ids.has(s.id) && s.id !== me);
  }
  docs.loaded = true;
}
const docsNeedsAck = () => docs.loaded && docs.list.some(d => d.requires_ack && !docs.acks.some(a => a.doc_key === d.key && a.doc_version === d.version));
function docsBadge(){ return docsNeedsAck() ? '!' : ''; }

/* Open a company document (signed link, valid 1 hour). Falls back to the state's model policy for the harassment policy. */
async function docsOpen(key){
  const d = docs.list.find(x => x.key === key);
  const w = window.open('', '_blank');
  if (d && d.storage_path) {
    const { data, error } = await sb.storage.from('company-docs').createSignedUrl(d.storage_path, 3600);
    if (!error && data) { w.location = data.signedUrl + (d.policy_page ? `#page=${d.policy_page}` : ''); return; }
  }
  if (key === 'harassment_policy') { w.location = SHPT_STATE_POLICY; return; }
  w.close(); alert("This document hasn't been uploaded yet. Ask your manager for a copy.");
}

/* ---------- Overview card ---------- */
function docsOverviewCard(){
  if (!docsNeedsAck()) return '';
  return `<div class="card l360-card" style="border-left-color:var(--lead-700);">
    <div><div class="emp-label" style="color:var(--lead-700);">Documents</div>
      <div class="l360-title">Sign for the Employee Handbook</div>
      <div class="emp-note">Read the handbook, then sign to confirm you received it. It takes one minute to sign.</div></div>
    <button class="emp-btn" onclick="empSwitch('docs')">Open documents →</button></div>`;
}

/* ---------- the tab ---------- */
function empDocs(){
  if (!docs.loaded) return `<div class="card"><div class="emp-empty">Loading…</div></div>`;
  if (docs.view === 'complaint') return docsComplaintForm();
  if (docs.view === 'sent') return docsComplaintSent();
  if (docs.view.startsWith('ack:')) return docsAckForm(docs.view.slice(4));
  const sh = shpt.loaded ? shptMine() : null;
  const full = DOCS_FULL.includes(currentProfile.role);
  return `
    <div class="card">
      <h2>Company documents</h2>
      ${docs.list.map(d => {
        const ack = docs.acks.find(a => a.doc_key === d.key && a.doc_version === d.version);
        return `<div class="docs-row">
          <div class="docs-icon">PDF</div>
          <div style="flex:1;"><div class="q" style="font-size:16px;">${escapeHtml(d.title)} <span class="emp-note">· ${escapeHtml(d.version)}${d.policy_page ? ` · starts on page ${d.policy_page}` : ''}</span></div>
            ${d.requires_ack ? (ack ? `<span class="emp-pill green">Signed ${eFmt(ack.signed_at)}</span>` : `<span class="emp-pill amber">Signature needed</span>`) : ''}</div>
          <button class="emp-btn ghost" onclick="docsOpen('${d.key}')">Open</button>
          ${d.requires_ack && !ack ? `<button class="emp-btn" style="margin-top:0;" onclick="docsGo('ack:${d.key}')">Sign</button>` : ''}
          ${full && d.storage_path ? `<label class="emp-btn ghost docs-up" title="Upload a new PDF for this document">Replace PDF<input type="file" accept="application/pdf" onchange="docsUpload('${d.key}', this)"></label>` : ''}
        </div>`; }).join('') || '<div class="emp-empty">No documents yet.</div>'}
      ${sh ? `<div class="docs-row"><div class="docs-icon" style="background:var(--care-700);">NY</div>
          <div style="flex:1;"><div class="q" style="font-size:16px;">Sexual Harassment Prevention Training · ${sh.year}</div>
          ${sh.state === 'done' ? '<span class="emp-pill green">Done</span>' : `<span class="emp-pill ${sh.state==='overdue'?'red':'amber'}">${sh.state==='overdue'?'Overdue since':'Due'} ${eFmt(sh.due)}</span>`}</div>
          <button class="emp-btn ghost" onclick="empSwitch('compliance')">Open</button></div>` : ''}
      <div class="emp-note" id="docs-msg" style="margin-top:8px;"></div>
    </div>

    <div class="card docs-report">
      <h2>Report harassment or discrimination</h2>
      <p class="shpt-p">If you've experienced or seen sexual harassment, discrimination or retaliation at work, you can report it here. It goes privately to the leaders you choose, and never to the person it's about. You won't be retaliated against for reporting.</p>
      <button class="emp-btn" onclick="docsGo('complaint')">Start a report →</button>
      <div class="emp-disclaimer">You don't have to use this form. You can also tell any manager, the General Manager or an Owner in person or by email. Outside the company: <a href="https://dhr.ny.gov/complaint" target="_blank" rel="noopener">NYS Division of Human Rights ↗</a> (3 years to file), the <a href="https://www.eeoc.gov/filing-charge-discrimination" target="_blank" rel="noopener">U.S. EEOC ↗</a> (300 days), or the NY Sexual Harassment Hotline <b>1-800-HARASS-3</b> (free, confidential legal help). Call 911 if you're in danger.</div>
      ${docs.complaints.length ? `<div class="emp-sub">My reports</div>
        <table class="emp-table"><tr><th>Sent</th><th>About</th><th>Status</th></tr>
        ${docs.complaints.map(c => { const [l, cls] = HC_STATUS[c.status] || [c.status,'muted']; return `<tr><td>${eFmt(c.created_at)}</td><td>${escapeHtml(c.subject_name)}${c.on_behalf_of ? ` <span class="emp-note">(for ${escapeHtml(c.on_behalf_of)})</span>` : ''}</td>
          <td><span class="emp-pill ${cls}">${l}</span>${c.resolution_summary ? `<div class="emp-note" style="margin-top:4px;">${escapeHtml(c.resolution_summary)}</div>` : ''}</td></tr>`; }).join('')}</table>` : ''}
    </div>`;
}
function docsGo(v){ docs.view = v; docs.err = ''; empRender(); window.scrollTo({ top:0, behavior:'smooth' }); }

/* ---------- acknowledgment ---------- */
function docsAckForm(key){
  const d = docs.list.find(x => x.key === key); if (!d) return '';
  return `<div class="card">
    <div class="emp-label">${escapeHtml(d.title)} · ${escapeHtml(d.version)}</div>
    <div class="q" style="margin:4px 0 10px;">Receipt acknowledgment</div>
    <button class="emp-btn ghost" onclick="docsOpen('${d.key}')">Open the ${escapeHtml(d.title.toLowerCase())} ↗</button>
    <p class="shpt-p" style="margin-top:14px;">${escapeHtml(d.ack_text || 'I acknowledge receipt of this document.')}</p>
    <div class="emp-form"><label>Type your full name to sign</label><input id="docs-sig" placeholder="${escapeHtml(currentProfile.name)}" oninput="document.getElementById('docs-sign').disabled = this.value.trim().length < 3">
      <label>Date</label><input value="${eFmt(eToday())}" disabled></div>
    <div class="emp-note" style="color:var(--red); margin-top:8px;">${escapeHtml(docs.err)}</div>
    <div class="shpt-nav"><button class="emp-btn ghost" onclick="docsGo('home')">← Back</button><button class="emp-btn" id="docs-sign" disabled onclick="docsSign('${d.key}')">Sign</button></div>
  </div>`;
}
async function docsSign(key){
  const d = docs.list.find(x => x.key === key), sig = document.getElementById('docs-sig').value.trim();
  const { error } = await sb.from('document_acknowledgments').insert({ staff_id: currentProfile.id, doc_key: key, doc_version: d.version, signature_name: sig });
  if (error) { docs.err = `Couldn't save: ${error.message}`; return empRender(); }
  await docsLoad(); empBadges(); docsGo('home');
}
async function docsUpload(key, input){
  const d = docs.list.find(x => x.key === key), f = input.files[0], msg = document.getElementById('docs-msg');
  if (!f) return;
  if (!confirm(`Replace the PDF for "${d.title}" with ${f.name}? Everyone will see the new file.`)) { input.value = ''; return; }
  msg.textContent = 'Uploading…';
  const { error } = await sb.storage.from('company-docs').upload(d.storage_path, f, { upsert:true, contentType:'application/pdf' });
  msg.textContent = error ? `Upload failed: ${error.message}` : `Uploaded. (Changing the version so people re-sign is done in Supabase: company_documents.version.)`;
  input.value = '';
}

/* ---------- complaint form ---------- */
function docsComplaintForm(){
  const p = currentProfile;
  const leaders = docs.leaders.filter(s => s.id !== p.id);
  const person = s => `<label class="docs-check"><input type="checkbox" name="hc-to" value="${s.id}" ${DOCS_LEADER_ROLES.includes(s.role) ? 'checked' : ''}> <span><b>${escapeHtml(s.name)}</b> <span class="emp-note">${escapeHtml(s.job_title || s.role)}</span></span></label>`;
  return `<div class="card emp-form docs-form">
    <div class="emp-label" style="color:var(--care-700);">Private · Sexual Harassment &amp; Discrimination Complaint</div>
    <div class="q" style="margin:4px 0 6px;">Report harassment or discrimination</div>
    <p class="emp-note">New York requires every employer to provide this form. Fill in what you can; only the starred fields are required. You can stop and talk to someone in person instead at any time.</p>

    <div class="emp-sub">1 · Who should receive this?</div>
    <div class="emp-note">Uncheck anyone you don't want to see it. At least one General Manager or Owner must be checked.</div>
    <div class="docs-checks">${leaders.map(person).join('')}${docs.lms.map(person).join('')}</div>

    <div class="emp-sub">2 · About you</div>
    <div class="docs-grid">
      <div><label>Name *</label><input id="hc-name" value="${escapeHtml(p.name)}"></div>
      <div><label>Job title</label><input id="hc-title" value="${escapeHtml(p.job_title || '')}"></div>
      <div><label>Cafe / work location</label><input id="hc-loc"></div>
      <div><label>Phone</label><input id="hc-phone" type="tel"></div>
      <div><label>Email</label><input id="hc-email" type="email"></div>
      <div><label>Best way to reach you</label><select id="hc-pref"><option value="">Choose…</option><option value="email">Email</option><option value="phone">Phone</option><option value="in_person">In person</option></select></div>
      <div><label>Your immediate supervisor</label><input id="hc-sup"></div>
      <div><label>Their title</label><input id="hc-sup-title"></div>
    </div>
    <label class="docs-check" style="margin-top:10px;"><input type="checkbox" id="hc-behalf-on" onchange="document.getElementById('hc-behalf-wrap').style.display=this.checked?'block':'none'"> <span>I'm reporting this on behalf of someone else</span></label>
    <div id="hc-behalf-wrap" style="display:none;"><label>Their name</label><input id="hc-behalf"></div>

    <div class="emp-sub">3 · Who is this about?</div>
    <div class="docs-grid">
      <div><label>Name *</label><input id="hc-subj" list="hc-staff" placeholder="Start typing, or describe the person" oninput="docsSubjChanged(this.value)"><datalist id="hc-staff">${docs.staff.filter(s => s.id !== p.id).map(s => `<option value="${escapeHtml(s.name)}">`).join('')}</datalist></div>
      <div><label>Their title</label><input id="hc-subj-title"></div>
      <div><label>Where they work</label><input id="hc-subj-loc"></div>
      <div><label>Relationship to you</label><select id="hc-rel"><option value="">Choose…</option><option value="supervisor">Supervisor</option><option value="subordinate">Someone I supervise</option><option value="coworker">Co-worker</option><option value="customer">Customer</option><option value="vendor">Vendor / delivery</option><option value="other">Other</option></select></div>
      <div><label>Type of complaint</label><select id="hc-type"><option value="sexual_harassment">Sexual harassment</option><option value="discrimination">Discrimination</option><option value="retaliation">Retaliation</option><option value="other">Other</option></select></div>
    </div>

    <div class="emp-sub">4 · What happened</div>
    <label>Describe what happened and how it is affecting you and your work *</label><textarea id="hc-desc" rows="7"></textarea>
    <div class="docs-grid">
      <div><label>Date(s) it happened</label><input id="hc-dates" placeholder="e.g. Oct 3, Oct 10, ongoing since September"></div>
      <div><label>Is it still happening?</label><select id="hc-cont"><option value="">Choose…</option><option value="yes">Yes</option><option value="no">No</option></select></div>
    </div>
    <label>Witnesses, or anyone who may have information (names and how to reach them)</label><textarea id="hc-wit" rows="3"></textarea>
    <label>Have you complained or given information about related incidents before? If yes, when and to whom? (optional)</label><textarea id="hc-prior" rows="2"></textarea>
    <label>If you have a lawyer and want us to work with them, their contact information (optional)</label><input id="hc-counsel">
    <div class="emp-note" style="margin-top:6px;">Have screenshots or documents? Mention them here and bring or email them to the person handling your report.</div>

    <div class="emp-sub">5 · Sign</div>
    <label>Type your full name *</label><input id="hc-sig" placeholder="${escapeHtml(p.name)}">
    <div class="emp-note" style="margin-top:8px;">Retaliation against anyone who reports harassment or helps an investigation is against the law and Salt City policy.</div>
    <div class="emp-note" id="hc-err" style="color:var(--red); margin-top:8px;">${escapeHtml(docs.err)}</div>
    <div class="shpt-nav"><button class="emp-btn ghost" onclick="docsGo('home')">Cancel</button><button class="emp-btn" id="hc-send" onclick="docsSendComplaint()">Send privately</button></div>
  </div>`;
}
async function docsSendComplaint(){
  const v = id => (document.getElementById(id)?.value || '').trim();
  const err = document.getElementById('hc-err'), btn = document.getElementById('hc-send');
  const to = [...document.querySelectorAll('input[name="hc-to"]:checked')].map(i => i.value);
  const missing = [];
  if (!v('hc-name')) missing.push('your name');
  if (!v('hc-subj')) missing.push('who it is about');
  if (!v('hc-desc')) missing.push('what happened');
  if (v('hc-sig').length < 3) missing.push('your signature');
  if (!to.some(id => DOCS_LEADER_ROLES.includes((docs.staff.find(s => s.id === id) || {}).role))) missing.push('at least one General Manager or Owner to receive it');
  if (missing.length) { err.textContent = 'Please add: ' + missing.join(', ') + '.'; return; }
  const subj = docs.staff.find(s => s.name.toLowerCase() === v('hc-subj').toLowerCase());
  btn.disabled = true; btn.textContent = 'Sending…'; err.textContent = '';
  const row = {
    source:'employee', filed_by: currentProfile.id,
    complainant_name: v('hc-name'), complainant_title: v('hc-title') || null, complainant_location: v('hc-loc') || null,
    complainant_phone: v('hc-phone') || null, complainant_email: v('hc-email') || null, preferred_contact: v('hc-pref') || null,
    on_behalf_of: document.getElementById('hc-behalf-on').checked ? (v('hc-behalf') || 'Someone else') : null,
    supervisor_name: v('hc-sup') || null, supervisor_title: v('hc-sup-title') || null,
    subject_staff_id: subj ? subj.id : null, subject_name: v('hc-subj'), subject_title: v('hc-subj-title') || null, subject_location: v('hc-subj-loc') || null,
    subject_relationship: v('hc-rel') || null, complaint_type: v('hc-type'),
    description: v('hc-desc'), incident_dates: v('hc-dates') || null, is_continuing: v('hc-cont') ? v('hc-cont') === 'yes' : null,
    witnesses: v('hc-wit') || null, prior_complaints: v('hc-prior') || null, legal_counsel: v('hc-counsel') || null,
    signature_name: v('hc-sig'), recipient_ids: to,
  };
  const { error } = await sb.from('harassment_complaints').insert(row);
  if (error) { btn.disabled = false; btn.textContent = 'Send privately'; err.textContent = `Couldn't send: ${error.message}. Your text is still here. You can also report in person.`; return; }
  docs.lastTo = to.filter(id => !subj || id !== subj.id).map(id => (docs.staff.find(s => s.id === id) || {}).name).filter(Boolean);
  await docsLoad(); docsGo('sent');
}
function docsComplaintSent(){
  return `<div class="card shpt-done" style="align-items:flex-start;">
    <div class="shpt-check">✓</div>
    <div style="flex:1;"><div class="q">Your report was sent</div>
      <p class="shpt-p" style="margin-top:6px;">It went privately to ${escapeHtml((docs.lastTo || []).join(', ') || 'the leaders you chose')}. Someone will reach out to you soon. The investigation will be prompt and kept as confidential as possible. You can check the status under My reports.</p>
      <p class="emp-note">If you're in danger, call 911. For free, confidential legal help, call 1-800-HARASS-3.</p>
      <button class="emp-btn" onclick="docsGo('home')">Done</button></div></div>`;
}
/* If the complaint is about one of the leaders, take them off the list automatically. */
function docsSubjChanged(name){
  const subj = docs.staff.find(x => x.name.toLowerCase() === name.trim().toLowerCase());
  document.querySelectorAll('input[name="hc-to"]').forEach(i => {
    const isSubj = subj && i.value === subj.id;
    if (isSubj) i.checked = false;
    i.disabled = !!isSubj;
    i.closest('label').style.opacity = isSubj ? .45 : 1;
  });
}
Object.assign(window, { docsOpen, docsGo, docsSign, docsUpload, docsSendComplaint, docsSubjChanged });
</script>
