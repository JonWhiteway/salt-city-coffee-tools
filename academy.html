<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salt City Academy</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Montserrat:wght@400;600;700&display=swap');

:root{
  /* Full 5-step brand ramps, per the Academy competency style guide */
  --lead-900:#0D1B2A; --lead-700:#1B365D; --lead-500:#3E5C85; --lead-300:#A8B9D6; --lead-100:#F7F5F2;
  --craft-900:#2E3323; --craft-700:#6D745A; --craft-500:#B28C4E; --craft-300:#DCCFB5; --craft-100:#F6F2E8;
  --care-900:#8C3E2A; --care-700:#C75D3D; --care-500:#E48D5B; --care-300:#F4C9A6; --care-100:#FFF6EE;

  --navy:#1B365D; --navy-deep:#0D1B2A; --rust:#C75D3D; --caramel:#6D745A;
  --ink:#241A12; --ink-soft:#4A3B2E; --muted:#7A6A57;
  --paper:#FFFFFF; --panel:#F7F5F1; --line:#E3DED6;
  --green:#4C7A52; --green-tint:#E8F0E8; --amber:#B8863B; --amber-tint:#F5EBD8; --red:#A3453A; --red-tint:#F5E3E0;

  --shadow-sm:0 1px 3px rgba(13,27,42,0.08); --shadow-md:0 4px 16px rgba(13,27,42,0.10); --shadow-lg:0 12px 32px rgba(13,27,42,0.16);
}
*{box-sizing:border-box; margin:0; padding:0;}
body{ font-family:'Montserrat', sans-serif; background:var(--panel); color:var(--ink); min-height:100vh; }
h1,h2,h3{ font-family:'Oswald', sans-serif; text-transform:uppercase; letter-spacing:0.3px; }

  background-size:cover, cover; background-blend-mode:overlay;
  color:#fff; padding:18px 32px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;
  box-shadow:var(--shadow-lg); position:relative; z-index:10;
}
.topbar .brand{ display:flex; align-items:center; gap:12px; }
.topbar .brand .dot{ width:11px; height:11px; border-radius:50%; background:var(--care-500); box-shadow:0 0 12px var(--care-500); }
.topbar .brand-name{ font-family:'Oswald',sans-serif; font-weight:700; font-size:19px; letter-spacing:1px; }
.topbar .brand-sub{ font-size:10.5px; color:#9FB3C8; letter-spacing:2px; text-transform:uppercase; font-family:'Montserrat',sans-serif; }
.view-toggle{ display:flex; background:rgba(255,255,255,0.10); border-radius:10px; padding:4px; flex-wrap:wrap; backdrop-filter:blur(4px); }
.view-toggle button{ background:none; border:none; color:#B9C4CE; padding:9px 18px; border-radius:7px; font-family:'Montserrat',sans-serif; font-size:12.5px; font-weight:700; cursor:pointer; white-space:nowrap; letter-spacing:0.3px; transition:all .15s; }
.view-toggle button:hover{ color:#fff; }
.site-actions{ display:flex; gap:8px; align-items:center; }
.site-btn{ font-family:'Montserrat',sans-serif; font-size:12px; font-weight:700; color:#fff; background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.22); border-radius:8px; padding:8px 12px; text-decoration:none; cursor:pointer; white-space:nowrap; }
.site-btn:hover{ background:rgba(255,255,255,0.24); }
.site-btn.ghost{ background:none; color:#B9C4CE; }
.view-toggle button.active{ background:var(--care-700); color:#fff; box-shadow:var(--shadow-sm); }

main{ max-width:1180px; margin:0 auto; padding:32px; }
.view{ display:none; }
.view.active{ display:block; animation:fadeIn .35s ease; }
@keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

.page-head{ margin-bottom:26px; }
.page-head .eyebrow{ font-size:11.5px; letter-spacing:2.5px; color:var(--care-700); font-weight:700; text-transform:uppercase; font-family:'Montserrat',sans-serif; }
.page-head h1{ font-size:30px; font-weight:700; color:var(--lead-700); margin-top:6px; }
.page-head .sub{ color:var(--muted); font-size:14px; margin-top:5px; font-family:'Montserrat',sans-serif; }

.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:20px; }
.card{
  background:#fff; border:1px solid var(--line); border-radius:16px; padding:24px 26px; margin-bottom:20px;
  box-shadow:var(--shadow-sm); transition:box-shadow .2s, transform .2s;
}
.card:hover{ box-shadow:var(--shadow-md); }
.card h2{ font-size:12.5px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); font-weight:700; margin-bottom:16px; font-family:'Montserrat',sans-serif; }
.card .q{ font-size:17px; font-weight:700; color:var(--lead-700); margin-bottom:2px; font-family:'Oswald',sans-serif; text-transform:none; }

.comp-row{ display:flex; gap:22px; align-items:center; margin-top:14px; }
.comp-item{ text-align:center; min-width:88px; }
.comp-item .lbl{ font-size:11.5px; font-weight:700; margin-top:8px; white-space:nowrap; font-family:'Montserrat',sans-serif; text-transform:none; }
.gate-note{ background:var(--amber-tint); border-left:4px solid var(--amber); border-radius:0 10px 10px 0; padding:13px 16px; margin-top:16px; font-size:13px; color:var(--ink-soft); }

.next-callout{ background:linear-gradient(135deg, var(--lead-700) 0%, var(--lead-900) 100%); color:#fff; border-radius:12px; padding:20px 22px; box-shadow:var(--shadow-md); }
.next-callout .tag{ font-size:10.5px; letter-spacing:1.5px; text-transform:uppercase; color:var(--care-500); font-weight:700; }
.next-callout .title{ font-family:'Oswald',sans-serif; font-size:19px; font-weight:700; margin:8px 0 6px; text-transform:none; }
.next-callout .desc{ font-size:13px; color:#C7D2DC; font-family:'Montserrat',sans-serif; }
.next-callout a.btn{ display:inline-block; margin-top:14px; background:var(--care-700); color:#fff; padding:9px 18px; border-radius:8px; font-size:12.5px; font-weight:700; text-decoration:none; box-shadow:var(--shadow-sm); }

.feedback-item{ display:flex; justify-content:space-between; align-items:center; padding:11px 0; border-bottom:1px solid var(--line); font-size:13px; }
.feedback-item:last-child{ border-bottom:none; }
.feedback-item .fdate{ color:var(--muted); font-size:11.5px; }

.roster-table{ width:100%; border-collapse:collapse; font-size:13px; }
.roster-table th{ text-align:left; padding:9px 10px; font-size:10.5px; letter-spacing:0.6px; text-transform:uppercase; color:var(--muted); border-bottom:2px solid var(--line); }
.roster-table td{ padding:11px 10px; border-bottom:1px solid var(--line); vertical-align:middle; }

.alert-item{ display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--line); }
.alert-item:last-child{ border-bottom:none; }
.alert-item .aic{ width:34px; height:34px; border-radius:50%; background:var(--red-tint); color:var(--red); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; flex-shrink:0; }
.alert-item .aname{ font-weight:700; color:var(--ink); font-size:13px; }
.alert-item .asub{ color:var(--muted); font-size:11.5px; margin-top:1px; }

.heat-row{ display:flex; align-items:center; gap:12px; margin-bottom:12px; }
.heat-row .hlabel{ width:135px; font-size:12px; font-weight:600; flex-shrink:0; white-space:nowrap; }
.heat-bar-track{ flex:1; height:12px; background:var(--panel); border-radius:6px; overflow:hidden; box-shadow:inset 0 1px 3px rgba(13,27,42,0.12); }
.heat-bar-fill{ height:100%; border-radius:6px; transition:width .5s ease; background-image:linear-gradient(90deg, rgba(255,255,255,0.15), rgba(255,255,255,0)); }
.heat-row .hval{ width:38px; text-align:right; font-size:12px; font-weight:700; color:var(--muted); }

.content-row{ display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--line); }
.content-row:last-child{ border-bottom:none; }
.content-row .ctitle{ font-size:13.5px; font-weight:600; }
.content-row .cmeta{ font-size:11px; color:var(--muted); margin-top:2px; }
.content-row .cbtn{ background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:7px 14px; font-size:12px; font-weight:700; cursor:pointer; color:var(--ink); }
.content-row .cbtn.done{ background:var(--green-tint); color:var(--green); border-color:var(--green-tint); }

/* ---------- Progress bar (new: content completion) ---------- */
.progress-track{ height:8px; background:var(--panel); border-radius:5px; overflow:hidden; box-shadow:inset 0 1px 3px rgba(13,27,42,0.1); margin-top:6px; }
.progress-fill{ height:100%; border-radius:5px; transition:width .6s ease; }
.progress-label{ display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin-top:6px; font-weight:600; }

/* ---------- Radial gauge (new) ---------- */
.gauge-wrap{ display:flex; align-items:center; gap:16px; }
.gauge-num{ font-family:'Oswald',sans-serif; font-size:26px; font-weight:700; }
.gauge-lbl{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; }

/* ---------- Role tabs & Browse grid ---------- */
.role-tabs{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:20px; }
.role-tabs button{ background:#fff; border:1px solid var(--line); border-radius:20px; padding:9px 18px; font-size:12.5px; font-weight:700; cursor:pointer; color:var(--ink-soft); font-family:'Montserrat',sans-serif; transition:all .15s; }
.role-tabs button:hover{ border-color:var(--lead-500); }
.role-tabs button.active{ background:var(--lead-700); color:#fff; border-color:var(--lead-700); box-shadow:var(--shadow-sm); }

.academy-grid{ display:grid; grid-template-columns:145px repeat(3, 1fr); gap:12px; }
.academy-grid .col-head{ text-align:center; font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; padding:8px 0; font-family:'Montserrat',sans-serif; }
.academy-grid .row-head{ display:flex; align-items:center; font-size:13px; font-weight:700; color:var(--lead-700); white-space:nowrap; text-transform:none; font-family:'Oswald',sans-serif; }
.academy-cell{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:15px; min-height:110px; display:flex; flex-direction:column; justify-content:space-between; box-shadow:var(--shadow-sm); transition:box-shadow .2s; }
.academy-cell:hover{ box-shadow:var(--shadow-md); }
.academy-cell.placeholder{ background:var(--panel); border-style:dashed; opacity:0.7; box-shadow:none; }
.academy-cell .ctitle{ font-size:12.5px; font-weight:700; color:var(--ink); line-height:1.3; font-family:'Montserrat',sans-serif; }
.academy-cell.placeholder .ctitle{ color:var(--muted); font-weight:600; font-style:italic; }
.academy-cell .cmeta{ font-size:10.5px; color:var(--muted); margin-top:6px; }
.academy-cell .ctype{ display:inline-block; font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.4px; padding:3px 9px; border-radius:10px; margin-top:8px; align-self:flex-start; }
.ctype-document{ background:var(--lead-300); color:var(--lead-900); }
.ctype-video{ background:var(--care-300); color:var(--care-900); }
.ctype-quiz{ background:var(--craft-300); color:var(--craft-900); }
.ctype-external_link{ background:var(--panel); color:var(--muted); }
.coming-soon-badge{ font-size:9.5px; font-weight:700; text-transform:uppercase; color:var(--muted); letter-spacing:0.4px; }

/* ---------- Leader Tools hub (new) ---------- */
.tools-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:16px; margin-bottom:26px; }
.tool-card{
  border-radius:16px; padding:22px 20px; cursor:pointer; color:#fff; position:relative; overflow:hidden;
  box-shadow:var(--shadow-md); transition:transform .18s, box-shadow .18s; min-height:140px;
  display:flex; flex-direction:column; justify-content:flex-end;
}
.tool-card:hover{ transform:translateY(-4px); box-shadow:var(--shadow-lg); }
.tool-card.disabled{ cursor:default; opacity:0.55; }
.tool-card.disabled:hover{ transform:none; box-shadow:var(--shadow-md); }
.tool-card .ticon{ width:34px; height:34px; margin-bottom:10px; }
.tool-card .ttitle{ font-family:'Oswald',sans-serif; font-size:16px; font-weight:700; text-transform:none; }
.tool-card .tsub{ font-size:11.5px; color:rgba(255,255,255,0.82); margin-top:4px; font-family:'Montserrat',sans-serif; }
.tool-card .tbadge{ position:absolute; top:14px; right:14px; font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; background:rgba(255,255,255,0.2); padding:3px 8px; border-radius:10px; }
.tool-1on1{ background:linear-gradient(140deg, var(--lead-700), var(--lead-900)); }
.tool-style{ background:linear-gradient(140deg, var(--craft-700), var(--craft-900)); }
.tool-behaviors{ background:linear-gradient(140deg, var(--care-700), var(--care-900)); }
.tool-placeholder{ background:linear-gradient(140deg, #B0A99A, #7A7266); }

/* ---------- Modal (new) ---------- */
.modal-overlay{ display:none; position:fixed; inset:0; background:rgba(13,27,42,0.55); z-index:100; align-items:flex-start; justify-content:center; padding:40px 20px; overflow-y:auto; backdrop-filter:blur(2px); }
.modal-overlay.active{ display:flex; }
.modal-box{ background:#fff; border-radius:18px; max-width:560px; width:100%; padding:30px 30px 26px; box-shadow:var(--shadow-lg); position:relative; animation:modalIn .25s ease; }
@keyframes modalIn{ from{opacity:0; transform:translateY(-14px) scale(0.98);} to{opacity:1; transform:translateY(0) scale(1);} }
.modal-close{ position:absolute; top:18px; right:20px; background:none; border:none; font-size:22px; color:var(--muted); cursor:pointer; line-height:1; }
.modal-close:hover{ color:var(--ink); }
.modal-box h2{ font-size:20px; color:var(--lead-700); margin-bottom:6px; font-family:'Oswald',sans-serif; }
.modal-box .modal-sub{ font-size:13px; color:var(--muted); margin-bottom:20px; font-family:'Montserrat',sans-serif; }

.loading{ text-align:center; padding:60px; color:var(--muted); font-style:italic; }
.error-box{ background:var(--red-tint); color:var(--red); padding:16px 20px; border-radius:10px; margin:20px 0; font-size:14px; }
footer.note{ text-align:center; padding:24px; font-size:11.5px; color:var(--muted); font-style:italic; }

@media (max-width:900px){
  .grid2{ grid-template-columns:1fr; } main{ padding:20px; }
  .academy-grid{ grid-template-columns:80px repeat(3, 1fr); }
}
@media (max-width:650px){
  .academy-grid{ grid-template-columns:1fr; }
  .academy-grid .row-head{ margin-top:14px; }
  .comp-row{ gap:10px; }
  .tools-grid{ grid-template-columns:1fr 1fr; }
}

/* ---------- My Dashboard tabs (employee self-service) ---------- */
.emp-tabs{ display:flex; gap:4px; border-bottom:2px solid var(--line); margin-bottom:22px; overflow-x:auto; scrollbar-width:none; }
.emp-tabs::-webkit-scrollbar{ display:none; }
.emp-tabs button{ background:none; border:none; border-bottom:3px solid transparent; margin-bottom:-2px; padding:11px 16px; font-family:'Montserrat',sans-serif; font-size:13px; font-weight:700; color:var(--muted); cursor:pointer; white-space:nowrap; letter-spacing:.3px; }
.emp-tabs button:hover{ color:var(--lead-700); }
.emp-tabs button.active{ color:var(--lead-700); border-bottom-color:var(--care-700); }
.emp-badge{ display:none; margin-left:6px; min-width:18px; padding:1px 6px; border-radius:99px; background:var(--care-700); color:#fff; font-size:10.5px; line-height:16px; text-align:center; }
.emp-stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:20px; align-items:start; }
.emp-stat{ display:flex; flex-direction:column; gap:4px; }
.emp-label{ font-size:11px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); }
.emp-big{ font-family:'Oswald',sans-serif; font-size:28px; font-weight:700; color:var(--lead-700); line-height:1.15; }
.emp-big span{ font-size:15px; color:var(--muted); margin-left:2px; }
.emp-big.muted{ color:var(--line); }
.emp-note{ font-size:12px; color:var(--muted); line-height:1.5; }
.emp-disclaimer{ font-size:11.5px; color:var(--ink-soft); background:var(--panel); border-radius:8px; padding:9px 11px; margin-top:12px; line-height:1.5; }
.emp-disclaimer a, .emp-note a{ color:var(--care-700); font-weight:600; }
.emp-empty{ color:var(--muted); font-size:14px; }
.emp-top3{ margin:6px 0 0 20px; padding:0; font-size:14.5px; line-height:1.8; }
.emp-pill{ display:inline-block; font-size:11px; font-weight:700; padding:3px 9px; border-radius:99px; white-space:nowrap; }
.emp-pill.green{ background:var(--green-tint); color:var(--green); }
.emp-pill.amber{ background:var(--amber-tint); color:#8a6223; }
.emp-pill.red{ background:var(--red-tint); color:var(--red); }
.emp-pill.muted{ background:var(--panel); color:var(--muted); }
.emp-stat .emp-pill{ align-self:flex-start; margin-top:4px; }
.emp-convo{ border:1px solid var(--line); border-radius:10px; margin-bottom:10px; background:#fff; }
.emp-convo summary{ list-style:none; cursor:pointer; padding:12px 14px; display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:13.5px; }
.emp-convo summary::-webkit-details-marker{ display:none; }
.emp-convo summary::before{ content:'›'; color:var(--care-700); font-weight:700; margin-right:6px; transition:transform .15s; display:inline-block; }
.emp-convo[open] summary::before{ transform:rotate(90deg); }
.emp-convo summary > span:first-child{ flex:1; }
.emp-convo-body{ padding:0 14px 14px 28px; font-size:13px; color:var(--ink-soft); line-height:1.6; }
details.card.emp-convo{ padding:0; }
details.card.emp-convo .emp-convo-body{ padding:4px 22px 20px; }
.emp-table{ width:100%; border-collapse:collapse; font-size:13px; }
.emp-table th{ text-align:left; font-size:10.5px; letter-spacing:1px; text-transform:uppercase; color:#fff; background:var(--lead-700); padding:8px 10px; }
.emp-table td{ padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
.emp-avail td:first-child{ font-weight:600; width:42%; }
.emp-avail td{ padding:6px 8px; }
.emp-sub{ font-size:11px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--care-700); margin:18px 0 8px; }
.emp-text{ font-size:13.5px; color:var(--ink); line-height:1.6; white-space:pre-wrap; }
.emp-pip-meta{ display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; font-size:12.5px; color:var(--muted); }
.emp-checklist{ list-style:none; margin:12px 0 6px; padding:0; }
.emp-checklist li{ display:flex; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); font-size:13.5px; }
.emp-check{ flex:0 0 20px; height:20px; border-radius:5px; border:2px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:#fff; }
.emp-checklist li.met .emp-check{ background:var(--green); border-color:var(--green); }
.emp-checkin{ font-size:13px; padding:8px 0; border-bottom:1px solid var(--line); }
.emp-form label{ display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin:12px 0 5px; }
.emp-form input, .emp-form select{ width:100%; font-family:inherit; font-size:14px; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:var(--panel); color:var(--ink); }
.emp-form input:focus, .emp-form select:focus{ outline:none; border-color:var(--care-700); }
.emp-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:10px; }
.emp-btn{ margin-top:14px; background:var(--care-700); color:#fff; border:none; border-radius:8px; padding:10px 16px; font-family:inherit; font-size:13.5px; font-weight:700; cursor:pointer; }
.emp-btn.ghost{ background:none; color:var(--care-700); border:1px solid var(--care-700); margin-top:0; }
.emp-btn:disabled{ opacity:.6; cursor:default; }
.emp-msg{ font-size:12.5px; margin-top:8px; min-height:1em; }
.emp-msg.ok{ color:var(--green); } .emp-msg.err{ color:var(--red); }
.emp-req{ display:flex; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); font-size:13px; }
.emp-req-right{ display:flex; flex-direction:column; align-items:flex-end; gap:4px; }
.l360-card{ display:flex; justify-content:space-between; align-items:center; gap:16px; border-left:4px solid var(--care-700); }
.l360-card .emp-btn{ margin-top:0; text-decoration:none; white-space:nowrap; }
.l360-card .emp-btn.ghost{ display:inline-block; padding:10px 16px; border-radius:8px; }
.l360-title{ font-family:'Oswald',sans-serif; font-size:20px; font-weight:700; color:var(--lead-700); text-transform:uppercase; margin:2px 0 4px; }
.l360-card .emp-note a{ color:var(--care-700); font-weight:600; }
@media (max-width:820px){ .l360-card{ flex-direction:column; align-items:flex-start; } }
.emp-link{ background:none; border:none; color:var(--care-700); font-size:11.5px; text-decoration:underline; cursor:pointer; padding:0; font-family:inherit; }
@media (max-width:820px){
  .emp-stats{ grid-template-columns:1fr; gap:0; }
  .grid2{ grid-template-columns:1fr; gap:0; }
  main{ padding:20px 16px; }
  .emp-table th:nth-child(3), .emp-table td:nth-child(3){ display:none; }
}

function calculatePTO(totalHoursWorked){
  const tier = Math.min(4, Math.floor(totalHoursWorked / 1300));
  const hoursByTier = { 0: 0, 1: 16, 2: 24, 3: 32, 4: 40 };
  return hoursByTier[tier];
}
function calculateSickLeaveByYear(hoursLogEntries){
  const hoursByYear = {};
  for (const entry of hoursLogEntries) {
    const year = Number(String(entry.period_start).slice(0, 4)); // not new Date(): '2026-01-01' parses as UTC and lands in 2025 in US time zones
    hoursByYear[year] = (hoursByYear[year] || 0) + parseFloat(entry.hours_worked);
  }
  const accrualByYear = {};
  let totalBalance = 0;
  for (const [year, hours] of Object.entries(hoursByYear)) {
    const earned = Math.min(40, hours / 30);
    accrualByYear[year] = earned;
    totalBalance += earned;
  }
  return { accrualByYear, totalBalance };
}

const eToday = () => new Intl.DateTimeFormat('en-CA', { timeZone:'America/New_York', year:'numeric', month:'2-digit', day:'2-digit' }).format(new Date());
const eAdd = (d, n) => { const x = new Date(d + 'T12:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0,10); };
const eDays = (a, b) => Math.round((new Date(b + 'T12:00:00Z') - new Date(a + 'T12:00:00Z')) / 86400000);
const eFmt = d => d ? new Date(String(d).slice(0,10) + 'T12:00:00Z').toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric', timeZone:'UTC' }) : '—';
const eTime = t => { if (!t) return ''; const [h, m] = t.split(':').map(Number); return `${((h + 11) % 12) + 1}:${String(m).padStart(2,'0')}${h < 12 ? 'am' : 'pm'}`; };
const eTenure = d => {
  if (!d) return '';
  const m = Math.max(0, Math.floor(eDays(String(d).slice(0,10), eToday()) / 30.44));
  if (m < 1) return 'less than a month';
  return m < 12 ? `${m} month${m > 1 ? 's' : ''}` : `${Math.floor(m/12)} yr${m >= 24 ? 's' : ''}${m % 12 ? ` ${m % 12} mo` : ''}`;
};
const eMoney = n => n == null ? '—' : '$' + Number(n).toFixed(2);
const eStatus = s => ({ new:['Pending','amber'], approved:['Approved','green'], denied:['Denied','red'], cancelled:['Withdrawn','muted'] }[s] || [s,'muted']);

/* Attendance points: same math as the LM page (90-day expiry, 1 point earned back per 30 clean days). */
function empPointsTimeline(events, asOf){
  const evs = events.filter(e => !e.voided).map(e => ({ id:e.id, day:e.occurred_on, pts:Number(e.points) })).sort((x,y) => x.day.localeCompare(y.day));
  const out = { total:0, live:{}, nextDrop:null };
  if (!evs.length) return out;
  let active = [], lastEvent = null, i = 0;
  for (let day = evs[0].day; day <= asOf; day = eAdd(day, 1)) {
    active = active.filter(p => p.exp > day && p.pts > 0);
    while (i < evs.length && evs[i].day === day) { active.push({ id:evs[i].id, pts:evs[i].pts, exp:eAdd(day, 90) }); lastEvent = day; i++; }
    if (lastEvent && day !== lastEvent && eDays(lastEvent, day) % 30 === 0) {
      let remove = 1;
      for (const p of active) { const take = Math.min(p.pts, remove); p.pts -= take; remove -= take; if (remove <= 0) break; }
    }
  }
  active = active.filter(p => p.pts > 0);
  active.forEach(p => out.live[p.id] = { pts:p.pts, exp:p.exp });
  out.total = Math.round(active.reduce((a,p) => a + p.pts, 0) * 10) / 10;
  if (active.length && lastEvent) {
    const cleanDrop = eAdd(lastEvent, 30 * (Math.floor(eDays(lastEvent, asOf) / 30) + 1));
    const firstExp = active.map(p => p.exp).sort()[0];
    out.nextDrop = cleanDrop < firstExp ? { day:cleanDrop, why:'30 clean days' } : { day:firstExp, why:'a point expires' };
  }
  return out;
}
function empStanding(pts){
  if (pts >= 8) return ['Dismissal', 'red'];
  if (pts >= 7) return ['Final warning', 'red'];
  if (pts >= 5) return ['Written warning', 'amber'];
  if (pts >= 3) return ['Coaching conversation', 'amber'];
  return ['In good standing', 'green'];
}

/* ---------------- Growth (Academy levels and content) ---------------- */
function empGrowth(){
  const byComp = {};
  empData.status.forEach(s => byComp[s.competency] = s.current_level);
  const comps = ['leadership','craft','customer_care'];
  const levels = comps.map(c => byComp[c] || 0);

  const behind = comps.find(c => (byComp[c] || 0) === overall);
  const mine = c => (c.academy_progress || []).find(p => p.staff_id === currentProfile.id);
  const incomplete = empData.content.filter(c => !(mine(c) && mine(c).completed_at));

  return `

        ${levels.some(l => l !== overall) ? `<div class="gate-note">Advancement needs the same level across all three. ${COMPETENCY_LABELS[behind]} is the one holding your overall level at ${overall}.</div>` : ''}
      </div>

    </div>

/* ---------------- PIP ---------------- */
function empPip(){
  const pips = empData.pips;
  if (!pips.length) return `<div class="card"><h2>Performance Improvement Plan</h2><div class="emp-empty">You're not on a PIP.</div></div>`;

  const t = eToday();
  return pips.map((p, idx) => {
    const open = ['active','extended'].includes(p.status);

    const goals = Array.isArray(p.goals) ? p.goals : [];

        <span>${eFmt(p.start_date)} – ${eFmt(end)}${p.extended_to ? ' (extended)' : ''}</span>
        ${open && end ? `<span>${end >= t ? `${eDays(t, end)} days left` : 'ended, waiting on the outcome'}</span>` : ''}
        ${p.bucket ? `<span>${escapeHtml(BUCKET_LABELS[p.bucket] || p.bucket)}</span>` : ''}
      </div>
      ${p.issues ? `<div class="emp-sub">What needs to change</div><div class="emp-text">${escapeHtml(p.issues)}</div>` : ''}
      <div class="emp-sub">Requirements · ${met} of ${goals.length} met</div>
      <div class="progress-track"><div class="progress-fill" style="width:${goals.length ? (met / goals.length) * 100 : 0}%; background:var(--green);"></div></div>

      <div class="emp-note">Your manager marks each requirement as met during check-ins.</div>

      <div class="emp-sub">Weekly check-ins</div>
      ${cks.length ? cks.map(c => `<div class="emp-checkin"><strong>Week ${c.week}</strong> · ${eFmt(c.checkin_date)}${c.notes ? `<div class="emp-text">${escapeHtml(c.notes)}</div>` : ''}</div>`).join('') : '<div class="emp-note">No check-ins yet.</div>'}

          <button class="emp-btn" id="pto-submit">Send request</button>
          <div class="emp-msg" id="pto-msg"></div>
        </div>
        <div class="emp-sub">My PTO &amp; sick requests</div>
        ${hist(empMe.pto_requests || [], 'pto')}
      </div>
      <div class="card">
        <h2>Availability</h2>
        <div class="emp-sub" style="margin-top:0;">On file now</div>
        <table class="emp-table emp-avail"><tbody>${DOW.map((d, i) => {
          const a = byDay[i];
          const txt = !a ? '<span class="emp-note">Not set</span>' : a.available === false ? 'Unavailable' : (a.start_time || a.end_time) ? `${eTime(a.start_time) || 'Open'} – ${eTime(a.end_time) || 'Close'}` : 'Any time';

          ${locSelect('av-loc')}

          <select id="av-kind"><option value="standing">Every week (change my regular availability)</option><option value="one_off">Just one day (I need a day off)</option></select>
          <div id="av-standing">

function empMsg(id, text, ok){ const el = document.getElementById(id); if (el) { el.textContent = text; el.className = 'emp-msg ' + (ok ? 'ok' : 'err'); } }

async function empRefreshRequests(){
  try { empMe = await academyMe({ action:'profile' }); } catch (e) { /* keep the old copy */ }
  empBadges();
  if (empTab === 'requests') empRender();
}

function empWireRequests(){
  const kind = document.getElementById('av-kind');
  if (!kind) return;
  const sync = () => {
    document.getElementById('av-standing').style.display = kind.value === 'standing' ? '' : 'none';
    document.getElementById('av-oneoff').style.display = kind.value === 'one_off' ? '' : 'none';
    document.getElementById('av-times').style.display = document.getElementById('av-avail').value === 'yes' ? '' : 'none';
  };
  kind.addEventListener('change', sync);
  document.getElementById('av-avail').addEventListener('change', sync);
  sync();

  document.getElementById('pto-submit').addEventListener('click', async (e) => {
    const hours = parseFloat(document.getElementById('pto-hours').value);
    const date = document.getElementById('pto-date').value;
    if (!date) return empMsg('pto-msg', 'Pick a date.');
    if (!(hours > 0 && hours <= 16)) return empMsg('pto-msg', 'Enter how many hours (up to 16).');
    e.target.disabled = true; e.target.textContent = 'Sending…';
    try {
      await academyMe({ action:'request_pto', location_id:document.getElementById('pto-loc').value, shift_date:date, hours,
        leave_type:document.getElementById('pto-type').value, notes:document.getElementById('pto-notes').value });
      await empRefreshRequests();
      empMsg('pto-msg', 'Sent. Your LM will review it.', true);
    } catch (err) {
      empMsg('pto-msg', err.message); e.target.disabled = false; e.target.textContent = 'Send request';
    }
  });

  document.getElementById('av-submit').addEventListener('click', async (e) => {
    const k = kind.value;
    const payload = { action:'request_availability', location_id:document.getElementById('av-loc').value, request_type:k, reason:document.getElementById('av-reason').value };
    if (k === 'standing') {
      payload.day_of_week = Number(document.getElementById('av-day').value);
      payload.new_available = document.getElementById('av-avail').value === 'yes';
      payload.new_start_time = document.getElementById('av-start').value || null;
      payload.new_end_time = document.getElementById('av-end').value || null;
      if (payload.new_start_time && payload.new_end_time && payload.new_end_time <= payload.new_start_time) return empMsg('av-msg', '"Until" needs to be after "From".');
    } else {
      payload.exception_date = document.getElementById('av-date').value;
      if (!payload.exception_date) return empMsg('av-msg', 'Pick a date.');
    }
    e.target.disabled = true; e.target.textContent = 'Sending…';
    try {
      await academyMe(payload);
      await empRefreshRequests();
      empMsg('av-msg', 'Sent. Your manager will review it.', true);
    } catch (err) {
      empMsg('av-msg', err.message); e.target.disabled = false; e.target.textContent = 'Send to my manager';
    }
  });
}

async function empCancel(kind, id){
  if (!confirm('Withdraw this request?')) return;
  try { await academyMe({ action:'cancel', kind, id }); await empRefreshRequests(); }
  catch (e) { alert("Couldn't withdraw: " + e.message); }
}
window.empCancel = empCancel;

function ringHtml(competency, level){
  const circumference = 176;
  const dash = Math.max((level/3) * circumference, level > 0 ? 8 : 0);
  const color = COMPETENCY_COLORS[competency];
  return `<div class="comp-item">
    <svg width="70" height="70" viewBox="0 0 70 70">
      <circle cx="35" cy="35" r="28" fill="none" stroke="#E3DED6" stroke-width="8"/>
      <circle cx="35" cy="35" r="28" fill="none" stroke="${color}" stroke-width="8" stroke-dasharray="${dash} ${circumference}" stroke-linecap="round" transform="rotate(-90 35 35)"/>
      <text x="35" y="40" text-anchor="middle" font-family="Fraunces,serif" font-weight="700" font-size="15" fill="${color}">L${level}</text>
    </svg>
    <div class="lbl"><img src="${COMPETENCY_ICONS[competency]}" style="width:18px; height:18px; vertical-align:-4px; margin-right:4px;" alt="">${COMPETENCY_LABELS[competency]}</div></div>`;
}

async function loadStaffProfile(staffId){
  const resultEl = document.getElementById('lookup-result');
  if (!staffId) { resultEl.innerHTML = ''; return; }
  resultEl.innerHTML = '<div class="loading">Loading\u2026</div>';

  const [{ data: person }, { data: status }, { data: hoursLog }, { data: coaching }] = await Promise.all([
    sb.from(STAFF_TABLE).select('*').eq('id', staffId).single(),
    sb.from('academy_status').select('*').eq('staff_id', staffId),
    sb.from('staff_hours_log').select('*').eq('staff_id', staffId).order('period_start'),
    sb.from('academy_coaching_log').select('*').eq('staff_id', staffId).order('occurred_at', { ascending: false }).limit(5)
  ]);

  if (!person) { resultEl.innerHTML = '<div class="gate-note">Could not load that profile.</div>'; return; }

  const totalHoursWorked = (hoursLog || []).reduce((sum, h) => sum + parseFloat(h.hours_worked), 0);
  const ptoHours = calculatePTO(totalHoursWorked);
  const ptoTier = Math.min(4, Math.floor(totalHoursWorked / 1300));
  const nextTierHours = ptoTier < 4 ? (ptoTier + 1) * 1300 : null;
  const sickLeave = calculateSickLeaveByYear(hoursLog || []);
  const currentYear = new Date().getFullYear();
  const sickThisYear = sickLeave.accrualByYear[currentYear] || 0;

  const statusByComp = {};
  (status || []).forEach(s => statusByComp[s.competency] = s.current_level);
  const levels = ['leadership','craft','customer_care'].map(c => statusByComp[c] || 0);
  const overallLevel = Math.min(...levels);

  resultEl.innerHTML = `
    <div class="grid2">
      <div class="card">
        <h2>${person.name}</h2>
        <div class="sub" style="margin-bottom:10px;">${person.job_title || ROLE_LABELS[person.role] || person.role}</div>
        <div class="q">Level ${overallLevel} overall</div>
        <div class="comp-row">${['leadership','craft','customer_care'].map(c => ringHtml(c, statusByComp[c] || 0)).join('')}</div>
      </div>
      <div class="card">
        <h2>PTO &amp; Sick Leave</h2>
        ${!person.hire_date ? `<div class="gate-note">No company start date on file yet \u2014 accrual can't be calculated without it.</div>` : `
          <div style="font-size:12px; color:var(--muted); margin-bottom:14px;">Start date: ${person.hire_date} &middot; ${totalHoursWorked.toFixed(0)} hours logged to date</div>
          <div class="q" style="margin-bottom:4px;">PTO: ${ptoHours} hours earned</div>
          <div class="progress-track"><div class="progress-fill" style="width:${Math.min(100, (totalHoursWorked / (nextTierHours || 5200)) * 100)}%; background:var(--lead-700);"></div></div>
          <div class="progress-label"><span>${ptoTier >= 4 ? 'At the 40-hour cap' : `${(nextTierHours - totalHoursWorked).toFixed(0)} hours to next tier (+${calculatePTO(nextTierHours) - ptoHours} hrs)`}</span></div>

          <div class="q" style="margin:18px 0 4px;">Sick Leave: ${sickLeave.totalBalance.toFixed(1)} hours balance</div>
          <div class="progress-track"><div class="progress-fill" style="width:${Math.min(100, (sickThisYear / 40) * 100)}%; background:var(--care-700);"></div></div>
          <div class="progress-label"><span>${sickThisYear.toFixed(1)} of 40 hours earned this year${sickLeave.totalBalance > sickThisYear ? ' &middot; balance includes carryover from prior years' : ''}</span></div>
          <div style="font-size:11px; color:var(--muted); margin-top:14px;">Reference only, calculated the same way as their own dashboard \u2014 official balance and usage live in Gusto.</div>
        `}
      </div>
      <div class="card" style="grid-column:1 / -1;">
        <h2>Recent Coaching</h2>
        ${(coaching && coaching.length) ? coaching.map(c => `
          <div class="feedback-item" style="flex-direction:column; align-items:stretch;">
            <div style="display:flex; justify-content:space-between; width:100%;">
              <span>${labelConvo(c.conversation_type)}</span>
              <span class="fdate">${timeAgo(c.occurred_at)}</span>
            </div>
            ${c.template_notes ? `<div style="margin-top:10px; font-size:12.5px; color:var(--ink-soft); line-height:1.6;">${render1on1Notes(c.template_notes)}</div>` : ''}
          </div>
        `).join('') : `<div style="color:var(--muted); font-size:13px;">No coaching conversations logged yet.</div>`}
      </div>
    </div>
  `;
}

async function submitAssessment(){
  const targetEl = document.getElementById('la-target');
  const targetId = targetEl ? targetEl.value : currentProfile.id;
  const type = document.getElementById('la-type').value;
  const date = document.getElementById('la-date').value;
  const code = document.getElementById('la-code').value.trim();
  const msgEl = document.getElementById('la-submit-msg');

  if (!date) { msgEl.innerHTML = '<span style="color:var(--red);">Pick a date first.</span>'; return; }

  const dims = type === 'five_behaviors' ? FIVE_BEHAVIORS_DIMS : STYLE_DIMS;
  const results = {};
  for (const d of dims) {
    const val = document.getElementById('la-score-' + d.key).value;
    if (!val) { msgEl.innerHTML = `<span style="color:var(--red);">Fill in ${d.label} first.</span>`; return; }
    results[d.key] = parseInt(val, 10);
  }
  if (type === 'leadership_style') {
    const top = dims.reduce((a, b) => results[a.key] > results[b.key] ? a : b);
    results.primary_style = top.key;
  }

  const { error } = await sb.from('leadership_assessments').insert({
    staff_id: targetId,
    assessment_type: type,
    taken_at: date,
    external_code: code || null,
    results: results,
    entered_by: currentProfile.id,
  });

  if (error) {
    msgEl.innerHTML = `<span style="color:var(--red);">Could not save: ${error.message}</span>`;
    return;
  }
  msgEl.innerHTML = '<span style="color:var(--green);">Saved.</span>';
  loadAssessmentHistory();
}

/* GM 360 results filed on release (numbers only; comments stay in the report). */
function renderGm360History(entries){
  const f = n => n == null ? '\u2013' : Number(n).toFixed(2);
  return entries.slice().reverse().map(e => {
    const r = e.results || {}, co = r.competency_others || {}, cs = r.competency_self || {};
    const groups = ['below','beside','above'].filter(g => r.groups && r.groups[g])
      .map(g => `${({ below:'LMs', beside:'Peers', above:'Leadership' })[g]} ${f(r.groups[g].avg)} (${r.groups[g].n})`).join(' \u00b7 ');
    return `<div class="content-row">
      <div>
        <div class="ctitle">${escapeHtml(r.cycle || e.taken_at)} \u2014 Overall ${f(r.overall)} / 5 <span style="font-size:11px; color:var(--care-700); font-weight:700;">${r.raters || '?'} raters \u00b7 self ${f(r.self_overall)}</span></div>
        <div class="cmeta">Leadership ${f(co.lead)} (self ${f(cs.lead)}) \u00b7 Craft ${f(co.craft)} (self ${f(cs.craft)}) \u00b7 Customer Care ${f(co.care)} (self ${f(cs.care)})${groups ? ' \u00b7 ' + groups : ''}</div>
        ${r.l360_id ? `<a href="gm360.html?report=${r.l360_id}" style="font-size:12px; color:var(--care-700); font-weight:600;">Open full GM 360 report \u2192</a>` : ''}
      </div>
    </div>`;
  }).join('');
}

function renderFiveBehaviorsChart(entries){
  const w = 560, h = 220, padL = 30, padR = 10, padT = 10, padB = 30;
  const n = entries.length;
  const xStep = n > 1 ? (w - padL - padR) / (n - 1) : 0;
  const yFor = v => padT + (10 - v) / 9 * (h - padT - padB);
  const xFor = i => padL + i * xStep;

  let svg = `<svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto;">`;
  [2,4,6,8,10].forEach(v => {
    svg += `<line x1="${padL}" y1="${yFor(v)}" x2="${w-padR}" y2="${yFor(v)}" stroke="#E3DED6" stroke-width="1"/>`;
    svg += `<text x="${padL-6}" y="${yFor(v)+3}" font-size="9" fill="#7A6A57" text-anchor="end">${v}</text>`;
  });
  FIVE_BEHAVIORS_DIMS.forEach(dim => {
    const points = entries.map((e, i) => `${xFor(i)},${yFor(e.results[dim.key] ?? 5)}`).join(' ');
    svg += `<polyline points="${points}" fill="none" stroke="${dim.color}" stroke-width="2.5"/>`;
    entries.forEach((e, i) => svg += `<circle cx="${xFor(i)}" cy="${yFor(e.results[dim.key] ?? 5)}" r="3" fill="${dim.color}"/>`);
  });
  entries.forEach((e, i) => {
    svg += `<text x="${xFor(i)}" y="${h-8}" font-size="9" fill="#7A6A57" text-anchor="middle">${e.taken_at}</text>`;
  });
  svg += `</svg>`;

  const legend = FIVE_BEHAVIORS_DIMS.map(d => `<span style="display:inline-flex; align-items:center; gap:5px; margin-right:14px; font-size:11.5px; color:var(--muted);"><span style="width:9px;height:9px;border-radius:50%;background:${d.color};display:inline-block;"></span>${d.label}</span>`).join('');
  return svg + `<div style="margin-top:10px;">${legend}</div>`;
}

function renderStyleHistory(entries){
  return entries.map(e => {
    const top = STYLE_DIMS.reduce((a, b) => (e.results[a.key]||0) > (e.results[b.key]||0) ? a : b);
    const breakdown = STYLE_DIMS.map(d => `${d.label}: ${e.results[d.key] ?? '?'}`).join(' \u00b7 ');
    return `<div class="content-row">
      <div>
        <div class="ctitle">${e.taken_at} \u2014 Primary: ${top.label}${e.results && e.results.source === '360' ? ' <span style="font-size:11px; color:var(--care-700); font-weight:700;">360 \u00b7 ' + (e.results.raters || '?') + ' raters</span>' : ''}</div>
        <div class="cmeta">${breakdown}${e.results && e.results.source === '360' ? '' : (e.external_code ? ' \u00b7 Ref: ' + e.external_code : '')}</div>
        ${e.results && e.results.l360_id ? `<a href="360.html?report=${e.results.l360_id}" style="font-size:12px; color:var(--care-700); font-weight:600;">Open full 360 report \u2192</a>` : ''}
      </div>
    </div>`;
  }).join('');
}

/* ============================================================================
   CONTENT VIEWER — the actual "click and it opens" experience. Handles
   video (real embed, not a link), documents/external links (open in a new
   tab), quizzes (honest "not built yet" rather than a dead end pretending
   to work), and content that's still PENDING_UPLOAD.
   ========================================================================= */
function getEmbedUrl(url){
  if (!url) return null;
  const yt = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]+)/);
  if (yt) return `https://www.youtube.com/embed/${yt[1]}`;
  const vimeo = url.match(/vimeo\.com\/(\d+)/);
  if (vimeo) return `https://player.vimeo.com/video/${vimeo[1]}`;
  return null;
}

async function openContentViewModal(contentId){
  let item = allContentCache && allContentCache.find(c => c.id === contentId);
  if (!item) {
    const { data } = await sb.from('academy_content').select('*').eq('id', contentId).maybeSingle();
    item = data;
  }
  if (!item) return;

  if (!item.content_url || item.content_url === 'PENDING_UPLOAD') {
    openModal(`
      <h2>${item.title}</h2>
      <div class="modal-sub">${item.description || ''}</div>
      <div class="gate-note">This content hasn't been uploaded yet &mdash; the lesson exists in the Academy structure, but the real video/document link hasn't been added. Nothing to open here yet.</div>
    `);
    return;
  }

  let bodyHtml = '';
  if (item.content_type === 'video') {
    const embedUrl = getEmbedUrl(item.content_url);
    bodyHtml = embedUrl
      ? `<div style="position:relative; padding-bottom:56.25%; height:0; border-radius:10px; overflow:hidden; margin-bottom:16px;">
           <iframe src="${embedUrl}" style="position:absolute; top:0; left:0; width:100%; height:100%; border:0;" allowfullscreen></iframe>
         </div>`
      : `<div class="gate-note">Couldn't recognize this as a YouTube or Vimeo link. <a href="${item.content_url}" target="_blank" rel="noopener">Open it directly</a> instead.</div>`;
  } else if (item.content_type === 'quiz') {
    bodyHtml = `<div class="gate-note">The quiz-taking experience isn't built yet &mdash; this cell is reserved in the Academy structure for when it is.</div>`;
  } else {
    bodyHtml = `<a href="${item.content_url}" target="_blank" rel="noopener" style="display:inline-block; background:var(--lead-700); color:#fff; padding:11px 20px; border-radius:8px; text-decoration:none; font-size:13px; font-weight:700; margin-bottom:16px;">Open ${item.content_type === 'document' ? 'Document' : 'Link'} &rarr;</a>`;
  }

  const relevantToMe = !item.role_track || item.role_track === staffTrack(currentProfile);
  let completeButtonHtml = '';
  if (relevantToMe) {
    const { data: existing } = await sb.from('academy_progress').select('*').eq('staff_id', currentProfile.id).eq('content_id', item.id).maybeSingle();
    const alreadyDone = existing && existing.completed_at;
    completeButtonHtml = `
      <button class="cbtn ${alreadyDone ? 'done' : ''}" style="width:100%; padding:11px; font-size:13px; ${alreadyDone ? '' : 'background:var(--green); color:#fff; border:none;'}" onclick="markCompleteFromModal('${item.id}', this)">
        ${alreadyDone ? '\u2713 Completed' : 'Mark Complete'}
      </button>`;
  }

  openModal(`
    <h2>${item.title}</h2>
    <div class="modal-sub">${item.description || ''}</div>
    ${bodyHtml}
    ${completeButtonHtml}
  `);
}

async function submitContentForm(){
  const id = document.getElementById('ca-id').value;
  const msgEl = document.getElementById('ca-msg');
  const title = document.getElementById('ca-title').value.trim();
  if (!title) { msgEl.innerHTML = '<span style="color:var(--red);">Title is required.</span>'; return; }

  const payload = {
    title,
    description: document.getElementById('ca-description').value.trim(),
    role_track: document.getElementById('ca-role').value,
    competency: document.getElementById('ca-competency').value,
    level: parseInt(document.getElementById('ca-level').value, 10),
    content_type: document.getElementById('ca-type').value,
    estimated_minutes: document.getElementById('ca-minutes').value ? parseInt(document.getElementById('ca-minutes').value, 10) : null,
    content_url: document.getElementById('ca-url').value.trim() || 'PENDING_UPLOAD',
    is_active: document.getElementById('ca-active').checked,
  };

  let error;
  if (id) {
    ({ error } = await sb.from('academy_content').update(payload).eq('id', id));
  } else {
    payload.created_by = currentProfile.id;
    ({ error } = await sb.from('academy_content').insert(payload));
  }

  if (error) {
    msgEl.innerHTML = `<span style="color:var(--red);">Could not save: ${error.message}</span>`;
    return;
  }
  msgEl.innerHTML = '<span style="color:var(--green);">Saved.</span>';
  setTimeout(() => {
    closeModal();
    renderContentAdminView();
  }, 600);
}
window.submitContentForm = submitContentForm;

function gaugeSvg(pct, color){
  const r = 26, c = 2 * Math.PI * r;
  const dash = (pct / 100) * c;
  return `<svg width="64" height="64" viewBox="0 0 64 64">
    <circle cx="32" cy="32" r="${r}" fill="none" stroke="#E3DED6" stroke-width="7"/>
    <circle cx="32" cy="32" r="${r}" fill="none" stroke="${color}" stroke-width="7" stroke-dasharray="${dash} ${c}" stroke-linecap="round" transform="rotate(-90 32 32)"/>
    <text x="32" y="37" text-anchor="middle" font-family="Oswald,sans-serif" font-weight="700" font-size="16" fill="${color}">${pct}%</text>
  </svg>`;
}

const ONE_ON_ONE_TEMPLATE = [

      return `<div style="margin-bottom:8px;"><strong style="color:var(--ink);">${f.label}:</strong>${list}</div>`;
    }
    return `<div style="margin-bottom:8px;"><strong style="color:var(--ink);">${f.label}:</strong> ${templateNotes[f.key] ? escapeHtml(templateNotes[f.key]) : '<span style="color:var(--muted); font-style:italic;">not noted</span>'}</div>`;

function escapeHtml(str){

  div.textContent = str;
  return div.innerHTML;

<script>
/**
 * Team Cohesion Integration — Five Behaviors Live Data
 * =====================================================
 * Adds a live "Team Cohesion — Five Behaviors" card to the
 * Salt City Academy's Assessments view.
 *
 * Both the Academy and the Five Behaviors system share the same
 * Supabase project (jtuqwmwbdzrxupomlvln), so this uses the
 * Academy's existing `sb` client — no second connection needed.
 *
 * HOW TO INSTALL:
 *   1. Open index.html in the Command Deck Netlify folder (Google Drive)
 *   2. Find the closing </body> tag at the very end
 *   3. Paste this entire <script> block immediately before </body>
 *   4. Save and deploy
 *
 * That's it. The card appears automatically for GMs and above
 * whenever they open the Assessments view.
 */
(function () {

  /* ── Behavior display config ── */
  const BEHAVIORS = [
    { key: 'trust_avg',          label: 'Trust',          color: '#1F967E' },
    { key: 'conflict_avg',       label: 'Conflict',       color: '#E6A817' },
    { key: 'commitment_avg',     label: 'Commitment',     color: '#3B82F6' },
    { key: 'accountability_avg', label: 'Accountability', color: '#EF4444' },
    { key: 'results_avg',        label: 'Results',        color: '#8B5CF6' },
  ];

  function bandColor(v) { return v >= 4 ? '#1F967E' : v >= 3 ? '#E6A817' : '#EF4444'; }
  function bandLabel(v) { return v >= 4 ? 'HIGH'    : v >= 3 ? 'MED'    : 'LOW'; }

  /* ── Render snapshot + trend + history card ── */
  function renderCohesionCard(scores, locationName) {
    const cardId = 'fb-cohesion-' + locationName.replace(/\W+/g, '-').toLowerCase();

    if (!scores || !scores.length) {
      return `
        <div class="card" id="${cardId}" style="margin-top:20px;">
          <h2>Team Cohesion — Five Behaviors</h2>
          <div style="color:var(--muted);font-size:13px;padding:6px 0;">
            No closed assessment data yet for <strong>${locationName}</strong>.
            Assessments are launched from your Five Behaviors dashboard and scores
            appear here automatically once an assessment is closed.
          </div>
        </div>`;
    }

    const latest  = scores[scores.length - 1];
    const overall = BEHAVIORS.reduce((s, b) => s + (latest[b.key] || 0), 0) / BEHAVIORS.length;

    /* Snapshot grid */
    const grid = BEHAVIORS.map(b => {
      const v   = (latest[b.key] || 0).toFixed(1);
      const pct = ((parseFloat(v) - 1) / 4 * 100).toFixed(0);
      const c   = bandColor(parseFloat(v));
      return `
        <div style="text-align:center;padding:10px 4px;">
          <div style="font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;">${b.label}</div>
          <div style="font-size:26px;font-weight:800;color:${c};line-height:1;">${v}</div>
          <div style="font-size:10px;font-weight:700;color:${c};margin:3px 0 8px;">${bandLabel(parseFloat(v))}</div>
          <div style="height:5px;background:#E3DED6;border-radius:3px;overflow:hidden;">
            <div style="width:${pct}%;height:100%;background:${c};border-radius:3px;"></div>
          </div>
        </div>`;
    }).join('');

    /* Trend chart — only when 2+ assessments */
    let trendHtml = '';
    if (scores.length >= 2) {
      const W = 560, H = 190, PL = 34, PR = 10, PT = 10, PB = 26;
      const n   = scores.length;
      const xFor = i => PL + (i / (n - 1)) * (W - PL - PR);
      const yFor = v => PT + (5 - Math.min(5, Math.max(1, v))) / 4 * (H - PT - PB);

      let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;">`;
      [1, 2, 3, 4, 5].forEach(v => {
        svg += `<line x1="${PL}" y1="${yFor(v)}" x2="${W-PR}" y2="${yFor(v)}" stroke="#E3DED6" stroke-width="1"/>`;
        svg += `<text x="${PL-5}" y="${yFor(v)+4}" font-size="9" fill="#9A8A78" text-anchor="end">${v}</text>`;
      });
      BEHAVIORS.forEach(b => {
        const pts = scores.map((s, i) => `${xFor(i).toFixed(1)},${yFor(s[b.key] || 1).toFixed(1)}`).join(' ');
        svg += `<polyline points="${pts}" fill="none" stroke="${b.color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
        scores.forEach((s, i) => {
          svg += `<circle cx="${xFor(i).toFixed(1)}" cy="${yFor(s[b.key] || 1).toFixed(1)}" r="3.5" fill="${b.color}"/>`;
        });
      });
      scores.forEach((s, i) => {
        const lbl = s.assessment_name
          ? s.assessment_name.substring(0, 14)
          : new Date(s.closed_at || '').toLocaleDateString('en-US', { month: 'short', year: '2-digit' });
        svg += `<text x="${xFor(i).toFixed(1)}" y="${H - 6}" font-size="8.5" fill="#9A8A78" text-anchor="middle">${lbl}</text>`;
      });
      svg += `</svg>`;

      const legend = BEHAVIORS.map(b =>
        `<span style="display:inline-flex;align-items:center;gap:4px;margin-right:12px;font-size:11px;color:var(--muted);">
           <span style="width:8px;height:8px;border-radius:50%;background:${b.color};display:inline-block;"></span>${b.label}
         </span>`
      ).join('');

      trendHtml = `
        <div style="margin-top:22px;">
          <div style="font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;">Trend Over Time</div>
          ${svg}
          <div style="margin-top:8px;">${legend}</div>
        </div>`;
    }

    /* History list */
    const historyRows = scores.length > 1
      ? [...scores].reverse().map(s => {
          const avg = BEHAVIORS.reduce((sum, b) => sum + (s[b.key] || 0), 0) / BEHAVIORS.length;
          const dateStr = s.closed_at
            ? new Date(s.closed_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
            : '—';
          return `
            <div style="display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #F0EBE5;">
              <div>
                <div style="font-size:13px;font-weight:600;color:var(--ink);">${s.assessment_name || 'Assessment'}</div>
                <div style="font-size:11.5px;color:var(--muted);">${dateStr}${s.respondent_count ? ' · ' + s.respondent_count + ' respondents' : ''}</div>
              </div>
              <div style="font-size:20px;font-weight:800;color:${bandColor(avg)};min-width:40px;text-align:right;">${avg.toFixed(1)}</div>
            </div>`;
        }).join('')
      : '';

    const latestDate = latest.closed_at
      ? new Date(latest.closed_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
      : '';

    return `
      <div class="card" id="${cardId}" style="margin-top:20px;">
        <h2 style="margin-bottom:3px;">Team Cohesion — Five Behaviors</h2>
        <div style="font-size:12px;color:var(--muted);margin-bottom:18px;">
          ${locationName}${latestDate ? ' · ' + latestDate : ''}
          · Overall <strong style="color:${bandColor(overall)};">${overall.toFixed(1)} / 5.0</strong>
        </div>

        <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px;background:#F7F4F0;border-radius:10px;padding:8px;">
          ${grid}
        </div>

        ${trendHtml}

        ${historyRows ? `
        <div style="margin-top:20px;">
          <div style="font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;">History</div>
          ${historyRows}
        </div>` : ''}
      </div>`;
  }

  /* ── Fetch and inject the card(s) ── */
  async function injectCohesionCards() {
    /* Remove any cards from a previous render */
    document.querySelectorAll('[id^="fb-cohesion-"]').forEach(el => el.remove());

    const profile = window.currentProfile;
    if (!profile) return;

    /* Only show to managers and above */
    const mgr = ['location_manager', 'gm', 'production_manager', 'coo', 'ceo', 'cbo'];
    if (!mgr.includes(profile.role)) return;

    const sb = window.sb; /* Academy's existing Supabase client — same project */
    const container = document.getElementById('view-assessments');
    if (!container) return;

    let locationIds = [];

    if (['coo', 'ceo', 'cbo'].includes(profile.role)) {
      /* COO/CEO sees all locations */
      const { data: locs } = await sb.from('locations').select('id, name').order('name');
      locationIds = (locs || []).map(l => ({ id: l.id, name: l.name }));
    } else {
      /* GMs: resolve their locations from staff_locations */
      const { data: myLocs } = await sb.from('staff_locations').select('location_id').eq('staff_id', profile.id);
      if (!myLocs || !myLocs.length) return;
      const locIds = myLocs.map(l => l.location_id);
      const { data: locs } = await sb.from('locations').select('id, name').in('id', locIds);
      locationIds = (locs || []).map(l => ({ id: l.id, name: l.name }));
    }

    if (!locationIds.length) return;

    /* For each location, fetch closed assessment scores */
    for (const loc of locationIds) {
      const { data: scores, error } = await sb
        .from('assessment_scores')
        .select(`
          trust_avg, conflict_avg, commitment_avg, accountability_avg, results_avg,
          respondent_count,
          assessments!inner ( id, name, closed_at, location_id )
        `)
        .eq('assessments.location_id', loc.id)
        .order('assessments.closed_at', { ascending: true, foreignTable: 'assessments' });

      if (error) {
        console.warn('[Team Cohesion] Error fetching scores for', loc.name, error);
        continue;
      }

      const flat = (scores || []).map(s => ({
        trust_avg:          s.trust_avg,
        conflict_avg:       s.conflict_avg,
        commitment_avg:     s.commitment_avg,
        accountability_avg: s.accountability_avg,
        results_avg:        s.results_avg,
        respondent_count:   s.respondent_count,
        assessment_name:    s.assessments?.name,
        closed_at:          s.assessments?.closed_at,
      }));

      container.insertAdjacentHTML('beforeend', renderCohesionCard(flat, loc.name));
    }
  }

  /* ── Patch renderAssessmentsView ── */
  document.addEventListener('DOMContentLoaded', () => {
    const _orig = window.renderAssessmentsView;
    if (typeof _orig === 'function') {
      window.renderAssessmentsView = async function () {
        await _orig.apply(this, arguments);
        await injectCohesionCards();
      };
    }
  });

})();

</script>
<script>
/* =====================================================================
   REQUIRED TRAINING — NY Sexual Harassment Prevention (state model program)
   - Everyone: due Dec 31 each year. New hires: due 30 days after hire date.
   - Flow: policy → state video (EN/ES) → interactive check → feedback/question → e-signature.
   - Saves one row per person per year in compliance_completions. A trigger copies the date
     to staff_hr_details.harassment_training_on, which the LM page already reads.
   ===================================================================== */
const SHPT_KEY = 'ny_shpt';
const SHPT_STATE_POLICY = 'https://www.ny.gov/combating-sexual-harassment-workplace/sexual-harassment-prevention-model-policy-and-training';
const SHPT_STATE_SHEET = { en:'https://www.ny.gov/sites/default/files/2023-04/Sexual_Harassment_Prevention_Training_Answer_Sheet.pdf',
                           es:'https://www.ny.gov/sites/default/files/2026-02/NYS_Sexual_Harrassment_Prevention_Training_Answer%20Sheet_Spanish.pdf' };
const SHPT_SUP_ROLES = ['gm','location_manager','production_manager','bookkeeper','coo','ceo','cbo','product_development'];
let shpt = { loaded:false, cfg:null, rows:[], lang:'en', step:0, watched:{}, ytReady:false, players:{}, answers:{}, qIdx:0, policyOk:false, feedback:'', rating:0, question:'' };

/* ---------- due-date rule (same function lives on the LM page) ---------- */
function shptAddDays(d, n){ const x = new Date(d + 'T12:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0,10); }
function shptStatus(hireDate, lastDone, today){
  const Y = today.slice(0,4);
  if (lastDone && lastDone.slice(0,4) >= Y) return { state:'done', due:null, year:Number(lastDone.slice(0,4)) };
  let due = `${Y}-12-31`, newHire = false;
  if (hireDate) { const h30 = shptAddDays(hireDate, 30); if (h30 >= `${Y}-01-01` && hireDate >= shptAddDays(`${Y}-01-01`, -30)) { due = h30; newHire = true; } }
  const days = Math.round((new Date(due + 'T12:00:00Z') - new Date(today + 'T12:00:00Z')) / 86400000);
  return { state: days < 0 ? 'overdue' : days <= 30 ? 'soon' : 'due', due, days, newHire, year:Number(Y) };
}
function shptMine(){
  const last = (shpt.rows[0] || {}).completed_on || null;
  return shptStatus(currentProfile.hire_date, last, eToday());
}
const shptIsSup = () => SHPT_SUP_ROLES.includes(currentProfile.role) || /lead|manager|supervisor|director/i.test(currentProfile.job_title || '');

async function shptLoad(){
  const [{ data: cfg }, { data: rows }] = await Promise.all([
    sb.from('compliance_trainings').select('*').eq('key', SHPT_KEY).maybeSingle(),
    sb.from('compliance_completions').select('*').eq('staff_id', currentProfile.id).eq('training_key', SHPT_KEY).order('completed_on', { ascending:false }),
  ]);
  shpt.cfg = cfg || { title:'NY Sexual Harassment Prevention Training', videos:{ en:[{ id:'A9gudpiQ40M', label:'Training video' }], es:[{ id:'VH3T4agU8XE', label:'Video de capacitación' },{ id:'IP-i7R4SfWA', label:'Casos de estudio' }] } };
  shpt.rows = rows || [];
  shpt.loaded = true;
}

/* ---------- words (English / Spanish) ---------- */
const SHPT_T = {
  en:{ title:'Sexual Harassment Prevention', yearly:'Required every year by New York State', start:'Start training', resume:'Continue training',
    steps:['Start','Policy','Video','Check','Questions','Sign'], next:'Next →', back:'← Back',
    introA:'New York requires every employee to complete sexual harassment prevention training once a year. We use the free training made by New York State.',
    introB:'It takes about 45–60 minutes: read our policy, watch the state video, answer a few short questions, then sign. You can ask your manager questions at the end.',

/* ---------- interactive questions (original Salt City scenarios covering the state minimum standards) ---------- */
const SHPT_Q = [
 { id:'customer', sup:false,
   q:{ en:'A regular keeps commenting on a barista\'s body and asking her out, even after she says no. What should happen?',

   x:{ en:'New York protects employees from harassment by non-employees too: customers, vendors, delivery drivers. Once the company knows, it has to take action.',

 { id:'standard', sup:false,

      { en:'No. It\'s unlawful if someone is treated worse because of sex (or another protected trait), unless it\'s only a petty slight or trivial inconvenience.', es:'No. Es ilegal si alguien recibe peor trato por su sexo (u otra característica protegida), a menos que sea solo un desaire menor o una molestia trivial.' }], a:1,
   x:{ en:'Since 2019, New York does not require harassment to be severe or pervasive. The bar is much lower than many people think.',

 { id:'overheard', sup:false,
   q:{ en:'Two coworkers trade sexual jokes in the back during close. A third coworker hears it and is uncomfortable, but the jokes weren\'t about her. Could this be harassment?',
       es:'Dos compañeros intercambian chistes sexuales atrás durante el cierre. Una tercera compañera los escucha y se siente incómoda, aunque los chistes no eran sobre ella. ¿Puede ser acoso?' },
   o:[{ en:'Yes. It can create a hostile work environment for anyone who has to hear it.', es:'Sí. Puede crear un ambiente de trabajo hostil para cualquiera que tenga que escucharlo.' },
      { en:'No. Only the person a joke is about can be harassed.', es:'No. Solo la persona de quien trata el chiste puede ser acosada.' }], a:0,
   x:{ en:'Harassment doesn\'t have to be aimed at you. Sexual jokes, pictures or talk in the workplace can create a hostile environment for everyone around.',

 { id:'quidproquo', sup:false,
   q:{ en:'A manager tells a barista they\'ll get the weekend shifts they want if they go on a date. This is…', es:'Un gerente le dice a un barista que le dará los turnos de fin de semana que quiere si sale con él. Esto es…' },
   o:[{ en:'Fine, as long as both people are adults.', es:'Aceptable, siempre que ambos sean adultos.' },
      { en:'Only harassment if the barista says no and loses the shifts.', es:'Acoso solo si el barista dice que no y pierde los turnos.' },
      { en:'Sexual harassment ("quid pro quo"), whether or not the barista agrees.', es:'Acoso sexual ("quid pro quo"), acepte o no el barista.' }], a:2,
   x:{ en:'Offering or threatening anything at work (shifts, raises, schedules) in exchange for sexual attention is quid pro quo harassment.',
       es:'Ofrecer o amenazar con algo del trabajo (turnos, aumentos, horarios) a cambio de atención sexual es acoso "quid pro quo".' } },
 { id:'retaliation', sup:false,
   q:{ en:'After Sam reports a coworker for unwanted touching, Sam\'s shift lead cuts Sam\'s hours "to keep things calm." Is that OK?',
       es:'Después de que Sam reporta a un compañero por tocarle sin su consentimiento, el líder de turno le reduce las horas a Sam "para calmar las cosas". ¿Está bien?' },
   o:[{ en:'No. That\'s retaliation, which is illegal even if the complaint isn\'t proven.', es:'No. Eso es represalia, y es ilegal aunque la queja no se compruebe.' },
      { en:'Yes, if the investigation finds it wasn\'t harassment.', es:'Sí, si la investigación concluye que no fue acoso.' }], a:0,
   x:{ en:'Punishing someone for a good-faith complaint, for being a witness, or for helping an investigation is retaliation. It is against the law and our policy.',
       es:'Castigar a alguien por una queja de buena fe, por ser testigo o por ayudar en una investigación es represalia. Es ilegal y va contra nuestra política.' } },
 { id:'gender', sup:false,
   q:{ en:'A coworker keeps using a transgender teammate\'s old name and pronouns on purpose and says "that\'s not a real man." Is this covered by our policy?',

   o:[{ en:'No. It\'s a personal opinion.', es:'No. Es una opinión personal.' },
      { en:'Yes. Harassment because of gender identity or expression, or for not fitting sex stereotypes, is sex discrimination under NY law.', es:'Sí. El acoso por identidad o expresión de género, o por no encajar en estereotipos, es discriminación sexual según la ley de NY.' }], a:1,
   x:{ en:'New York\'s definition of sexual harassment includes harassment based on gender identity, gender expression and sex stereotypes.',
       es:'La definición de acoso sexual de Nueva York incluye el acoso por identidad de género, expresión de género y estereotipos sexuales.' } },
 { id:'afterhours', sup:false,
   q:{ en:'A coworker sends sexual memes to a teammate in the team group chat at 11pm. Is it a work issue?',
       es:'Un compañero le manda memes sexuales a otro en el chat del equipo a las 11 pm. ¿Es un asunto de trabajo?' },
   o:[{ en:'Yes. Harassment through texts or social media can be workplace harassment when it affects how someone is treated at work.', es:'Sí. El acoso por mensajes o redes sociales puede ser acoso laboral cuando afecta cómo se trata a alguien en el trabajo.' },
      { en:'No. It\'s after hours, so the company can\'t do anything.', es:'No. Es fuera del horario, así que la empresa no puede hacer nada.' }], a:0,
   x:{ en:'Harassment isn\'t limited to the café or your shift. Texts, group chats, social media and work events all count.',
       es:'El acoso no se limita al café o a su turno. Los mensajes, chats de grupo, redes sociales y eventos de trabajo también cuentan.' } },
 { id:'bystander', sup:false,
   q:{ en:'You see a coworker crowding someone in the walk-in and they look uncomfortable. What\'s a good bystander response?',
       es:'Ve a un compañero arrinconando a alguien en el cuarto frío y esa persona se ve incómoda. ¿Qué es una buena respuesta como testigo?' },
   o:[{ en:'Stay out of it. It\'s not your business.', es:'No meterse. No es asunto suyo.' },
      { en:'Interrupt ("Hey, I need you up front"), check on the person afterward, and tell a manager.', es:'Interrumpir ("Oye, te necesito adelante"), preguntarle a la persona cómo está después y avisar a un gerente.' },
      { en:'Post about it so everyone knows.', es:'Publicarlo para que todos se enteren.' }], a:1,
   x:{ en:'Anyone who sees harassment can safely step in, support the person, and report it. Witnesses are protected from retaliation too.',
       es:'Cualquiera que vea acoso puede intervenir de forma segura, apoyar a la persona y reportarlo. Los testigos también están protegidos contra represalias.' } },
 { id:'report', sup:false,
   q:{ en:'Where can you report sexual harassment?', es:'¿Dónde puede reportar el acoso sexual?' },
   o:[{ en:'Only to your own manager, and only in writing.', es:'Solo a su propio gerente, y solo por escrito.' },
      { en:'Any Salt City manager or leadership (out loud or in writing), and outside the company: NYS Division of Human Rights, the EEOC, 1-800-HARASS-3, or the police.', es:'Cualquier gerente o la dirección de Salt City (en persona o por escrito), y fuera de la empresa: la División de Derechos Humanos de NY, la EEOC, 1-800-HARASS-3 o la policía.' },
      { en:'Only to the police.', es:'Solo a la policía.' }], a:1,
   x:{ en:'You can go to any manager, not just your own. You don\'t have to use our internal process before going to a state or federal agency.',
       es:'Puede acudir a cualquier gerente, no solo al suyo. No tiene que usar nuestro proceso interno antes de acudir a una agencia estatal o federal.' } },
 { id:'sup_report', sup:true,
   q:{ en:'A barista tells you, a shift lead, that a coworker\'s comments make her uncomfortable, but asks you not to tell anyone. What do you do?',
       es:'Una barista le dice a usted, líder de turno, que los comentarios de un compañero la incomodan, pero le pide que no se lo diga a nadie. ¿Qué hace?' },

      { en:'Handle it yourself by talking to the coworker.', es:'Resolverlo usted mismo hablando con el compañero.' },
      { en:'Tell her you have to report it, report it to your LM or leadership, and keep it as private as possible.', es:'Decirle que tiene que reportarlo, reportarlo a su Gerente de Local o a la dirección, y mantenerlo lo más privado posible.' }], a:2,
   x:{ en:'Supervisors and managers must report harassment they see or hear about. You can\'t promise total secrecy, but the company keeps it as confidential as it can.',
       es:'Los supervisores y gerentes deben reportar el acoso que vean o del que se enteren. No puede prometer secreto total, pero la empresa lo mantiene tan confidencial como pueda.' } },
 { id:'sup_liability', sup:true,
   q:{ en:'What happens if a supervisor knows about harassment and lets it continue?', es:'¿Qué pasa si un supervisor sabe del acoso y deja que continúe?' },
   o:[{ en:'Nothing, as long as they weren\'t the one doing it.', es:'Nada, mientras no sea quien lo hace.' },
      { en:'They can be disciplined, and the company (and sometimes the supervisor personally) can be held legally responsible.', es:'Pueden ser sancionados, y la empresa (y a veces el supervisor personalmente) puede ser legalmente responsable.' }], a:1,
   x:{ en:'Supervisors carry extra responsibility. Ignoring harassment, or harassing or retaliating yourself, leads to discipline and possible legal liability.',
       es:'Los supervisores tienen una responsabilidad mayor. Ignorar el acoso, o acosar o tomar represalias, lleva a sanciones y posible responsabilidad legal.' } },
