      return `<div style="margin-bottom:8px;"><strong style="color:var(--ink);">${f.label}:</strong>${list}</div>`;
    }
    return `<div style="margin-bottom:8px;"><strong style="color:var(--ink);">${f.label}:</strong> ${templateNotes[f.key] ? escapeHtml(templateNotes[f.key]) : '<span style="color:var(--muted); font-style:italic;">not noted</span>'}</div>`;
  }).join('');
}

function toggleFeedbackDetail(i){
  const el = document.getElementById('feedback-detail-' + i);
  if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
}
window.toggleFeedbackDetail = toggleFeedbackDetail;

function toggleTop3History(){
  const el = document.getElementById('top3-history');
  if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
}
window.toggleTop3History = toggleTop3History;

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

init();
</script>

<script>
/**
 * Team Cohesion Integration — Five Behaviors Live Data
 * =====================================================
 * Adds a live "Team Cohesion — Five Behaviors" card to the
 * Salt City Academy's Assessments view.
 *
 * Both the Academy and the Five Behaviors system share the same
 * Supabase project (jtuqwmwbdzrxupomlvln), so this uses the
 * Academy's existing `sb` client — no second connection needed.
 *
 * HOW TO INSTALL:
 *   1. Open index.html in the Command Deck Netlify folder (Google Drive)
 *   2. Find the closing </body> tag at the very end
 *   3. Paste this entire <script> block immediately before </body>
 *   4. Save and deploy
 *
 * That's it. The card appears automatically for GMs and above
 * whenever they open the Assessments view.
 */
(function () {

  /* ── Behavior display config ── */
  const BEHAVIORS = [
    { key: 'trust_avg',          label: 'Trust',          color: '#1F967E' },
    { key: 'conflict_avg',       label: 'Conflict',       color: '#E6A817' },
    { key: 'commitment_avg',     label: 'Commitment',     color: '#3B82F6' },
    { key: 'accountability_avg', label: 'Accountability', color: '#EF4444' },
    { key: 'results_avg',        label: 'Results',        color: '#8B5CF6' },
  ];

  function bandColor(v) { return v >= 4 ? '#1F967E' : v >= 3 ? '#E6A817' : '#EF4444'; }
  function bandLabel(v) { return v >= 4 ? 'HIGH'    : v >= 3 ? 'MED'    : 'LOW'; }

  /* ── Render snapshot + trend + history card ── */
  function renderCohesionCard(scores, locationName) {
    const cardId = 'fb-cohesion-' + locationName.replace(/\W+/g, '-').toLowerCase();

    if (!scores || !scores.length) {
      return `
        <div class="card" id="${cardId}" style="margin-top:20px;">
          <h2>Team Cohesion — Five Behaviors</h2>
          <div style="color:var(--muted);font-size:13px;padding:6px 0;">
            No closed assessment data yet for <strong>${locationName}</strong>.
            Assessments are launched from your Five Behaviors dashboard and scores
            appear here automatically once an assessment is closed.
          </div>
        </div>`;
    }

    const latest  = scores[scores.length - 1];
    const overall = BEHAVIORS.reduce((s, b) => s + (latest[b.key] || 0), 0) / BEHAVIORS.length;

    /* Snapshot grid */
    const grid = BEHAVIORS.map(b => {
      const v   = (latest[b.key] || 0).toFixed(1);
      const pct = ((parseFloat(v) - 1) / 4 * 100).toFixed(0);
      const c   = bandColor(parseFloat(v));
      return `
        <div style="text-align:center;padding:10px 4px;">
          <div style="font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;">${b.label}</div>
          <div style="font-size:26px;font-weight:800;color:${c};line-height:1;">${v}</div>
          <div style="font-size:10px;font-weight:700;color:${c};margin:3px 0 8px;">${bandLabel(parseFloat(v))}</div>
          <div style="height:5px;background:#E3DED6;border-radius:3px;overflow:hidden;">
            <div style="width:${pct}%;height:100%;background:${c};border-radius:3px;"></div>
          </div>
        </div>`;
    }).join('');

    /* Trend chart — only when 2+ assessments */
    let trendHtml = '';
    if (scores.length >= 2) {
      const W = 560, H = 190, PL = 34, PR = 10, PT = 10, PB = 26;
      const n   = scores.length;
      const xFor = i => PL + (i / (n - 1)) * (W - PL - PR);
      const yFor = v => PT + (5 - Math.min(5, Math.max(1, v))) / 4 * (H - PT - PB);

      let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;">`;
      [1, 2, 3, 4, 5].forEach(v => {
        svg += `<line x1="${PL}" y1="${yFor(v)}" x2="${W-PR}" y2="${yFor(v)}" stroke="#E3DED6" stroke-width="1"/>`;
        svg += `<text x="${PL-5}" y="${yFor(v)+4}" font-size="9" fill="#9A8A78" text-anchor="end">${v}</text>`;
      });
      BEHAVIORS.forEach(b => {
        const pts = scores.map((s, i) => `${xFor(i).toFixed(1)},${yFor(s[b.key] || 1).toFixed(1)}`).join(' ');
        svg += `<polyline points="${pts}" fill="none" stroke="${b.color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
        scores.forEach((s, i) => {
          svg += `<circle cx="${xFor(i).toFixed(1)}" cy="${yFor(s[b.key] || 1).toFixed(1)}" r="3.5" fill="${b.color}"/>`;
        });
      });
      scores.forEach((s, i) => {
        const lbl = s.assessment_name
          ? s.assessment_name.substring(0, 14)
          : new Date(s.closed_at || '').toLocaleDateString('en-US', { month: 'short', year: '2-digit' });
        svg += `<text x="${xFor(i).toFixed(1)}" y="${H - 6}" font-size="8.5" fill="#9A8A78" text-anchor="middle">${lbl}</text>`;
      });
      svg += `</svg>`;

      const legend = BEHAVIORS.map(b =>
        `<span style="display:inline-flex;align-items:center;gap:4px;margin-right:12px;font-size:11px;color:var(--muted);">
           <span style="width:8px;height:8px;border-radius:50%;background:${b.color};display:inline-block;"></span>${b.label}
         </span>`
      ).join('');

      trendHtml = `
        <div style="margin-top:22px;">
          <div style="font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;">Trend Over Time</div>
          ${svg}
          <div style="margin-top:8px;">${legend}</div>
        </div>`;
    }

    /* History list */
    const historyRows = scores.length > 1
      ? [...scores].reverse().map(s => {
          const avg = BEHAVIORS.reduce((sum, b) => sum + (s[b.key] || 0), 0) / BEHAVIORS.length;
          const dateStr = s.closed_at
            ? new Date(s.closed_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
            : '—';
          return `
            <div style="display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #F0EBE5;">
              <div>
                <div style="font-size:13px;font-weight:600;color:var(--ink);">${s.assessment_name || 'Assessment'}</div>
                <div style="font-size:11.5px;color:var(--muted);">${dateStr}${s.respondent_count ? ' · ' + s.respondent_count + ' respondents' : ''}</div>
              </div>
              <div style="font-size:20px;font-weight:800;color:${bandColor(avg)};min-width:40px;text-align:right;">${avg.toFixed(1)}</div>
            </div>`;
        }).join('')
      : '';

    const latestDate = latest.closed_at
      ? new Date(latest.closed_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
      : '';

    return `
      <div class="card" id="${cardId}" style="margin-top:20px;">
        <h2 style="margin-bottom:3px;">Team Cohesion — Five Behaviors</h2>
        <div style="font-size:12px;color:var(--muted);margin-bottom:18px;">
          ${locationName}${latestDate ? ' · ' + latestDate : ''}
          · Overall <strong style="color:${bandColor(overall)};">${overall.toFixed(1)} / 5.0</strong>
        </div>

        <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px;background:#F7F4F0;border-radius:10px;padding:8px;">
          ${grid}
        </div>

        ${trendHtml}

        ${historyRows ? `
        <div style="margin-top:20px;">
          <div style="font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;">History</div>
          ${historyRows}
        </div>` : ''}
      </div>`;
  }

  /* ── Fetch and inject the card(s) ── */
  async function injectCohesionCards() {
    /* Remove any cards from a previous render */
    document.querySelectorAll('[id^="fb-cohesion-"]').forEach(el => el.remove());

    const profile = window.currentProfile;
    if (!profile) return;

    /* Only show to managers and above */
    const mgr = ['location_manager', 'gm', 'production_manager', 'coo', 'ceo', 'cbo'];
    if (!mgr.includes(profile.role)) return;

    const sb = window.sb; /* Academy's existing Supabase client — same project */
    const container = document.getElementById('view-assessments');
    if (!container) return;

    let locationIds = [];

    if (['coo', 'ceo', 'cbo'].includes(profile.role)) {
      /* COO/CEO sees all locations */
      const { data: locs } = await sb.from('locations').select('id, name').order('name');
      locationIds = (locs || []).map(l => ({ id: l.id, name: l.name }));
    } else {
      /* GMs: resolve their locations from staff_locations */
      const { data: myLocs } = await sb.from('staff_locations').select('location_id').eq('staff_id', profile.id);
      if (!myLocs || !myLocs.length) return;
      const locIds = myLocs.map(l => l.location_id);
      const { data: locs } = await sb.from('locations').select('id, name').in('id', locIds);
      locationIds = (locs || []).map(l => ({ id: l.id, name: l.name }));
    }

    if (!locationIds.length) return;

    /* For each location, fetch closed assessment scores */
    for (const loc of locationIds) {
      const { data: scores, error } = await sb
        .from('assessment_scores')
        .select(`
          trust_avg, conflict_avg, commitment_avg, accountability_avg, results_avg,
          respondent_count,
          assessments!inner ( id, name, closed_at, location_id )
        `)
        .eq('assessments.location_id', loc.id)
        .order('assessments.closed_at', { ascending: true, foreignTable: 'assessments' });

      if (error) {
        console.warn('[Team Cohesion] Error fetching scores for', loc.name, error);
        continue;
      }

      const flat = (scores || []).map(s => ({
        trust_avg:          s.trust_avg,
        conflict_avg:       s.conflict_avg,
        commitment_avg:     s.commitment_avg,
        accountability_avg: s.accountability_avg,
        results_avg:        s.results_avg,
        respondent_count:   s.respondent_count,
        assessment_name:    s.assessments?.name,
        closed_at:          s.assessments?.closed_at,
      }));

      container.insertAdjacentHTML('beforeend', renderCohesionCard(flat, loc.name));
    }
  }

  /* ── Patch renderAssessmentsView ── */
  document.addEventListener('DOMContentLoaded', () => {
    const _orig = window.renderAssessmentsView;
    if (typeof _orig === 'function') {
      window.renderAssessmentsView = async function () {
        await _orig.apply(this, arguments);
        await injectCohesionCards();
      };
    }
  });

})();

</script>
<script>
/* =====================================================================
   REQUIRED TRAINING — NY Sexual Harassment Prevention (state model program)
   - Everyone: due Dec 31 each year. New hires: due 30 days after hire date.
   - Flow: policy → state video (EN/ES) → interactive check → feedback/question → e-signature.
   - Saves one row per person per year in compliance_completions. A trigger copies the date
     to staff_hr_details.harassment_training_on, which the LM page already reads.
   ===================================================================== */
const SHPT_KEY = 'ny_shpt';
const SHPT_STATE_POLICY = 'https://www.ny.gov/combating-sexual-harassment-workplace/sexual-harassment-prevention-model-policy-and-training';
const SHPT_STATE_SHEET = { en:'https://www.ny.gov/sites/default/files/2023-04/Sexual_Harassment_Prevention_Training_Answer_Sheet.pdf',
                           es:'https://www.ny.gov/sites/default/files/2026-02/NYS_Sexual_Harrassment_Prevention_Training_Answer%20Sheet_Spanish.pdf' };
const SHPT_SUP_ROLES = ['gm','location_manager','production_manager','bookkeeper','coo','ceo','cbo','product_development'];
let shpt = { loaded:false, cfg:null, rows:[], lang:'en', step:0, watched:{}, ytReady:false, players:{}, answers:{}, qIdx:0, policyOk:false, feedback:'', rating:0, question:'' };

/* ---------- due-date rule (same function lives on the LM page) ---------- */
function shptAddDays(d, n){ const x = new Date(d + 'T12:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0,10); }
function shptStatus(hireDate, lastDone, today){
  const Y = today.slice(0,4);
  if (lastDone && lastDone.slice(0,4) >= Y) return { state:'done', due:null, year:Number(lastDone.slice(0,4)) };
  let due = `${Y}-12-31`, newHire = false;
  if (hireDate) { const h30 = shptAddDays(hireDate, 30); if (h30 >= `${Y}-01-01` && hireDate >= shptAddDays(`${Y}-01-01`, -30)) { due = h30; newHire = true; } }
  const days = Math.round((new Date(due + 'T12:00:00Z') - new Date(today + 'T12:00:00Z')) / 86400000);
  return { state: days < 0 ? 'overdue' : days <= 30 ? 'soon' : 'due', due, days, newHire, year:Number(Y) };
}
function shptMine(){
  const last = (shpt.rows[0] || {}).completed_on || null;
  return shptStatus(currentProfile.hire_date, last, eToday());
}
const shptIsSup = () => SHPT_SUP_ROLES.includes(currentProfile.role) || /lead|manager|supervisor|director/i.test(currentProfile.job_title || '');

async function shptLoad(){
  const [{ data: cfg }, { data: rows }] = await Promise.all([
    sb.from('compliance_trainings').select('*').eq('key', SHPT_KEY).maybeSingle(),
    sb.from('compliance_completions').select('*').eq('staff_id', currentProfile.id).eq('training_key', SHPT_KEY).order('completed_on', { ascending:false }),
  ]);
  shpt.cfg = cfg || { title:'NY Sexual Harassment Prevention Training', videos:{ en:[{ id:'A9gudpiQ40M', label:'Training video' }], es:[{ id:'VH3T4agU8XE', label:'Video de capacitación' },{ id:'IP-i7R4SfWA', label:'Casos de estudio' }] } };
  shpt.rows = rows || [];
  const year = Number(eToday().slice(0,4));
  if (!shpt.rows.some(r => r.compliance_year === year)) {
    const { data: pr } = await sb.from('compliance_progress').select('*')
      .eq('staff_id', currentProfile.id).eq('training_key', SHPT_KEY).eq('compliance_year', year).maybeSingle();
    if (pr && !shpt.restored) {
      Object.assign(shpt, { step:pr.step || 0, lang:pr.language || shpt.lang, attested:!!pr.attested, policyOk:!!pr.policy_ok,
        answers:pr.answers || {}, qIdx:pr.q_idx || 0, feedback:pr.feedback || '', rating:pr.rating || 0, question:pr.question || '',
        resumedFrom:pr.updated_at });
      shpt.watched = Object.fromEntries(Object.entries(pr.video || {}).map(([id, v]) => [id, { secs:v.secs || 0, pct:v.pct || 0, pos:v.pos || 0, last:null }]));
    }
  }
  shpt.restored = true;
  shpt.loaded = true;
}

/* ---------- autosave: progress is saved to compliance_progress so people can pick up where they left off ---------- */
let shptSaveTimer = null, shptSaving = false;
function shptSave(soon){
  clearTimeout(shptSaveTimer);
  shptSaveTimer = setTimeout(shptSaveNow, soon ? 300 : 2500);
}
async function shptSaveNow(){
  clearTimeout(shptSaveTimer);
  if (!shpt.loaded || shptSaving) return;
  const year = Number(eToday().slice(0,4));
  if (shpt.rows.some(r => r.compliance_year === year)) return;
  shptSaving = true;
  const video = Object.fromEntries(Object.entries(shpt.watched).map(([id, w]) => [id, { secs:Math.round(w.secs || 0), pct:Math.round(w.pct || 0), pos:Math.floor(w.pos || 0), dur:Math.round(w.dur || 0) }]));
  const { error } = await sb.from('compliance_progress').upsert({
    staff_id: currentProfile.id, training_key: SHPT_KEY, compliance_year: year,
    step: shpt.step, language: shpt.lang, video, attested: !!shpt.attested, policy_ok: !!shpt.policyOk,
    answers: shpt.answers, q_idx: shpt.qIdx, feedback: shpt.feedback || null, rating: shpt.rating || null, question: shpt.question || null,
  }, { onConflict:'staff_id,training_key,compliance_year' });
  shptSaving = false;
  const el = document.getElementById('shpt-saved');
  if (el) el.textContent = error ? "Couldn't save your progress just now. We'll keep trying." : `Progress saved ${new Date().toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' })}`;
}
// save when the tab is hidden or closed (phone locks, app switch, browser closed)
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && empTab === 'compliance') shptSaveNow(); });
window.addEventListener('pagehide', () => { if (empTab === 'compliance') shptSaveNow(); });

/* ---------- interactive questions (original Salt City scenarios covering the state minimum standards) ---------- */

const shptQuestions = () => SHPT_Q.filter(q => !q.sup || true); // everyone sees supervisor scenarios; NY requires the topic be covered

/* ---------- Overview card + badge ---------- */
function shptOverviewCard(){
  if (!shpt.loaded) return '';
  const s = shptMine();
  if (s.state === 'done') return '';
  const cls = s.state === 'overdue' ? 'red' : s.state === 'soon' ? 'amber' : 'muted';
  return `
    <div class="card l360-card" style="border-left-color:var(--care-700);">
      <div><div class="emp-label" style="color:var(--care-700);">Required training · NY State</div>
        <div class="l360-title">Sexual Harassment Prevention ${s.year}</div>
        <div class="emp-note"><span class="emp-pill ${cls}">${s.state === 'overdue' ? `Overdue since ${eFmt(s.due)}` : `Due ${eFmt(s.due)}`}</span>
          ${s.newHire ? ' New team members complete it within 30 days of starting.' : ' Everyone completes it once a year.'} About 45–60 minutes. English or Spanish.</div></div>
      <button class="emp-btn" onclick="empSwitch('compliance')">${(shpt.step > 0 || Object.keys(shpt.watched).length) ? 'Continue training →' : 'Start training →'}</button>
    </div>`;
}
function shptBadge(){ if (!shpt.loaded) return ''; return shptMine().state === 'done' ? '' : '!'; }

/* ---------- the tab ---------- */
function empCompliance(){
  if (!shpt.loaded) return `<div class="card"><div class="emp-empty">Loading…</div></div>`;
  if (supv.open) return supvView();
  const s = shptMine();
  const cur = shpt.rows.find(r => r.compliance_year === s.year);
  const head = `
    <div class="shpt-head">
      <div><div class="emp-label" style="color:var(--care-700);">${st('yearly')}</div>
      <h2 class="shpt-title">${st('title')} · ${s.year}</h2></div>
      <div class="shpt-lang">${['en','es'].map(l => `<button class="${shpt.lang===l?'active':''}" onclick="shptLang('${l}')">${l==='en'?'English':'Español'}</button>`).join('')}</div>
    </div>`;
  if (cur) return head + shptDoneHtml(cur, s) + supvCard() + shptHistory();
  const steps = st('steps');
  return head + `
    <div class="shpt-steps">${steps.map((n,i) => `<div class="${i===shpt.step?'on':''} ${i<shpt.step?'past':''}"><span>${i+1}</span>${n}</div>`).join('')}</div>
    ${shpt.resumedFrom ? `<div class="emp-disclaimer" style="margin:0 0 12px;">${shpt.lang==='es' ? 'Bienvenido de nuevo. Continúa donde lo dejaste' : 'Welcome back. You\'re picking up where you left off'} (${steps[shpt.step]}${shptVideoPctText()}).</div>` : ''}
    <div class="card shpt-body" id="shpt-body">${shptStepHtml(s)}</div>
    <div class="emp-note" id="shpt-saved" style="text-align:right; margin:-12px 4px 16px;">${shpt.lang==='es' ? 'Su progreso se guarda automáticamente.' : 'Your progress saves automatically.'}</div>` + supvCard() + shptHistory();
}
function shptVideoPctText(){
  const vids = ((shpt.cfg||{}).videos || {})[shpt.lang] || [];
  if (shpt.step !== 2 || !vids.length) return '';
  const pct = Math.round(vids.reduce((a, v) => a + Math.min(100, (shpt.watched[v.id] || {}).pct || 0), 0) / vids.length);
  return `, ${pct}% ${st('watched')}`;
}
function shptHistory(){
  if (!shpt.rows.length) return '';
  return `<div class="card"><h2>${st('history')}</h2><table class="emp-table"><tr><th>Year</th><th>Completed</th><th>How</th></tr>
    ${shpt.rows.map(r => `<tr><td>${r.compliance_year}</td><td>${eFmt(r.completed_on)}</td><td>${st('method')[r.method] || r.method}${r.language ? ` · ${r.language.toUpperCase()}` : ''}</td></tr>`).join('')}</table></div>`;
}
function shptDoneHtml(r, s){
  return `
    <div class="card shpt-done">
      <div class="shpt-check">✓</div>
      <div style="flex:1;"><div class="q">${st('doneH')}</div>
        <div class="emp-note">${st('doneFor')(r.compliance_year)} ${eFmt(r.completed_on)}${r.signature_name ? ` · ${shpt.lang==='es'?'firmado':'signed'} “${escapeHtml(r.signature_name)}”` : ''}. ${st('nextDue')(r.compliance_year + 1)}</div>
        ${r.employee_question ? `<div class="emp-disclaimer"><b>${escapeHtml(r.employee_question)}</b><br>${r.question_answer ? `${st('answer')}: ${escapeHtml(r.question_answer)}` : st('waiting')}</div>` : ''}
      </div>
      ${r.method === 'in_app' ? `<button class="emp-btn ghost" onclick="shptPrintCert('${r.id}')">${st('cert')}</button>` : ''}
    </div>`;
}

function shptStepHtml(s){
  const nav = (canNext, nextFn='shptGo(1)') => `<div class="shpt-nav">${shpt.step ? `<button class="emp-btn ghost" onclick="shptGo(-1)">${st('back')}</button>` : '<span></span>'}
      <button class="emp-btn" id="shpt-next" ${canNext ? '' : 'disabled'} onclick="${nextFn}">${st('next')}</button></div>`;
  const cfg = shpt.cfg;
  switch (shpt.step) {
  case 0: return `
      <p class="shpt-p">${st('introA')}</p><p class="shpt-p">${st('introB')}</p>
      <div class="emp-note" style="margin-top:6px;">${s.state === 'overdue' ? `<span class="emp-pill red">Overdue since ${eFmt(s.due)}</span>` : `<span class="emp-pill amber">Due ${eFmt(s.due)}</span>`}</div>
      ${nav(true)}`;
  case 1: return `
      <div class="q">${st('policyH')}</div>
      <button class="emp-btn" style="margin:10px 0 4px;" onclick="docsOpen('harassment_policy')">${st('policyRead')} ↗</button>
      <div class="emp-note">${st('policyWhere')}</div>
      <div class="emp-sub">${st('reportH')}</div>
      <ul class="shpt-list">${st('reportList').map((li,i) => `<li>${li}${i===1 ? ` <a href="#" onclick="empSwitch('docs'); docsGo('complaint'); return false;">${st('complaint')} →</a>` : ''}</li>`).join('')}</ul>
      <label class="shpt-ack"><input type="checkbox" ${shpt.policyOk?'checked':''} onchange="shpt.policyOk=this.checked; shptSave(true); document.getElementById('shpt-next').disabled=!this.checked;"> ${st('policyAck')}</label>
      ${nav(shpt.policyOk)}`;
  case 2: {
    const vids = (cfg.videos || {})[shpt.lang] || [];
    return `
      <div class="q">${st('videoH')}</div><div class="emp-note" style="margin-bottom:12px;">${st('videoNote')}</div>
      ${vids.map(v => `<div class="emp-sub">${escapeHtml(v.label)} <span class="shpt-pct" id="shpt-pct-${v.id}">${Math.round((shpt.watched[v.id]||{}).pct||0)}% ${st('watched')}</span></div>
        <div class="shpt-video"><div id="shpt-yt-${v.id}"></div></div>`).join('')}
      <div id="shpt-fallback" style="display:none;" class="emp-disclaimer">${st('videoFallback')}<br>
        <label class="shpt-ack"><input type="checkbox" id="shpt-attest" onchange="shptCheckVideo()"> ${st('videoAttest')}</label></div>
      ${nav(shptVideosDone())}`;
  }
  case 3: {
    const qs = shptQuestions(), i = Math.min(shpt.qIdx, qs.length - 1), q = qs[i], a = shpt.answers[q.id] || { tries:[] };
    const solved = a.tries.includes(q.a), last = a.tries[a.tries.length - 1];
    const allDone = qs.every(x => (shpt.answers[x.id]||{tries:[]}).tries.includes(x.a));
    return `
      <div class="emp-note">${st('checkNote')}</div>
      <div class="emp-sub">${st('qOf')(i+1, qs.length)}${q.sup ? ` · <span class="emp-pill amber">${st('supTag')}</span>` : ''}</div>
      <div class="q" style="font-size:18px; margin-bottom:12px;">${q.q[shpt.lang]}</div>
      <div class="shpt-opts">${q.o.map((o,k) => `<button class="shpt-opt ${a.tries.includes(k) ? (k===q.a?'right':'wrong') : ''}" ${solved?'disabled':''} onclick="shptPick('${q.id}',${k})">${o[shpt.lang]}</button>`).join('')}</div>
      ${last != null ? `<div class="shpt-fb ${last===q.a?'right':'wrong'}"><b>${last===q.a?st('right'):st('wrong')}</b> ${last===q.a ? q.x[shpt.lang] : ''}</div>` : ''}
      <div class="shpt-nav"><button class="emp-btn ghost" onclick="${i ? 'shptQ(-1)' : 'shptGo(-1)'}">${st('back')}</button>
        <button class="emp-btn" ${solved ? '' : 'disabled'} onclick="${i < qs.length-1 ? 'shptQ(1)' : (allDone ? 'shptGo(1)' : 'shptQ(1)')}">${st('next')}</button></div>`;
  }
  case 4: return `
      <div class="q">${st('fbH')}</div>
      <div class="emp-form">
        <label>${st('fbRate')}</label>
        <div class="shpt-rate">${[1,2,3,4,5].map(n => `<button class="${shpt.rating===n?'on':''}" onclick="shpt.rating=${n}; shptSave(true); shptRerender()">${n}</button>`).join('')}</div>
        <label>${st('fbText')}</label><textarea id="shpt-fb" rows="3" oninput="shpt.feedback=this.value; shptSave()">${escapeHtml(shpt.feedback)}</textarea>
        <label>${st('askText')}</label><textarea id="shpt-ask" rows="3" oninput="shpt.question=this.value; shptSave()">${escapeHtml(shpt.question)}</textarea>
        <div class="emp-note">${st('askNote')}</div>
      </div>
      ${nav(true)}`;
  case 5: return `
      <div class="q">${st('signH')}</div>
      <p class="shpt-p" style="margin-top:8px;">${st('signText')()}</p>
      <div class="emp-form">
        <label>${st('signName')}</label><input id="shpt-sig" autocomplete="name" placeholder="${escapeHtml(currentProfile.name)}" oninput="document.getElementById('shpt-submit').disabled = this.value.trim().length < 3">
        <label>${st('signDate')}</label><input value="${eFmt(eToday())}" disabled>
      </div>
      <div class="emp-note" id="shpt-err" style="color:var(--red); margin-top:8px;"></div>
      <div class="shpt-nav"><button class="emp-btn ghost" onclick="shptGo(-1)">${st('back')}</button>
        <button class="emp-btn" id="shpt-submit" disabled onclick="shptSubmit()">${st('submit')}</button></div>`;
  }
  return '';
}

/* ---------- navigation ---------- */
function shptRerender(){ const b = document.getElementById('shpt-body'); if (!b) return empRender(); b.innerHTML = shptStepHtml(shptMine()); shptAfter(); }
function shptGo(d){ shpt.step = Math.max(0, Math.min(5, shpt.step + d)); shpt.resumedFrom = null; shptSave(true); empRender(); window.scrollTo({ top:0, behavior:'smooth' }); }
function shptQ(d){ const n = shptQuestions().length; shpt.qIdx = Math.max(0, Math.min(n - 1, shpt.qIdx + d)); shptSave(true); shptRerender(); }
function shptLang(l){ shpt.lang = l; shptSave(true); empRender(); }
function shptPick(id, k){ const a = shpt.answers[id] || (shpt.answers[id] = { tries:[] }); if (!a.tries.includes(k)) a.tries.push(k); shptSave(true); shptRerender(); }
Object.assign(window, { shptGo, shptQ, shptLang, shptPick, shptRerender, shptSubmit, shptPrintCert, shptCheckVideo, shptSave });

/* ---------- video progress (YouTube IFrame API; falls back to an attestation) ---------- */
function shptVideosDone(){
  const vids = ((shpt.cfg||{}).videos || {})[shpt.lang] || [];
  const att = document.getElementById('shpt-attest');
  return (att && att.checked) || shpt.attested || (vids.length && vids.every(v => (shpt.watched[v.id]||{}).pct >= 90));
}
function shptCheckVideo(){ const att = document.getElementById('shpt-attest'); if (att) shpt.attested = att.checked; shptSave(true); const n = document.getElementById('shpt-next'); if (n) n.disabled = !shptVideosDone(); }
function shptAfter(){
  if (empTab !== 'compliance' || shpt.step !== 2) return;
  const vids = ((shpt.cfg||{}).videos || {})[shpt.lang] || [];
  const mount = () => vids.forEach(v => {
    const el = document.getElementById('shpt-yt-' + v.id); if (!el) return;
    const w = shpt.watched[v.id] || (shpt.watched[v.id] = { secs:0, pct:0, pos:0, last:null });
    w.last = null;
    const resumeAt = w.pct < 100 && w.pos > 5 ? Math.max(0, Math.floor(w.pos) - 3) : 0;   // back up 3 seconds for context
    const p = new YT.Player(el, { videoId:v.id, host:'https://www.youtube-nocookie.com', playerVars:{ rel:0, modestbranding:1, hl:shpt.lang, start:resumeAt },
      events:{ onStateChange: e => {
        if (e.data === YT.PlayerState.ENDED) { w.pct = 100; w.pos = 0; shptPaint(v.id); shptSave(true); }
        if (e.data === YT.PlayerState.PAUSED) { w.pos = p.getCurrentTime(); shptSave(true); }
      } } });
    clearInterval(w.timer);
    w.timer = setInterval(() => {
      if (!document.body.contains(p.getIframe && p.getIframe())) return clearInterval(w.timer);
      if (!p.getPlayerState || p.getPlayerState() !== 1) { w.last = null; return; }
      const t = p.getCurrentTime(), dur = p.getDuration();
      if (w.last != null && t > w.last && t - w.last < 3) w.secs += t - w.last;   // only count real playback, not skipping ahead
      w.last = t; w.pos = t; if (dur) w.dur = dur;
      if (dur) { w.pct = Math.max(w.pct, Math.min(100, (w.secs / dur) * 100)); shptPaint(v.id); }
      w.tick = (w.tick || 0) + 1; if (w.tick % 15 === 0) shptSaveNow();   // every ~15 seconds of playback
    }, 1000);
  });
  if (window.YT && YT.Player) return mount();
  window.onYouTubeIframeAPIReady = mount;
  if (!document.getElementById('yt-api')) { const s = document.createElement('script'); s.id = 'yt-api'; s.src = 'https://www.youtube.com/iframe_api'; s.onerror = shptFallback; document.head.appendChild(s); }
  setTimeout(() => { if (!(window.YT && YT.Player)) shptFallback(); }, 8000);
}
function shptFallback(){
  const vids = ((shpt.cfg||{}).videos || {})[shpt.lang] || [];
  vids.forEach(v => { const el = document.getElementById('shpt-yt-' + v.id); if (el && el.tagName !== 'IFRAME') { const w = shpt.watched[v.id] || {}; const st0 = w.pct < 100 && w.pos > 5 ? Math.floor(w.pos) - 3 : 0; el.outerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${v.id}?rel=0${st0 ? `&start=${st0}` : ''}" allowfullscreen></iframe>`; } });
  const f = document.getElementById('shpt-fallback'); if (f) f.style.display = 'block';
}
function shptPaint(id){
  const el = document.getElementById('shpt-pct-' + id); if (el) el.textContent = `${Math.round(shpt.watched[id].pct)}% ${st('watched')}`;
  const n = document.getElementById('shpt-next'); if (n) n.disabled = !shptVideosDone();
}

/* ---------- submit ---------- */
async function shptSubmit(){
  const btn = document.getElementById('shpt-submit'), err = document.getElementById('shpt-err');
  const sig = document.getElementById('shpt-sig').value.trim();
  btn.disabled = true; btn.textContent = st('saving'); err.textContent = '';
  const qs = shptQuestions();
  const answers = Object.fromEntries(qs.map(q => [q.id, (shpt.answers[q.id] || { tries:[] }).tries]));
  const firstTry = qs.filter(q => (answers[q.id] || [])[0] === q.a).length;
  const vids = ((shpt.cfg||{}).videos || {})[shpt.lang] || [];
  const row = {
    staff_id: currentProfile.id, training_key: SHPT_KEY, compliance_year: Number(eToday().slice(0,4)), completed_on: eToday(),
    method:'in_app', language: shpt.lang, answers, first_try_correct: firstTry, question_count: qs.length,
    video_seconds: Math.round(vids.reduce((a,v) => a + ((shpt.watched[v.id]||{}).secs || 0), 0)),
    policy_acknowledged: shpt.policyOk, signature_name: sig, is_supervisor: shptIsSup(),
    feedback: [shpt.rating ? `Rating ${shpt.rating}/5` : '', shpt.feedback.trim()].filter(Boolean).join(' · ') || null,
    employee_question: shpt.question.trim() || null,
    notes: shpt.attested ? 'Video completion self-attested (player could not track progress)' : null,
  };
  const { error } = await sb.from('compliance_completions').insert(row);
  if (error) { btn.disabled = false; btn.textContent = st('submit'); err.textContent = `Couldn't save: ${error.message}`; return; }
  await sb.from('compliance_progress').delete().eq('staff_id', currentProfile.id).eq('training_key', SHPT_KEY).eq('compliance_year', row.compliance_year);
  await shptLoad();
  shpt.step = 0; shpt.answers = {}; shpt.qIdx = 0; shpt.watched = {};
  empBadges(); empRender(); window.scrollTo({ top:0, behavior:'smooth' });
}

/* ---------- certificate ---------- */
function shptPrintCert(id){
  const r = shpt.rows.find(x => x.id === id); if (!r) return;
  const w = window.open('', '_blank');
  w.document.write(`<!DOCTYPE html><html><head><title>Certificate</title><style>
    body{font-family:Georgia,serif;margin:0;padding:60px;color:#241A12;}
    .c{border:6px double #1B365D;padding:56px;text-align:center;max-width:820px;margin:0 auto;}
    h1{font-size:30px;color:#1B365D;letter-spacing:2px;margin:0 0 6px;} .s{color:#7A6A57;font-size:14px;letter-spacing:3px;text-transform:uppercase;}
    .n{font-size:34px;margin:36px 0 8px;border-bottom:1px solid #ccc;display:inline-block;padding:0 40px 6px;} p{font-size:15px;line-height:1.6;}
    .f{display:flex;justify-content:space-between;margin-top:48px;font-size:13px;color:#4A3B2E;text-align:left;}
    @media print{body{padding:0}}</style></head><body><div class="c">
    <div class="s">Salt City Coffee</div><h1>${st('certTitle')}</h1>
    <div class="n">${escapeHtml(currentProfile.name)}</div>
    <p>completed New York State Sexual Harassment Prevention Training (state model program, ${r.language === 'es' ? 'Spanish' : 'English'}),<br>
    including the policy, the training video and interactive case-study questions, for calendar year ${r.compliance_year}.</p>
    <div class="f"><div>Completed: <b>${eFmt(r.completed_on)}</b><br>Signed: <b>${escapeHtml(r.signature_name || '')}</b></div>
    <div>Record ID: ${r.id.slice(0,8)}<br>NY Labor Law §201-g</div></div></div>
    <script>setTimeout(()=>window.print(),300)<\/script></body></html>`);
  w.document.close();
}
</script>

<script>
/* =====================================================================
   DOCUMENTS & FORMS (employee profile)
   - Company documents from company_documents (PDFs in the private "company-docs" bucket)
   - Handbook acknowledgment with typed-name signature (document_acknowledgments)
   - Digital Sexual Harassment / Discrimination complaint form (harassment_complaints),
     modeled on the complaint form in the 2025 Employee Handbook (NYS model form).
     Routed only to the people the employee picks (GM / Owners, optionally their LM);
     the person it's about can never see it.
   ===================================================================== */
const DOCS_FULL = ['production_manager','coo','ceo','cbo'];
const DOCS_LEADER_ROLES = ['gm','coo','ceo','cbo'];
const HC_STATUS = { new:['Received','amber'], reviewing:['Under review','amber'], investigating:['Being investigated','amber'], resolved:['Resolved','green'], closed:['Closed','muted'] };
let docs = { loaded:false, list:[], acks:[], complaints:[], leaders:[], lms:[], staff:[], view:'home', err:'' };

async function docsLoad(){
  const me = currentProfile.id;
  const [{ data: list }, { data: acks }, { data: complaints }, { data: staff }, { data: myLocs }] = await Promise.all([
    sb.from('company_documents').select('*').eq('is_active', true).order('sort'),
    sb.from('document_acknowledgments').select('*').eq('staff_id', me),
    sb.from('harassment_complaints').select('id,created_at,subject_name,complaint_type,status,recipient_ids,resolution_summary,resolved_at,on_behalf_of').eq('filed_by', me).order('created_at', { ascending:false }),
    sb.from('staff').select('id,name,role,job_title,is_active').neq('is_active', false).order('name'),
    sb.from('staff_locations').select('location_id').eq('staff_id', me),
  ]);
  docs.list = list || []; docs.acks = acks || []; docs.complaints = complaints || []; docs.staff = staff || [];
  docs.leaders = docs.staff.filter(s => DOCS_LEADER_ROLES.includes(s.role));
  const locIds = (myLocs || []).map(l => l.location_id);
  docs.lms = [];
  if (locIds.length) {
    const { data: sl } = await sb.from('staff_locations').select('staff_id').in('location_id', locIds);
    const ids = new Set((sl || []).map(r => r.staff_id));
    docs.lms = docs.staff.filter(s => s.role === 'location_manager' && ids.has(s.id) && s.id !== me);
  }
  docs.loaded = true;
}
const docsNeedsAck = () => docs.loaded && docs.list.some(d => d.requires_ack && !docs.acks.some(a => a.doc_key === d.key && a.doc_version === d.version));
function docsBadge(){ return docsNeedsAck() ? '!' : ''; }

/* Open a company document (signed link, valid 1 hour). Falls back to the state's model policy for the harassment policy. */
async function docsOpen(key){
  const d = docs.list.find(x => x.key === key);
  const w = window.open('', '_blank');
  if (d && d.storage_path) {
    const { data, error } = await sb.storage.from('company-docs').createSignedUrl(d.storage_path, 3600);
    if (!error && data) { w.location = data.signedUrl + (d.policy_page ? `#page=${d.policy_page}` : ''); return; }
  }
  w.close();
  if (DOCS_FULL.includes(currentProfile.role)) {
    if (confirm(`The ${d ? d.title : 'document'} PDF hasn't been uploaded yet.\n\nGo to Documents & Forms now to upload it with "Replace PDF"?`)) { empSwitch('docs'); docsGo('home'); }
    return;
  }
  if (key === 'harassment_policy' && confirm("Salt City's policy PDF isn't available right now. Your manager can give you a copy.\n\nOpen New York State's model policy (which ours is based on) instead?")) { window.open(SHPT_STATE_POLICY, '_blank'); return; }
  if (key !== 'harassment_policy') alert("This document hasn't been uploaded yet. Ask your manager for a copy.");
}

/* ---------- Overview card ---------- */
function docsOverviewCard(){
  if (!docsNeedsAck()) return '';
  return `<div class="card l360-card" style="border-left-color:var(--lead-700);">
    <div><div class="emp-label" style="color:var(--lead-700);">Documents</div>
      <div class="l360-title">Sign for the Employee Handbook</div>
      <div class="emp-note">Read the handbook, then sign to confirm you received it. It takes one minute to sign.</div></div>
    <button class="emp-btn" onclick="empSwitch('docs')">Open documents →</button></div>`;
}

/* ---------- the tab ---------- */
function empDocs(){
  if (!docs.loaded) return `<div class="card"><div class="emp-empty">Loading…</div></div>`;
  if (docs.view === 'complaint') return docsComplaintForm();
  if (docs.view === 'sent') return docsComplaintSent();
  if (docs.view.startsWith('ack:')) return docsAckForm(docs.view.slice(4));
  const sh = shpt.loaded ? shptMine() : null;
  const full = DOCS_FULL.includes(currentProfile.role);
  return `
    <div class="card">
      <h2>Company documents</h2>
      ${docs.list.map(d => {
        const ack = docs.acks.find(a => a.doc_key === d.key && a.doc_version === d.version);
        return `<div class="docs-row">
          <div class="docs-icon">PDF</div>
          <div style="flex:1;"><div class="q" style="font-size:16px;">${escapeHtml(d.title)} <span class="emp-note">· ${escapeHtml(d.version)}${d.policy_page ? ` · starts on page ${d.policy_page}` : ''}</span></div>
            ${d.requires_ack ? (ack ? `<span class="emp-pill green">Signed ${eFmt(ack.signed_at)}</span>` : `<span class="emp-pill amber">Signature needed</span>`) : ''}</div>
          <button class="emp-btn ghost" onclick="docsOpen('${d.key}')">Open</button>
          ${d.requires_ack && !ack ? `<button class="emp-btn" style="margin-top:0;" onclick="docsGo('ack:${d.key}')">Sign</button>` : ''}
          ${full && d.storage_path ? `<label class="emp-btn ghost docs-up" title="Upload a new PDF for this document">Replace PDF<input type="file" accept="application/pdf" onchange="docsUpload('${d.key}', this)"></label>` : ''}
        </div>`; }).join('') || '<div class="emp-empty">No documents yet.</div>'}
      ${sh ? `<div class="docs-row"><div class="docs-icon" style="background:var(--care-700);">NY</div>
          <div style="flex:1;"><div class="q" style="font-size:16px;">Sexual Harassment Prevention Training · ${sh.year}</div>
          ${sh.state === 'done' ? '<span class="emp-pill green">Done</span>' : `<span class="emp-pill ${sh.state==='overdue'?'red':'amber'}">${sh.state==='overdue'?'Overdue since':'Due'} ${eFmt(sh.due)}</span>`}</div>
          <button class="emp-btn ghost" onclick="empSwitch('compliance')">Open</button></div>` : ''}
      <div class="emp-note" id="docs-msg" style="margin-top:8px;"></div>
    </div>

    <div class="card docs-report">
      <h2>Report harassment or discrimination</h2>
      <p class="shpt-p">If you've experienced or seen sexual harassment, discrimination or retaliation at work, you can report it here. It goes privately to the leaders you choose, and never to the person it's about. You won't be retaliated against for reporting.</p>
      <button class="emp-btn" onclick="docsGo('complaint')">Start a report →</button>
      <div class="emp-disclaimer">You don't have to use this form. You can also tell any manager, the General Manager or an Owner in person or by email. Outside the company: <a href="https://dhr.ny.gov/complaint" target="_blank" rel="noopener">NYS Division of Human Rights ↗</a> (3 years to file), the <a href="https://www.eeoc.gov/filing-charge-discrimination" target="_blank" rel="noopener">U.S. EEOC ↗</a> (300 days), or the NY Sexual Harassment Hotline <b>1-800-HARASS-3</b> (free, confidential legal help). Call 911 if you're in danger.</div>
      ${docs.complaints.length ? `<div class="emp-sub">My reports</div>
        <table class="emp-table"><tr><th>Sent</th><th>About</th><th>Status</th></tr>
        ${docs.complaints.map(c => { const [l, cls] = HC_STATUS[c.status] || [c.status,'muted']; return `<tr><td>${eFmt(c.created_at)}</td><td>${escapeHtml(c.subject_name)}${c.on_behalf_of ? ` <span class="emp-note">(for ${escapeHtml(c.on_behalf_of)})</span>` : ''}</td>
          <td><span class="emp-pill ${cls}">${l}</span>${c.resolution_summary ? `<div class="emp-note" style="margin-top:4px;">${escapeHtml(c.resolution_summary)}</div>` : ''}</td></tr>`; }).join('')}</table>` : ''}
    </div>`;
}
function docsGo(v){ docs.view = v; docs.err = ''; empRender(); window.scrollTo({ top:0, behavior:'smooth' }); }

/* ---------- acknowledgment ---------- */
function docsAckForm(key){
  const d = docs.list.find(x => x.key === key); if (!d) return '';
  return `<div class="card">
    <div class="emp-label">${escapeHtml(d.title)} · ${escapeHtml(d.version)}</div>
    <div class="q" style="margin:4px 0 10px;">Receipt acknowledgment</div>
    <button class="emp-btn ghost" onclick="docsOpen('${d.key}')">Open the ${escapeHtml(d.title.toLowerCase())} ↗</button>
    <p class="shpt-p" style="margin-top:14px;">${escapeHtml(d.ack_text || 'I acknowledge receipt of this document.')}</p>
    <div class="emp-form"><label>Type your full name to sign</label><input id="docs-sig" placeholder="${escapeHtml(currentProfile.name)}" oninput="document.getElementById('docs-sign').disabled = this.value.trim().length < 3">
      <label>Date</label><input value="${eFmt(eToday())}" disabled></div>
    <div class="emp-note" style="color:var(--red); margin-top:8px;">${escapeHtml(docs.err)}</div>
    <div class="shpt-nav"><button class="emp-btn ghost" onclick="docsGo('home')">← Back</button><button class="emp-btn" id="docs-sign" disabled onclick="docsSign('${d.key}')">Sign</button></div>
  </div>`;
}
async function docsSign(key){
  const d = docs.list.find(x => x.key === key), sig = document.getElementById('docs-sig').value.trim();
  const { error } = await sb.from('document_acknowledgments').insert({ staff_id: currentProfile.id, doc_key: key, doc_version: d.version, signature_name: sig });
  if (error) { docs.err = `Couldn't save: ${error.message}`; return empRender(); }
  await docsLoad(); empBadges(); docsGo('home');
}
async function docsUpload(key, input){
  const d = docs.list.find(x => x.key === key), f = input.files[0], msg = document.getElementById('docs-msg');
  if (!f) return;
  if (!confirm(`Replace the PDF for "${d.title}" with ${f.name}? Everyone will see the new file.`)) { input.value = ''; return; }
  msg.textContent = 'Uploading…';
  const { error } = await sb.storage.from('company-docs').upload(d.storage_path, f, { upsert:true, contentType:'application/pdf' });
  msg.textContent = error ? `Upload failed: ${error.message}` : `Uploaded. (Changing the version so people re-sign is done in Supabase: company_documents.version.)`;
  input.value = '';
}

/* ---------- complaint form ---------- */
function docsComplaintForm(){
  const p = currentProfile;
  const leaders = docs.leaders.filter(s => s.id !== p.id);
  const person = s => `<label class="docs-check"><input type="checkbox" name="hc-to" value="${s.id}" ${DOCS_LEADER_ROLES.includes(s.role) ? 'checked' : ''}> <span><b>${escapeHtml(s.name)}</b> <span class="emp-note">${escapeHtml(s.job_title || s.role)}</span></span></label>`;
  return `<div class="card emp-form docs-form">
    <div class="emp-label" style="color:var(--care-700);">Private · Sexual Harassment &amp; Discrimination Complaint</div>
    <div class="q" style="margin:4px 0 6px;">Report harassment or discrimination</div>
    <p class="emp-note">New York requires every employer to provide this form. Fill in what you can; only the starred fields are required. You can stop and talk to someone in person instead at any time.</p>

    <div class="emp-sub">1 · Who should receive this?</div>
    <div class="emp-note">Uncheck anyone you don't want to see it. At least one General Manager or Owner must be checked.</div>
    <div class="docs-checks">${leaders.map(person).join('')}${docs.lms.map(person).join('')}</div>

    <div class="emp-sub">2 · About you</div>
    <div class="docs-grid">
      <div><label>Name *</label><input id="hc-name" value="${escapeHtml(p.name)}"></div>
      <div><label>Job title</label><input id="hc-title" value="${escapeHtml(p.job_title || '')}"></div>
      <div><label>Cafe / work location</label><input id="hc-loc"></div>
      <div><label>Phone</label><input id="hc-phone" type="tel"></div>
      <div><label>Email</label><input id="hc-email" type="email"></div>
      <div><label>Best way to reach you</label><select id="hc-pref"><option value="">Choose…</option><option value="email">Email</option><option value="phone">Phone</option><option value="in_person">In person</option></select></div>
      <div><label>Your immediate supervisor</label><input id="hc-sup"></div>
      <div><label>Their title</label><input id="hc-sup-title"></div>
    </div>
    <label class="docs-check" style="margin-top:10px;"><input type="checkbox" id="hc-behalf-on" onchange="document.getElementById('hc-behalf-wrap').style.display=this.checked?'block':'none'"> <span>I'm reporting this on behalf of someone else</span></label>
    <div id="hc-behalf-wrap" style="display:none;"><label>Their name</label><input id="hc-behalf"></div>

    <div class="emp-sub">3 · Who is this about?</div>
    <div class="docs-grid">
      <div><label>Name *</label><input id="hc-subj" list="hc-staff" placeholder="Start typing, or describe the person" oninput="docsSubjChanged(this.value)"><datalist id="hc-staff">${docs.staff.filter(s => s.id !== p.id).map(s => `<option value="${escapeHtml(s.name)}">`).join('')}</datalist></div>
      <div><label>Their title</label><input id="hc-subj-title"></div>
      <div><label>Where they work</label><input id="hc-subj-loc"></div>
      <div><label>Relationship to you</label><select id="hc-rel"><option value="">Choose…</option><option value="supervisor">Supervisor</option><option value="subordinate">Someone I supervise</option><option value="coworker">Co-worker</option><option value="customer">Customer</option><option value="vendor">Vendor / delivery</option><option value="other">Other</option></select></div>
      <div><label>Type of complaint</label><select id="hc-type"><option value="sexual_harassment">Sexual harassment</option><option value="discrimination">Discrimination</option><option value="retaliation">Retaliation</option><option value="other">Other</option></select></div>
    </div>

    <div class="emp-sub">4 · What happened</div>
    <label>Describe what happened and how it is affecting you and your work *</label><textarea id="hc-desc" rows="7"></textarea>
    <div class="docs-grid">
      <div><label>Date(s) it happened</label><input id="hc-dates" placeholder="e.g. Oct 3, Oct 10, ongoing since September"></div>
      <div><label>Is it still happening?</label><select id="hc-cont"><option value="">Choose…</option><option value="yes">Yes</option><option value="no">No</option></select></div>
    </div>
    <label>Witnesses, or anyone who may have information (names and how to reach them)</label><textarea id="hc-wit" rows="3"></textarea>
    <label>Have you complained or given information about related incidents before? If yes, when and to whom? (optional)</label><textarea id="hc-prior" rows="2"></textarea>
    <label>If you have a lawyer and want us to work with them, their contact information (optional)</label><input id="hc-counsel">
    <div class="emp-note" style="margin-top:6px;">Have screenshots or documents? Mention them here and bring or email them to the person handling your report.</div>

    <div class="emp-sub">5 · Sign</div>
    <label>Type your full name *</label><input id="hc-sig" placeholder="${escapeHtml(p.name)}">
    <div class="emp-note" style="margin-top:8px;">Retaliation against anyone who reports harassment or helps an investigation is against the law and Salt City policy.</div>
    <div class="emp-note" id="hc-err" style="color:var(--red); margin-top:8px;">${escapeHtml(docs.err)}</div>
    <div class="shpt-nav"><button class="emp-btn ghost" onclick="docsGo('home')">Cancel</button><button class="emp-btn" id="hc-send" onclick="docsSendComplaint()">Send privately</button></div>
  </div>`;
}
async function docsSendComplaint(){
  const v = id => (document.getElementById(id)?.value || '').trim();
  const err = document.getElementById('hc-err'), btn = document.getElementById('hc-send');
  const to = [...document.querySelectorAll('input[name="hc-to"]:checked')].map(i => i.value);
  const missing = [];
  if (!v('hc-name')) missing.push('your name');
  if (!v('hc-subj')) missing.push('who it is about');
  if (!v('hc-desc')) missing.push('what happened');
  if (v('hc-sig').length < 3) missing.push('your signature');
  if (!to.some(id => DOCS_LEADER_ROLES.includes((docs.staff.find(s => s.id === id) || {}).role))) missing.push('at least one General Manager or Owner to receive it');
  if (missing.length) { err.textContent = 'Please add: ' + missing.join(', ') + '.'; return; }
  const subj = docs.staff.find(s => s.name.toLowerCase() === v('hc-subj').toLowerCase());
  btn.disabled = true; btn.textContent = 'Sending…'; err.textContent = '';
  const row = {
    source:'employee', filed_by: currentProfile.id,
    complainant_name: v('hc-name'), complainant_title: v('hc-title') || null, complainant_location: v('hc-loc') || null,
    complainant_phone: v('hc-phone') || null, complainant_email: v('hc-email') || null, preferred_contact: v('hc-pref') || null,
    on_behalf_of: document.getElementById('hc-behalf-on').checked ? (v('hc-behalf') || 'Someone else') : null,
    supervisor_name: v('hc-sup') || null, supervisor_title: v('hc-sup-title') || null,
    subject_staff_id: subj ? subj.id : null, subject_name: v('hc-subj'), subject_title: v('hc-subj-title') || null, subject_location: v('hc-subj-loc') || null,
    subject_relationship: v('hc-rel') || null, complaint_type: v('hc-type'),
    description: v('hc-desc'), incident_dates: v('hc-dates') || null, is_continuing: v('hc-cont') ? v('hc-cont') === 'yes' : null,
    witnesses: v('hc-wit') || null, prior_complaints: v('hc-prior') || null, legal_counsel: v('hc-counsel') || null,
    signature_name: v('hc-sig'), recipient_ids: to,
  };
  const { error } = await sb.from('harassment_complaints').insert(row);
  if (error) { btn.disabled = false; btn.textContent = 'Send privately'; err.textContent = `Couldn't send: ${error.message}. Your text is still here. You can also report in person.`; return; }
  docs.lastTo = to.filter(id => !subj || id !== subj.id).map(id => (docs.staff.find(s => s.id === id) || {}).name).filter(Boolean);
  await docsLoad(); docsGo('sent');
}
function docsComplaintSent(){
  return `<div class="card shpt-done" style="align-items:flex-start;">
    <div class="shpt-check">✓</div>
    <div style="flex:1;"><div class="q">Your report was sent</div>
      <p class="shpt-p" style="margin-top:6px;">It went privately to ${escapeHtml((docs.lastTo || []).join(', ') || 'the leaders you chose')}. Someone will reach out to you soon. The investigation will be prompt and kept as confidential as possible. You can check the status under My reports.</p>
      <p class="emp-note">If you're in danger, call 911. For free, confidential legal help, call 1-800-HARASS-3.</p>
      <button class="emp-btn" onclick="docsGo('home')">Done</button></div></div>`;
}
/* If the complaint is about one of the leaders, take them off the list automatically. */
function docsSubjChanged(name){
  const subj = docs.staff.find(x => x.name.toLowerCase() === name.trim().toLowerCase());
  document.querySelectorAll('input[name="hc-to"]').forEach(i => {
    const isSubj = subj && i.value === subj.id;
    if (isSubj) i.checked = false;
    i.disabled = !!isSubj;
    i.closest('label').style.opacity = isSubj ? .45 : 1;
  });
}
Object.assign(window, { docsOpen, docsGo, docsSign, docsUpload, docsSendComplaint, docsSubjChanged });
</script>
<style>

<script>
/* =====================================================================
   SUPERVISOR ADD-ON — Responding to Harassment (Salt City's own module; NY doesn't require a separate one)
   Who: GM, LM, Production Manager, COO/CEO/CBO, and anyone titled Shift Lead / Assistant Manager / ... Manager / Supervisor.
   Due: Dec 31 each year; new supervisors within 30 days of their role start date (or hire date).
   Saves to compliance_completions (training_key ny_shpt_sup); progress autosaves to compliance_progress.
   ===================================================================== */
const SUPV_KEY = 'ny_shpt_sup';
const SUPV_ROLES = ['gm','location_manager','production_manager','coo','ceo','cbo'];
const supvIsSup = p => SUPV_ROLES.includes((p || currentProfile).role) || /shift lead|assistant manager|manager|supervisor/i.test((p || currentProfile).job_title || '');
let supv = { loaded:false, rows:[], open:false, step:0, answers:{}, qIdx:0, restored:false };

async function supvLoad(){
  if (!supvIsSup()) { supv.loaded = true; return; }
  const year = Number(eToday().slice(0,4));
  const [{ data: rows }, { data: pr }] = await Promise.all([
    sb.from('compliance_completions').select('*').eq('staff_id', currentProfile.id).eq('training_key', SUPV_KEY).order('completed_on', { ascending:false }),
    sb.from('compliance_progress').select('*').eq('staff_id', currentProfile.id).eq('training_key', SUPV_KEY).eq('compliance_year', year).maybeSingle(),
  ]);
  supv.rows = rows || [];
  if (pr && !supv.restored) Object.assign(supv, { step:pr.step || 0, answers:pr.answers || {}, qIdx:pr.q_idx || 0, resumed:true });
  supv.restored = true; supv.loaded = true;
}
function supvMine(){
  const start = [currentProfile.hire_date, empMe && !empMe.error && empMe.hr ? empMe.hr.grade_started_on : null].filter(Boolean).sort().pop() || null;
  return shptStatus(start, (supv.rows[0] || {}).completed_on || null, eToday());
}
const supvBadge = () => supv.loaded && supvIsSup() && supvMine().state !== 'done' ? '!' : '';

let supvTimer = null;
function supvSave(){
  clearTimeout(supvTimer);
  supvTimer = setTimeout(async () => {
    const year = Number(eToday().slice(0,4));
    if (supv.rows.some(r => r.compliance_year === year)) return;
    await sb.from('compliance_progress').upsert({ staff_id: currentProfile.id, training_key: SUPV_KEY, compliance_year: year, step: supv.step, answers: supv.answers, q_idx: supv.qIdx },
      { onConflict:'staff_id,training_key,compliance_year' });
  }, 300);
}

/* ---------- content ---------- */
const SUPV_STEPS = ['Start','Your duties','When someone tells you','Customers & retaliation','Scenarios','Sign'];
const SUPV_LESSONS = {
  1: { h:'Your duties as a supervisor', body:`
    <p class="shpt-p">Everyone takes the yearly NY training. As a supervisor, the handbook gives you extra responsibilities, and New York law holds supervisors to a higher standard.</p>
    <ul class="supv-list">
      <li><b>You must report.</b> Any complaint you receive, and any harassment you see or hear about (even secondhand, even about a customer), goes to the <b>General Manager or an Owner</b>, <b>the same day</b>.</li>
      <li><b>You can't promise secrecy.</b> You can promise it will only be shared with the people who need to know to fix it.</li>
      <li><b>You don't investigate.</b> Don't question the person accused, ask around, or decide whether it "counts." The GM or an Owner runs the investigation.</li>
      <li><b>You never retaliate, and you don't let anyone else.</b> That includes cutting hours, changing shifts, cold-shouldering, or sudden write-ups for someone who reported or helped.</li>
      <li><b>There are real consequences.</b> Supervisors who harass, retaliate, or let harassment continue face discipline up to termination, and can be personally liable under NY law.</li>
    </ul>
    <div class="emp-disclaimer">If the complaint is about the General Manager, go to an Owner (Aaron, Maria or Jon). If it's about an Owner, go to the General Manager or another Owner.</div>` },
  2: { h:'When someone tells you', body:`
    <div class="supv-cols">
      <div><div class="emp-sub" style="color:var(--green);">Do</div><ul class="supv-list">
        <li>Find a private spot. Listen. Thank them for telling you.</li>
        <li>Say what happens next: "I have to share this with the GM or an Owner so it gets handled. It'll stay as private as possible."</li>
        <li>Ask if they feel safe right now and what they need for the rest of this shift.</li>
        <li>Write down what they said, in their words, with dates and names. Don't add opinions.</li>
        <li>Offer the private form: Academy → Documents &amp; Forms → <b>Report harassment</b>. They don't have to use it.</li>
      </ul></div>
      <div><div class="emp-sub" style="color:var(--red);">Don't</div><ul class="supv-list">
        <li>Don't say "Are you sure?", "He's just like that", or "That's not really harassment."</li>
        <li>Don't confront the person accused or tell the team.</li>
        <li>Don't promise an outcome ("they'll be fired").</li>
        <li>Don't move or reduce the hours of the person who reported to "fix" it.</li>
        <li>Don't wait to see if it happens again.</li>
      </ul></div>
    </div>
    <div class="emp-sub">The first 24 hours</div>
    <ol class="supv-list">
      <li><b>Safety first.</b> If anyone is in danger, call 911.</li>
      <li><b>Report it today.</b> Tell the GM or an Owner directly. If it's after hours, message them and follow up first thing.</li>
      <li><b>Put it in writing.</b> Shift leads, Assistant Managers and LMs: file the complaint form yourself with <b>"I'm reporting this on behalf of someone else"</b> checked. GMs and Owners: use <b>Complaints → Record a verbal complaint</b> in the Command Deck.</li>
      <li><b>Hands off.</b> Any schedule change or other interim step is decided by the GM or an Owner, and it should never cost the person who reported.</li>
    </ol>` },
  3: { h:'Customers, schedules and retaliation', body:`
    <div class="emp-sub">When it's a customer</div>
    <ul class="supv-list">
      <li>Step in. Take over the register or the interaction yourself, or have someone else serve that customer.</li>
      <li>You can ask a customer to stop, refuse service, or ask them to leave. If they won't, or you feel unsafe, call 911.</li>
      <li>Tell the team member they did nothing wrong. Write down what happened (date, time, description of the person) and report it to the GM or an Owner the same day, like any other complaint.</li>
    </ul>
    <div class="emp-sub">Retaliation is easy to do by accident</div>
    <p class="shpt-p">Retaliation is any action that could discourage someone from reporting. It's illegal even if the original complaint isn't proven. Watch for:</p>
    <ul class="supv-list">
      <li>Fewer hours, worse shifts, or moving the person who reported away from their regular schedule or cafe.</li>
      <li>Sudden discipline, attendance points or nit-picking that you wouldn't give anyone else. Before any discipline for someone involved in a complaint, check with the GM or an Owner first.</li>
      <li>Leaving them out, gossip, or letting coworkers take sides.</li>
      <li>Treating witnesses or people who helped differently.</li>
    </ul>` },
};
const SUPV_Q = [
  { id:'customer', q:'A barista says a regular keeps asking for her number. "It\'s not a big deal, don\'t make it weird." What do you do?',
    o:['Let it go, since she said it\'s not a big deal.',
       'Thank her, tell her you need to pass it to the GM or an Owner, take over when that customer comes in, write down what she said, and report it today.',
       'Ban the customer yourself and post about it in the team chat.'], a:1,
    x:'Harassment by customers counts, and you have to report it even if the person downplays it. Handle the customer in the moment, keep it private, and let the GM or an Owner decide next steps.' },
  { id:'rumor', q:'You hear secondhand that an Assistant Manager has been texting a barista inappropriately. Nobody has complained to you. What now?',
    o:['Nothing until someone makes a formal complaint.',
       'Ask a few coworkers what they\'ve seen so you have more to go on.',
       'Report what you heard to the GM or an Owner today, and don\'t investigate it yourself.'], a:2,
    x:'Supervisors must report harassment they become aware of, even secondhand. Asking around or confronting people can hurt the investigation and spread the story.' },
  { id:'secret', q:'A team member says: "I\'ll only tell you if you promise not to tell anyone." What\'s the right answer?',
    o:['"I promise." Then keep it to yourself.',
       '"I can\'t promise that, but I\'ll only share it with the people who need to know to fix it."',
       '"Then don\'t tell me."'], a:1,
    x:'You can\'t promise secrecy because you\'re required to report. You can promise discretion. Being honest up front keeps their trust.' },
  { id:'schedule', q:'A barista reported a coworker. They\'re both on Saturday\'s schedule together. What\'s OK?',
    o:['Move the barista who reported to weekdays so things stay calm.',
       'Ask the GM or an Owner to decide on an interim change that doesn\'t cost the person who reported any hours or preferred shifts.',
       'Leave it and tell them both to keep it professional.'], a:1,
    x:'Interim steps are decided by the GM or an Owner. Moving or cutting the hours of the person who reported can be retaliation, even if it\'s meant kindly.' },
  { id:'discipline', q:'Two weeks after reporting harassment, a barista is late twice. What should you do?',
    o:['Don\'t log it. They\'ve been through enough.',
       'Log it exactly as you would for anyone, but check with the GM or an Owner before any discipline so it\'s reviewed.',
       'Give a written warning right away so it\'s clear the complaint doesn\'t protect them.'], a:1,
    x:'The rules apply the same way to everyone, but discipline right after a complaint can look like retaliation. A second set of eyes protects both of you.' },
  { id:'gm', q:'A shift lead tells you the General Manager made a sexual comment to them. Who do you report to?',
    o:['The General Manager, since all complaints go to the GM.',
       'An Owner (Aaron, Maria or Jon). On the online form, uncheck the GM.',
       'Nobody. It\'s too awkward to report your own boss.'], a:1,
    x:'A complaint never goes to the person it\'s about. The online form also removes them automatically if you name them.' },
];

/* ---------- card in the Required Training tab + Overview ---------- */
function supvCard(){
  if (!supv.loaded || !supvIsSup()) return '';
  const s = supvMine(), cur = supv.rows.find(r => r.compliance_year === s.year);
  const pill = cur ? `<span class="emp-pill green">Done ${eFmt(cur.completed_on)}</span>` : s.state === 'overdue' ? `<span class="emp-pill red">Overdue since ${eFmt(s.due)}</span>` : `<span class="emp-pill amber">Due ${eFmt(s.due)}</span>`;
  return `<div class="card l360-card" style="border-left-color:var(--lead-700);">
    <div><div class="emp-label" style="color:var(--lead-700);">For supervisors · ${s.year}</div>
      <div class="l360-title">Supervisor add-on: responding to harassment</div>
      <div class="emp-note">${pill} About 10 minutes: what you have to do when someone reports harassment, how to handle customers, and how to avoid retaliation.</div></div>
    ${cur ? `<button class="emp-btn ghost" onclick="supvCert('${cur.id}')">Certificate</button>` : `<button class="emp-btn" onclick="supvOpen()">${supv.step > 0 ? 'Continue →' : 'Start →'}</button>`}
  </div>`;
}
function supvOverviewCard(){ return supvBadge() ? supvCard() : ''; }

/* ---------- the flow ---------- */
function supvOpen(){ supv.open = true; if (empTab !== 'compliance') empSwitch('compliance'); else empRender(); window.scrollTo({ top:0, behavior:'smooth' }); }
function supvClose(){ supv.open = false; empRender(); }
function supvGo(d){ supv.step = Math.max(0, Math.min(5, supv.step + d)); supv.resumed = false; supvSave(); empRender(); window.scrollTo({ top:0, behavior:'smooth' }); }
function supvQ(d){ supv.qIdx = Math.max(0, Math.min(SUPV_Q.length - 1, supv.qIdx + d)); supvSave(); empRender(); }
function supvPick(id, k){ const a = supv.answers[id] || (supv.answers[id] = { tries:[] }); if (!a.tries.includes(k)) a.tries.push(k); supvSave(); empRender(); }

function supvView(){
  const nav = (ok = true) => `<div class="shpt-nav">${supv.step ? `<button class="emp-btn ghost" onclick="supvGo(-1)">← Back</button>` : `<button class="emp-btn ghost" onclick="supvClose()">← Required training</button>`}
    <button class="emp-btn" ${ok ? '' : 'disabled'} onclick="supvGo(1)">Next →</button></div>`;
  let body = '';
  if (supv.step === 0) body = `
    <div class="q">Supervisor add-on: responding to harassment</div>
    <p class="shpt-p" style="margin-top:8px;">This is a short Salt City module for everyone who supervises others. It covers your duties under our Sexual Harassment &amp; Discrimination Policy, what to do in the first 24 hours after someone tells you something, how to handle customers, and how to avoid retaliation.</p>
    <p class="shpt-p">It takes about 10 minutes: three short readings, six scenarios, then you sign. Your progress saves as you go. It's in addition to the yearly NY training, not instead of it.</p>
    ${nav()}`;
  else if (SUPV_LESSONS[supv.step]) body = `<div class="q">${SUPV_LESSONS[supv.step].h}</div><div style="margin-top:10px;">${SUPV_LESSONS[supv.step].body}</div>${nav()}`;
  else if (supv.step === 4) {
    const i = supv.qIdx, q = SUPV_Q[i], a = supv.answers[q.id] || { tries:[] }, solved = a.tries.includes(q.a), last = a.tries[a.tries.length - 1];
    const allDone = SUPV_Q.every(x => (supv.answers[x.id] || { tries:[] }).tries.includes(x.a));
    body = `<div class="emp-note">Pick the best answer. If you miss one, read why and try again.</div>
      <div class="emp-sub">Scenario ${i+1} of ${SUPV_Q.length}</div>
      <div class="q" style="font-size:18px; margin-bottom:12px;">${q.q}</div>
      <div class="shpt-opts">${q.o.map((o,k) => `<button class="shpt-opt ${a.tries.includes(k) ? (k===q.a?'right':'wrong') : ''}" ${solved?'disabled':''} onclick="supvPick('${q.id}',${k})">${o}</button>`).join('')}</div>
      ${last != null ? `<div class="shpt-fb ${last===q.a?'right':'wrong'}"><b>${last===q.a?'Correct.':'Not quite. Read why, then try again.'}</b> ${last===q.a ? q.x : ''}</div>` : ''}
      <div class="shpt-nav"><button class="emp-btn ghost" onclick="${i ? 'supvQ(-1)' : 'supvGo(-1)'}">← Back</button>
        <button class="emp-btn" ${solved ? '' : 'disabled'} onclick="${i < SUPV_Q.length-1 ? 'supvQ(1)' : (allDone ? 'supvGo(1)' : 'supvQ(1)')}">Next →</button></div>`;
  } else body = `
    <div class="q">Sign and finish</div>
    <p class="shpt-p" style="margin-top:8px;">I understand my responsibilities as a supervisor under Salt City Coffee's Sexual Harassment &amp; Discrimination Policy. I will report any harassment I see or hear about, including by customers, to the General Manager or an Owner the same day. I won't investigate on my own or promise secrecy, and I won't retaliate or allow retaliation against anyone who reports or helps an investigation.</p>
    <div class="emp-form"><label>Type your full name</label><input id="supv-sig" placeholder="${escapeHtml(currentProfile.name)}" oninput="document.getElementById('supv-submit').disabled = this.value.trim().length < 3">
      <label>Date</label><input value="${eFmt(eToday())}" disabled></div>
    <div class="emp-note" id="supv-err" style="color:var(--red); margin-top:8px;"></div>
    <div class="shpt-nav"><button class="emp-btn ghost" onclick="supvGo(-1)">← Back</button><button class="emp-btn" id="supv-submit" disabled onclick="supvSubmit()">Sign and submit</button></div>`;
  return `
    <div class="shpt-head"><div><div class="emp-label" style="color:var(--lead-700);">For supervisors · Salt City</div>
      <h2 class="shpt-title">Responding to Harassment · ${Number(eToday().slice(0,4))}</h2></div></div>
    <div class="shpt-steps">${SUPV_STEPS.map((n,i) => `<div class="${i===supv.step?'on':''} ${i<supv.step?'past':''}"><span>${i+1}</span>${n}</div>`).join('')}</div>
    ${supv.resumed && supv.step ? `<div class="emp-disclaimer" style="margin:0 0 12px;">Welcome back. You're picking up where you left off (${SUPV_STEPS[supv.step]}).</div>` : ''}
    <div class="card shpt-body">${body}</div>
    <div class="emp-note" style="text-align:right; margin:-12px 4px 16px;">Your progress saves automatically.</div>`;
}
async function supvSubmit(){
  const btn = document.getElementById('supv-submit'), err = document.getElementById('supv-err'), sig = document.getElementById('supv-sig').value.trim();
  btn.disabled = true; btn.textContent = 'Saving…';
  const answers = Object.fromEntries(SUPV_Q.map(q => [q.id, (supv.answers[q.id] || { tries:[] }).tries]));
  const year = Number(eToday().slice(0,4));
  const { error } = await sb.from('compliance_completions').insert({
    staff_id: currentProfile.id, training_key: SUPV_KEY, compliance_year: year, completed_on: eToday(), method:'in_app', language:'en',
    answers, first_try_correct: SUPV_Q.filter(q => (answers[q.id] || [])[0] === q.a).length, question_count: SUPV_Q.length,
    policy_acknowledged: true, signature_name: sig, is_supervisor: true,
  });
  if (error) { btn.disabled = false; btn.textContent = 'Sign and submit'; err.textContent = `Couldn't save: ${error.message}`; return; }
  await sb.from('compliance_progress').delete().eq('staff_id', currentProfile.id).eq('training_key', SUPV_KEY).eq('compliance_year', year);
  supv.restored = false; supv.step = 0; supv.answers = {}; supv.qIdx = 0; supv.open = false;
  await supvLoad(); empBadges(); empRender(); window.scrollTo({ top:0, behavior:'smooth' });
}
function supvCert(id){
  const r = supv.rows.find(x => x.id === id); if (!r) return;
  const w = window.open('', '_blank');
  w.document.write(`<!DOCTYPE html><html><head><title>Certificate</title><style>
    body{font-family:Georgia,serif;margin:0;padding:60px;color:#241A12;} .c{border:6px double #1B365D;padding:56px;text-align:center;max-width:820px;margin:0 auto;}
    h1{font-size:28px;color:#1B365D;letter-spacing:2px;margin:0 0 6px;} .s{color:#7A6A57;font-size:14px;letter-spacing:3px;text-transform:uppercase;}
    .n{font-size:34px;margin:36px 0 8px;border-bottom:1px solid #ccc;display:inline-block;padding:0 40px 6px;} p{font-size:15px;line-height:1.6;}
    .f{display:flex;justify-content:space-between;margin-top:48px;font-size:13px;color:#4A3B2E;text-align:left;}</style></head><body><div class="c">
    <div class="s">Salt City Coffee</div><h1>Certificate of Completion</h1><div class="n">${escapeHtml(currentProfile.name)}</div>
    <p>completed the Supervisor Add-on: Responding to Harassment<br>(supervisor duties, first-response steps, customer harassment and retaliation) for calendar year ${r.compliance_year}.</p>

    <script>setTimeout(()=>window.print(),300)<\/script></body></html>`);
  w.document.close();
}
