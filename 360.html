<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leadership 360 — Salt City Coffee</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  --navy-900:#0D1B2A; --navy:#1B365D; --navy-500:#3E5C85; --navy-300:#A8B9D6;
  --rust:#C75D3D; --rust-900:#8C3E2A; --rust-300:#F4C9A6; --rust-100:#FFF6EE;
  --sage:#6D745A; --gold:#B28C4E; --gold-100:#F6F2E8;
  --ink:#241A12; --ink-soft:#4A3B2E; --muted:#7A6A57;
  --paper:#FFFFFF; --panel:#F7F5F1; --line:#E3DED6;
  --green:#4C7A52; --green-tint:#E8F0E8; --red:#A3453A; --red-tint:#F5E3E0;
  --shadow:0 1px 3px rgba(13,27,42,.08); --shadow-md:0 6px 20px rgba(13,27,42,.10);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Montserrat',sans-serif;background:var(--panel);color:var(--ink);min-height:100vh}
h1,h2,h3{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.4px;color:var(--navy)}
button{font-family:inherit}
[hidden]{display:none!important}
.topbar{position:sticky;top:0;z-index:50;background:linear-gradient(120deg,var(--navy-900),#0a1420);color:#fff;
  padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:var(--shadow-md)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{width:34px;height:34px;border-radius:50%;background:#fff;flex:0 0 auto}
.brand-name{font-family:'Oswald',sans-serif;font-weight:700;font-size:17px;letter-spacing:1px}
.brand-sub{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#9FB3C8}
.prog{display:flex;align-items:center;gap:10px;font-size:11px;color:#B9C4CE;font-weight:600}
.prog-track{width:140px;height:4px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;width:0;background:var(--rust);transition:width .3s}
.wrap{max-width:860px;margin:0 auto;padding:40px 24px 80px}
.eyebrow{font-size:11px;letter-spacing:2.5px;font-weight:700;color:var(--rust);text-transform:uppercase}
.hero h1{font-size:clamp(30px,5vw,44px);margin:8px 0 12px;line-height:1.05}
.hero p{font-size:15px;line-height:1.7;color:var(--ink-soft);max-width:640px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px 26px;box-shadow:var(--shadow);margin-top:22px}
.subject{display:flex;align-items:center;gap:14px;border-left:4px solid var(--rust)}
.subject .nm{font-family:'Oswald',sans-serif;font-size:22px;font-weight:600;color:var(--navy);text-transform:uppercase}
.subject .tt{font-size:13px;color:var(--muted)}
label.fl{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:8px}
.rel{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rel button{padding:14px 10px;border:1.5px solid var(--line);border-radius:12px;background:var(--panel);font-size:13.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;text-align:center;line-height:1.3}
.rel button.on{border-color:var(--rust);background:var(--rust-100);color:var(--rust-900)}
.q{display:grid;grid-template-columns:44px 1fr;gap:14px;padding:22px 0;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:none}
.qn{font-family:'Oswald',sans-serif;font-size:24px;font-weight:600;color:var(--line);line-height:1}
.q.done .qn{color:var(--rust)}
.qt{font-size:15px;line-height:1.6;margin-bottom:14px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{padding:12px 0;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-size:15px;font-weight:700;color:var(--muted);cursor:pointer;transition:all .12s}
.scale button:hover{border-color:var(--navy-300);color:var(--navy)}
.scale button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.scale-lbl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:6px;letter-spacing:.3px}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--rust);color:#fff;border:none;border-radius:10px;padding:14px 26px;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:none;color:var(--navy);border:1.5px solid var(--navy)}
.note{font-size:12.5px;color:var(--muted);line-height:1.6;margin-top:10px}
.err{color:var(--red);font-size:13px;margin-top:10px;min-height:1em}
.center{text-align:center;padding:60px 20px}
.center .icon{width:64px;height:64px;border-radius:50%;background:var(--green-tint);color:var(--green);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 20px}
.center.lock .icon{background:var(--gold-100);color:var(--gold)}
/* ---------- report ---------- */
.rp-cover{background:linear-gradient(135deg,var(--navy-900),var(--navy));color:#fff;border-radius:18px;padding:40px 36px;display:grid;grid-template-columns:1.3fr 1fr;gap:28px;align-items:end}
.rp-cover h1{color:#fff;font-size:clamp(32px,5vw,50px);line-height:1}
.rp-cover h1 em{font-style:normal;color:var(--rust-300)}
.rp-who{margin-top:22px;border-left:3px solid var(--rust);padding-left:14px}
.rp-who .nm{font-family:'Oswald',sans-serif;font-size:22px;text-transform:uppercase;letter-spacing:.5px}
.rp-who .mt{font-size:12px;color:#9FB3C8;margin-top:2px}
.rp-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rp-stat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:14px 16px}
.rp-stat .v{font-family:'Oswald',sans-serif;font-size:28px;font-weight:600;line-height:1.1}
.rp-stat .l{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#9FB3C8;margin-top:4px}
.rp-stat.wide{grid-column:1/-1}
.sec{margin-top:34px}
.sec h2{font-size:22px;margin-bottom:4px}
.sec .lead{font-size:13.5px;color:var(--muted);line-height:1.6;margin-bottom:16px;max-width:680px}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:14px}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--ink-soft)}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.sty{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.sty:last-child{border-bottom:none}
.sty-name{font-family:'Oswald',sans-serif;font-size:16px;text-transform:uppercase;letter-spacing:.4px}
.sty-name small{display:block;font-family:'Montserrat',sans-serif;text-transform:none;letter-spacing:0;font-size:11px;color:var(--muted);font-style:italic;margin-top:2px}
.bars{display:flex;flex-direction:column;gap:5px}
.bar{display:grid;grid-template-columns:92px 1fr 34px;gap:8px;align-items:center;font-size:11px;color:var(--muted)}
.bar-t{height:12px;background:var(--panel);border-radius:6px;overflow:hidden}
.bar-f{height:100%;border-radius:6px}
.bar b{font-weight:700;color:var(--ink);text-align:right;font-size:11.5px}
.gaps{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.gap-card{border-radius:14px;padding:20px;background:#fff;border:1px solid var(--line)}
.gap-card h3{font-size:16px;margin-bottom:4px}
.gap-card p{font-size:12.5px;color:var(--muted);line-height:1.6;margin-bottom:10px}
.gap-row{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:var(--panel);border-radius:9px;margin-top:6px;font-size:13.5px;font-weight:600}
.gap-row .up{color:var(--green)} .gap-row .dn{color:var(--red)}
details.stmt{border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:10px}
details.stmt summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.stmt summary::-webkit-details-marker{display:none}
details.stmt summary .sty-name{font-size:15px}
details.stmt summary .chev{color:var(--rust);font-weight:700;transition:transform .15s}
details.stmt[open] summary .chev{transform:rotate(90deg)}
.st-body{padding:0 16px 14px}
.st{padding:12px 0;border-top:1px solid var(--line)}
.st-q{font-size:13px;font-style:italic;color:var(--ink-soft);margin-bottom:8px;line-height:1.5}
.bfly{display:grid;grid-template-columns:1fr 2px 1fr;gap:0;align-items:center}
.bfly .mid{background:var(--navy-300);height:100%;min-height:24px}
.bf-row{display:grid;grid-template-columns:92px 1fr 30px;gap:6px;align-items:center;font-size:10.5px;color:var(--muted);margin:2px 0;padding-left:6px}
.bf-row.left{grid-template-columns:30px 1fr 34px;padding-left:0;padding-right:6px}
.bf-row.left span{text-align:right}
.bf-t{height:10px;background:var(--panel);position:relative;overflow:hidden}
.bf-f{position:absolute;top:0;bottom:0}
.left .bf-f{right:0} .right .bf-f{left:0}
.bf-row b{color:var(--ink);font-weight:700}
.narr{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.narr-card{background:#fff;border:1px solid var(--line);border-top:4px solid;border-radius:14px;padding:18px}
.narr-card h3{font-size:17px}
.narr-card .ph{font-size:12px;font-style:italic;color:var(--muted);margin:2px 0 8px}
.narr-card .sc{font-family:'Oswald',sans-serif;font-size:30px;font-weight:600;line-height:1}
.narr-card .sc small{font-size:13px;color:var(--muted)}
.narr-card .imp{font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;margin:6px 0 8px}
.narr-card p{font-size:12.5px;line-height:1.6;color:var(--ink-soft)}
.next{background:var(--navy);color:#fff;border-radius:16px;padding:28px;margin-top:34px}
.next h2{color:#fff;font-size:22px}
.next ol{margin:12px 0 0 20px;line-height:1.9;font-size:14px;color:#D8E1EA}
.banner{background:var(--gold-100);border:1px solid #E8D9B8;color:#6b5323;border-radius:12px;padding:12px 16px;font-size:13px;margin-bottom:18px;line-height:1.5}
@media (max-width:720px){
  .topbar{padding:0 14px}.prog-track{width:70px}.brand-sub{display:none}
  .wrap{padding:28px 16px 60px}
  .rel{grid-template-columns:1fr}
  .q{grid-template-columns:30px 1fr;gap:10px}
  .rp-cover{grid-template-columns:1fr;padding:28px 22px}
  .sty{grid-template-columns:1fr}
  .gaps,.narr{grid-template-columns:1fr}
  .bar{grid-template-columns:80px 1fr 30px}
}
@media print{.topbar{position:static}.no-print{display:none!important}body{background:#fff}}
</style>
</head>

function wireScale(onComplete){

/* ---------------- Rater (private link, no login) ---------------- */
async function raterMode(token){
  const { data, error } = await sb.rpc("l360_rater_info", { p_token: token });
  if(error || !data) return locked("Link not found", "This 360 link isn't valid. Check with whoever sent it to you.");
  if(data.kind === "gm_360"){ location.replace("gm360.html" + location.search); return; }
  if(data.status !== "collecting") return locked("This 360 is closed", "It's no longer taking responses. Thanks for checking in.");
  const first = esc(String(data.subject_name).split(" ")[0]);
  let rel = null;
  $("#app").innerHTML = `
    <div class="hero"><div class="eyebrow">Confidential feedback</div><h1>How do you see ${first} lead?</h1>
      <p>Rate each statement on what you've actually seen, from 1 (strongly disagree) to 5 (strongly agree). It takes about 5 minutes. Your name isn't asked for or stored, and ${first} only ever sees averages by group.</p></div>
    <div class="card subject"><div><div class="nm">${esc(data.subject_name)}</div><div class="tt">${esc(data.subject_title || "")}</div></div></div>
    <div class="card"><label class="fl">Your relationship to ${first}</label>
      <div class="rel" id="rel">
        <button type="button" data-r="manager">I'm their manager</button>
        <button type="button" data-r="peer">I'm a peer</button>
        <button type="button" data-r="direct_report">I report to them</button>
      </div></div>
    <div class="card" id="qs">${renderQuestions(first)}</div>
    <div class="card"><button class="btn" id="submit" disabled>Submit my feedback →</button><div class="err" id="err"></div>
      <p class="note">Answer all 30 statements and pick your relationship to submit. Peer and direct-report answers are only shown once at least two people in that group have answered.</p></div>`;
  const sync = ok => { $("#submit").disabled = !(ok && rel); };
  document.querySelectorAll("#rel button").forEach(b => b.addEventListener("click", () => {
    rel = b.dataset.r; document.querySelectorAll("#rel button").forEach(x => x.classList.toggle("on", x === b));
    sync(answers.every(Boolean));
  }));
  wireScale(sync);
  $("#submit").addEventListener("click", async () => {
    $("#submit").disabled = true; $("#submit").textContent = "Submitting…";
    const { error } = await sb.rpc("l360_submit", { p_token: token, p_rater_type: rel, p_answers: answers });
    if(error){ $("#err").textContent = error.message; $("#submit").disabled = false; $("#submit").textContent = "Submit my feedback →"; return; }
    done("Feedback received", `Thank you. Your answers are confidential and only appear as part of group averages. You can close this page.`);
  });
}

  wireScale(ok => { $("#submit").disabled = !ok; });
  $("#submit").addEventListener("click", async () => {
    $("#submit").disabled = true; $("#submit").textContent = "Submitting…";
    const { error } = await sb.rpc("l360_submit_self", { p_id: id, p_answers: answers });
    if(error){ $("#err").textContent = error.message; $("#submit").disabled = false; $("#submit").textContent = "Submit my self-assessment →"; return; }
    done("Self-assessment in", `Thanks. Your report opens in the Academy once your manager releases it. <br><br><a class="btn" href="academy.html">Back to the Academy →</a>`);
  });
}

/* ---------------- Report (signed in) ---------------- */
const fmt = v => v == null ? "—" : Number(v).toFixed(1);
function styleAvg(arr, si){ if(!arr) return null; const s = arr.slice(si*5, si*5+5).map(Number); return s.reduce((a,b)=>a+b,0)/5; }

async function reportMode(id){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ location.replace("/?next=" + encodeURIComponent(location.pathname + location.search)); return; }
  const { data: r, error } = await sb.rpc("l360_report", { p_id: id });
  if(r && r.kind === "gm_360"){ location.replace("gm360.html" + location.search); return; }
  if(error) return locked("Report not available yet", esc(error.message) + `<br><br><a href="academy.html">Back to the Academy</a>`);
  $("#report-actions").hidden = false;
  const counts = r.counts || {}, groups = r.groups || {};
  const raters = (counts.manager||0) + (counts.peer||0) + (counts.direct_report||0);
  const others = r.others;
  const self = groups.self || null;
  const S = STYLES.map((st, si) => ({ ...st, si, self: styleAvg(self, si), others: styleAvg(others, si),
    g: Object.fromEntries(GROUPS.map(g => [g.key, styleAvg(groups[g.key], si)])) }));
  const ref = others ? "others" : "self";
  const dom = [...S].sort((a,b) => (b[ref]||0) - (a[ref]||0))[0];
  const gaps = S.filter(s => s.self != null && s.others != null).map(s => ({ ...s, d: Math.round((s.others - s.self)*10)/10 }));
  const blind = gaps.filter(g => g.d >= .5).sort((a,b)=>b.d-a.d);
  const over = gaps.filter(g => g.d <= -.5).sort((a,b)=>a.d-b.d);
  const hidden = ["peer","direct_report"].filter(k => counts[k] && !groups[k]);
  const shownGroups = GROUPS.filter(g => groups[g.key]);
  const date = new Date(r.released_at || r.created_at).toLocaleDateString("en-US", { month:"long", day:"numeric", year:"numeric" });
  const bar = (label, v, color) => `<div class="bar"><span>${label}</span><div class="bar-t"><div class="bar-f" style="width:${v==null?0:(v/5*100)}%;background:${color}"></div></div><b>${fmt(v)}</b></div>`;

  $("#app").innerHTML = `
    ${r.status !== "released" ? `<div class="banner no-print"><b>Preview.</b> ${esc(r.subject_name)} can't see this yet. Release it from the Command Deck when enough responses are in.</div>` : ""}
    <div class="rp-cover">
      <div><div class="eyebrow" style="color:var(--rust-300)">Leadership 360</div><h1>Your<br><em>leadership</em><br>report</h1>
        <div class="rp-who"><div class="nm">${esc(r.subject_name)}</div><div class="mt">${esc(r.subject_title || "")} · ${date}</div></div></div>
      <div class="rp-stats">
        <div class="rp-stat"><div class="v">${raters}</div><div class="l">Raters</div></div>
        <div class="rp-stat"><div class="v">${self ? "Yes" : "No"}</div><div class="l">Self-assessment</div></div>
        <div class="rp-stat wide"><div class="v" style="color:var(--rust-300)">${dom.name}</div><div class="l">Strongest style (${others ? "as others see you" : "self-rated"})</div></div>
      </div>
    </div>

    <div class="sec card">
      <h2>All six styles</h2>
      <p class="lead">Average score (1–5) for each style from every group that answered.${hidden.length ? ` ${hidden.map(k => GROUPS.find(g=>g.key===k).label).join(" and ")} had only one response, so ${hidden.length>1?"they're":"it's"} counted in “Everyone else” but not shown on ${hidden.length>1?"their":"its"} own.` : ""}</p>
      <div class="legend">${shownGroups.map(g => `<span><i style="background:${g.color}"></i>${g.label} (${counts[g.key]})</span>`).join("")}${others ? `<span><i style="background:#0D1B2A"></i>Everyone else (${raters})</span>` : ""}</div>
      ${S.map(s => `<div class="sty"><div class="sty-name" style="color:${s.color}">${s.name}<small>${s.phrase}</small></div>
        <div class="bars">${shownGroups.map(g => bar(g.label, s.g[g.key], g.color)).join("")}${others ? bar("Everyone else", s.others, "#0D1B2A") : ""}</div></div>`).join("")}
    </div>

    ${gaps.length ? `<div class="sec"><h2>How others see you vs. how you see yourself</h2>
      <p class="lead">Differences of half a point or more between your self-rating and everyone else's average.</p>
      <div class="gaps">
        <div class="gap-card" style="border-top:4px solid var(--green)"><h3>Others rate you higher</h3><p>Strengths you may be underusing.</p>
          ${blind.length ? blind.map(g => `<div class="gap-row"><span style="color:${g.color}">${g.name}</span><span class="up">+${g.d.toFixed(1)}</span></div>`).join("") : `<p>No big gaps here.</p>`}</div>
        <div class="gap-card" style="border-top:4px solid var(--red)"><h3>You rate yourself higher</h3><p>Where your intent may not be landing the way you think.</p>
          ${over.length ? over.map(g => `<div class="gap-row"><span style="color:${g.color}">${g.name}</span><span class="dn">${g.d.toFixed(1)}</span></div>`).join("") : `<p>No big gaps here.</p>`}</div>
      </div></div>` : ""}

    <div class="sec"><h2>Statement by statement</h2>
      <p class="lead">Each style's five statements. Your self-rating extends left from the center line; everyone else extends right.</p>
      ${S.map((s, i) => `<details class="stmt" ${i===0?"open":""}><summary><span class="sty-name" style="color:${s.color}">${s.name}</span><span style="font-size:12px;color:var(--muted)">Self ${fmt(s.self)} · Others ${fmt(s.others)} <span class="chev">›</span></span></summary>
        <div class="st-body">${[0,1,2,3,4].map(k => { const qi = s.si*5+k; const sv = self ? Number(self[qi]) : null;
          const rows = [...shownGroups.filter(g => g.key !== "self").map(g => [g.label, groups[g.key][qi], g.color]), ...(others ? [["Everyone else", others[qi], "#0D1B2A"]] : [])];
          return `<div class="st"><div class="st-q">“This leader ${esc(STATEMENTS[qi])}”</div>
            <div class="bfly"><div class="left"><div class="bf-row left"><b>${fmt(sv)}</b><div class="bf-t"><div class="bf-f" style="width:${sv?((sv-1)/4*100):0}%;background:#B28C4E"></div></div><span>Self</span></div></div>
            <div class="mid"></div>
            <div class="right">${rows.map(([l,v,c]) => `<div class="bf-row"><span>${l}</span><div class="bf-t"><div class="bf-f" style="width:${v==null?0:((Number(v)-1)/4*100)}%;background:${c}"></div></div><b>${fmt(v)}</b></div>`).join("")}</div></div></div>`; }).join("")}</div></details>`).join("")}
    </div>

    <div class="sec"><h2>What each style means</h2>
      <p class="lead">Scores shown are everyone else's average${others ? "" : " (self-rating, since no one else has answered yet)"}. The best leaders move between styles on purpose.</p>
      <div class="narr">${S.map(s => { const v = others ? s.others : s.self; return `<div class="narr-card" style="border-top-color:${s.color}">
        <h3 style="color:${s.color}">${s.name}</h3><div class="ph">${s.phrase}</div>
        <div class="sc" style="color:${s.color}">${fmt(v)}<small>/5</small></div>
        <div class="imp" style="color:${s.good ? "var(--green)" : "var(--rust-900)"}">${s.impact}</div><p>${s.blurb}</p></div>`; }).join("")}</div>
    </div>

    <div class="next"><h2>Next steps</h2><ol>
      <li>Read it through once on your own before talking it over.</li>
      <li>Pick one style to lean into and one to dial back.</li>
      <li>Bring both to your next 1-1. They'll become your Top 3 in the Academy.</li>
      <li>Retake the 360 in about six months to see what moved.</li></ol></div>`;
}

(function route(){
  if(params.get("t")) return raterMode(params.get("t"));
  if(params.get("self")) return selfMode(params.get("self"));
  if(params.get("report")) return reportMode(params.get("report"));
  locked("Leadership 360", "Open this page from a 360 link, the Academy or the Command Deck.");
})();
</script>
</body>
</html>
